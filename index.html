function renderWin(){
  var m = state.match;
  var w = m.players.find(function(p){return p.id===m.winnerId;});
  var multi = (m.bestOf||1)>1;
  var plz = m.platz || [];
  var rows = m.players.slice().sort(function(a,b){
    var ia = plz.indexOf(a.id), ib = plz.indexOf(b.id);
    if(ia>=0 || ib>=0) return (ia<0?99:ia) - (ib<0?99:ib);   // Platzierung schlaegt Legs
    return b.legsWon-a.legsWon;
  }).map(function(p){
    var d = [];
    if(p.checkout) d.push("Finish "+p.checkout);
    if(p.best) d.push("Beste "+p.best);
    if(p.oneEighties) d.push(p.oneEighties+"&times;180");
    var pos = plz.indexOf(p.id);
    var zahl = pos>=0 ? (pos+1)+"." : (multi?p.legsWon:(p.id===m.winnerId?1:0));
    return '<div class="rank"><div class="nm">'+esc(p.name)
      + '<div class="sublbl">&#8960; '+(p.darts?(p.scored/p.darts*3).toFixed(1):"0.0")
      + ' &middot; '+p.darts+(p.darts===1?' Dart':' Darts')
      + (d.length?' &middot; '+d.join(" &middot; "):'')+'</div></div>'
      + '<div class="wins">'+zahl+'<small>'+(pos>=0?'Platz':'Legs')+'</small></div></div>';
  }).join("");
  return h()
    + '<div class="win"><div class="trophy">&#127942;</div>'
    + '<h2>'+esc(w?w.name:"?")+(m.players.length<2?' hat es geschafft!':' gewinnt!')+'</h2>'
    + '<div class="sub">'+m.gameType+(multi?' &middot; Best of '+m.bestOf:'')
      + ' &middot; '+(m.doubleOut?'Doppel-Out':'beliebiger Ausgang')+'</div></div>'
    + (function(){
        // Allein gespielt gibt es keinen Gegner - der eigene Rekord ist die Messlatte.
        if(m.players.length!==1) return '';
        var alt = bestSolo(m.players[0].id, m.gameType);
        var jetzt = m.players[0].darts;
        if(!alt) return '<div class="okmsg" style="text-align:center">Erster Lauf &ndash; das ist ab jetzt dein Rekord: '
          + jetzt + ' Darts.</div>';
        if(jetzt < alt.darts) return '<div class="okmsg" style="text-align:center">Neuer Rekord! '
          + jetzt + ' statt ' + alt.darts + ' Darts.</div>';
        return '<div class="hint">'+jetzt+' Darts &middot; Rekord steht bei '+alt.darts+'.</div>';
      })()
    + '<div class="card" style="margin-bottom:14px">'+rows+'</div>'
    + '<div class="stack">'
    + (state.settings.keepHistory!==false
        ? '<button class="btn primary" data-act="winagain">Speichern &middot; nochmal</button>'
          + '<button class="btn" data-act="winhome">Speichern &middot; zur Rangliste</button>'
        : '<button class="btn primary" data-act="winagain">Nochmal</button>'
          + '<button class="btn" data-act="winhome">Zur Rangliste</button>'
          + '<div class="hint">Verlauf ist aus &ndash; dieses Spiel wird nicht mitgezählt.</div>')
    + '<button class="btn ghost" data-act="undo">&#8630; Doch nicht &ndash; letzten Dart zurück</button>'
    + '</div>';
}

// ---------------------------------------------------------------------------
// Direktvergleich (H2H): "wie steht es zwischen NUR Arne und mir"
// Gezaehlt werden ausschliesslich Matches, in denen genau diese zwei gespielt
// haben. Runden zu dritt werden getrennt ausgewiesen - sonst waere die Bilanz
// eine andere Zahl, als Lion im Kopf hat.
// ---------------------------------------------------------------------------
function h2h(idA, idB){
  var r = {a:idA, b:idB, n:0, winsA:0, winsB:0, legsA:0, legsB:0,
           dartsA:0, dartsB:0, scoredA:0, scoredB:0, bestA:0, bestB:0,
           coA:0, coB:0, t180A:0, t180B:0, games:[], multiN:0, multiA:0, multiB:0};
  for(var i=0;i<state.history.length;i++){
    var m = state.history[i];
    var pa = null, pb = null;
    for(var j=0;j<m.players.length;j++){
      if(m.players[j].id===idA) pa = m.players[j];
      if(m.players[j].id===idB) pb = m.players[j];
    }
    if(!pa || !pb) continue;
    if(m.players.length!==2){                       // Runde zu dritt: separat
      r.multiN++;
      if(m.winnerId===idA) r.multiA++;
      if(m.winnerId===idB) r.multiB++;
      continue;
    }
    r.n++;
    if(m.winnerId===idA) r.winsA++; else if(m.winnerId===idB) r.winsB++;
    r.legsA += pa.legsWon||0;  r.legsB += pb.legsWon||0;
    r.dartsA += pa.darts||0;   r.dartsB += pb.darts||0;
    r.scoredA += pa.scored||0; r.scoredB += pb.scored||0;
    r.t180A += pa.oneEighties||0; r.t180B += pb.oneEighties||0;
    if((pa.best||0) > r.bestA) r.bestA = pa.best||0;
    if((pb.best||0) > r.bestB) r.bestB = pb.best||0;
    if((pa.checkout||0) > r.coA) r.coA = pa.checkout||0;
    if((pb.checkout||0) > r.coB) r.coB = pb.checkout||0;
    r.games.push({ts:m.ended||m.ts, gameType:m.gameType, bestOf:m.bestOf,
                  winnerId:m.winnerId, legsA:pa.legsWon||0, legsB:pb.legsWon||0});
  }
  r.avgA = r.dartsA ? +((r.scoredA/r.dartsA*3).toFixed(1)) : 0;
  r.avgB = r.dartsB ? +((r.scoredB/r.dartsB*3).toFixed(1)) : 0;
  r.games.sort(function(x,y){return y.ts-x.ts;});
  r.streak = streakOf(r.games);
  return r;
}
// Aktuelle Serie: wer hat die letzten n Duelle in Folge geholt (games neueste zuerst).
function streakOf(games){
  if(!games.length) return null;
  var who = games[0].winnerId, n = 0;
  for(var i=0;i<games.length;i++){ if(games[i].winnerId!==who) break; n++; }
  return {id:who, n:n};
}

// Alle 1-gegen-1-Paarungen, die es wirklich gab - nach Spielzahl sortiert.
function allDuels(){
  var map = {};
  for(var i=0;i<state.history.length;i++){
    var m = state.history[i];
    if(m.players.length!==2) continue;
    var raw = m.players[0].id < m.players[1].id
      ? [m.players[0].id, m.players[1].id] : [m.players[1].id, m.players[0].id];
    var key = raw[0]+"|"+raw[1];
    if(!map[key]){
      var ord = orderPair(raw[0], raw[1]);
      map[key] = {a:ord[0], b:ord[1], n:0, winsA:0, winsB:0, last:0};
    }
    var d = map[key];
    d.n++;
    if(m.winnerId===d.a) d.winsA++; else if(m.winnerId===d.b) d.winsB++;
    if((m.ended||m.ts) > d.last) d.last = m.ended||m.ts;
  }
  var out = [];
  for(var k in map) out.push(map[k]);
  out.sort(function(x,y){ return (y.last-x.last) || (y.n-x.n); });
  return out;
}

// Ein geloeschter Spieler steht weiter in der Historie - dort steht auch sein
// Name. Ohne diesen Rueckgriff zeigt die App den rohen Schluessel ("arne").
function nameOf(id){
  var r = rosterOf(id); if(r) return r.name;
  for(var i=0;i<state.history.length;i++){
    var ps = state.history[i].players||[];
    for(var j=0;j<ps.length;j++) if(ps[j].id===id && ps[j].name) return ps[j].name;
  }
  return id;
}

function renderH2H(){
  // Solange Lion nicht selbst gewaehlt hat, zeigt der Screen immer das zuletzt
  // gespielte Duell - sonst klebt eine alte Vorbelegung fest, obwohl inzwischen
  // ganz andere Leute gegeneinander gespielt haben.
  // Nur vorbelegen, solange Lion nicht selbst gewaehlt hat - sonst springt ein
  // abgewaehlter Chip sofort zurueck und die Auswahl fuehlt sich kaputt an.
  if(h2hAuto || !h2hSel){
    var d0 = allDuels()[0];
    if(d0) h2hSel = [d0.a, d0.b];
    else {
      var ids = state.roster.slice(0,2).map(function(p){return p.id;});
      h2hSel = ids.length===2 ? orderPair(ids[0], ids[1]) : ids;
    }
    h2hAuto = true;
  }
  var chips = state.roster.map(function(p){
    var k = h2hSel.indexOf(p.id);
    var cls = k===0 ? " on a" : (k===1 ? " on b" : "");
    return '<button class="chip'+cls+'" data-act="h2hpick" data-id="'+p.id+'">'
      + esc(p.name)+(p.id===meId()?' &#9733;':'')+'</button>';
  }).join("");

  if(h2hSel.length<2){
    return h()
      + '<button class="btn ghost sm" data-act="nav" data-view="home" style="width:auto;margin-bottom:12px">&#8592; Zurück</button>'
      + '<label class="lbl">Zwei Spieler antippen</label>'
      + '<div class="chips">'+chips+'</div>'
      + '<div class="hint">Noch '+(2-h2hSel.length)+' auswählen.</div>';
  }

  var A = h2hSel[0], B = h2hSel[1], r = h2h(A,B);
  var na = esc(nameOf(A)), nb = esc(nameOf(B));
  var tot = r.winsA + r.winsB;
  var pct = tot ? Math.round(r.winsA/tot*100) : 50;

  var dots = r.games.slice(0,7).map(function(g){
    return '<span class="dot2 '+(g.winnerId===A?"a":(g.winnerId===B?"b":"n"))+'"></span>';
  }).join("");

  var rows = r.games.slice(0,12).map(function(g){
    var win = g.winnerId===A ? na : nb;
    var res = (g.bestOf>1)
      ? (g.winnerId===A ? g.legsA+':'+g.legsB : g.legsB+':'+g.legsA) : '&mdash;';
    return '<div class="grow">'
      + '<div class="gdate">'+fmtDate(g.ts)+'</div>'
      + '<div class="gmain"><b>'+win+'</b> gewinnt'
        + '<span class="gsub">'+g.gameType+(g.bestOf>1?' &middot; Bo'+g.bestOf+' &middot; '+res:'')+'</span></div>'
      + '<div class="gdot '+(g.winnerId===A?"a":"b")+'"></div>'
      + '</div>';
  }).join("");

  function line(label, va, vb){
    var lead = va===vb ? "" : (va>vb ? " la" : " lb");
    return '<div class="cmp'+lead+'"><span class="ca">'+va+'</span>'
      + '<span class="cl">'+label+'</span><span class="cb">'+vb+'</span></div>';
  }

  var streakTxt = "";
  if(r.streak && r.streak.n>=2) streakTxt = esc(nameOf(r.streak.id))+' hat die letzten '+r.streak.n+' geholt';
  else if(r.streak) streakTxt = esc(nameOf(r.streak.id))+' hat zuletzt gewonnen';

  return h()
    + '<button class="btn ghost sm" data-act="nav" data-view="home" style="width:auto;margin-bottom:12px">&#8592; Zurück</button>'
    + '<div class="chips">'+chips+'</div>'
    + '<div class="card h2hcard">'
    +   '<div class="h2hnames"><span>'+na+'</span><span class="vs">vs</span><span>'+nb+'</span></div>'
    +   '<div class="h2hbig"><span class="a">'+r.winsA+'</span><span class="sep">:</span><span class="b">'+r.winsB+'</span></div>'
    +   (tot ? '<div class="bar"><i style="width:'+pct+'%"></i></div>'
             + '<div class="h2hsub">'
               + (r.winsA===r.winsB ? 'ausgeglichen'
                  : (r.winsA>r.winsB ? pct+' % für '+na : (100-pct)+' % für '+nb))
               + ' &middot; '+tot+(tot===1?' Duell':' Duelle')+'</div>'
           : '<div class="h2hsub">Noch kein Duell zu zweit gespielt.</div>')
    +   (streakTxt ? '<div class="h2hstreak">&#128293; '+streakTxt+'</div>' : '')
    + '</div>'
    + (r.n ? '<div class="card" style="margin-top:12px">'
        + ((r.legsA+r.legsB > r.winsA+r.winsB) ? line("Legs", r.legsA, r.legsB) : "")
        + line("Schnitt je 3 Darts", r.avgA, r.avgB)
        + line("Beste Aufnahme", r.bestA, r.bestB)
        + line("Höchstes Finish", r.coA, r.coB)
        + (r.t180A||r.t180B ? line("180er", r.t180A, r.t180B) : "")
        + '</div>' : '')
    + (dots ? '<div class="dots">'+dots+'<span class="dotsl">letzte Duelle, links = neu</span></div>' : '')
    + (r.multiN ? '<div class="hint" style="text-align:left;margin-top:12px">'
        + 'Dazu '+r.multiN+(r.multiN===1?' Runde':' Runden')+' mit mehr Leuten &middot; '
        + na+' '+r.multiA+' &middot; '+nb+' '+r.multiB
        + ' <span class="muted">(zählen nicht ins Duell)</span></div>' : '')
    + (rows ? '<label class="lbl" style="margin-top:16px">Die letzten Duelle</label>'
        + '<div class="card">'+rows+'</div>' : '')
    + '<button class="btn primary" data-act="duelstart" style="margin-top:14px">'
      + '&#127919;&nbsp; '+na+' gegen '+nb+' spielen</button>';
}

// ---------------------------------------------------------------------------
// Einstellungen + Datensicherung
// Die App fuehrt jetzt eine Historie - ein geleerter Browser-Cache wuerde sie
// ersatzlos vernichten. Darum Export/Import direkt hier drin.
// ---------------------------------------------------------------------------
function exportPayload(){ return {app:"darts", v:2, exported:Date.now(), state:state}; }

// Verlauf loeschen, ohne dass Lion von 10 Wins auf 1 zurueckfaellt: der
// abgeleitete Stand wird vorher in den Handeintrag eingefroren.
function clearHistory(){
  state.roster.forEach(function(p){ p.winsManual = totalWins(p.id); });
  state.history = []; save();
}
function resetAll(){
  state = defaultState(); standUebernommen(); save();
}

function exportBlob(){
  var data = JSON.stringify(exportPayload(), null, 1);
  var name = "darts-sicherung-" + new Date().toISOString().slice(0,10) + ".json";
  try{
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([data], {type:"application/json"}));
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 800);
    return true;
  }catch(e){ return false; }
}
// writeText liefert ein Promise. Frueher wurde sofort "true" gemeldet und die
// Ablehnung landete als unbehandelter Fehler - der Screen log, die Sicherung
// existierte nicht.
function exportClipboard(fertig){
  var data = JSON.stringify(exportPayload());
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(data).then(function(){ fertig(true); },
                                              function(){ fertig(false); });
      return;
    }
  }catch(e){}
  fertig(false);
}
// Import: ersetzt den kompletten Stand. Wird nur nach Rueckfrage aufgerufen.
function importText(txt){
  var neu;
  try{
    var obj = JSON.parse(txt);
    var st = obj && obj.state ? obj.state : obj;
    if(!st || !Array.isArray(st.roster) || !st.roster.length) return "In der Datei steht kein Team.";
    // Eintraege ohne Spielerliste bringen jede Auswertung zum Absturz - und der
    // kaputte Stand laege danach schon im Speicher, also auch nach dem Neustart.
    if(Array.isArray(st.history))
      st.history = st.history.filter(function(m){ return m && Array.isArray(m.players) && m.players.length; });
    if(Array.isArray(st.practice))
      st.practice = st.practice.filter(function(r){ return r && r.playerId && r.mode; });
    neu = upgradeShape(st);
  }catch(e){
    return "Die Sicherung ist beschädigt und wurde nicht eingespielt.";
  }
  state = neu;
  standUebernommen();
  save();
  return null;
}

// Safari raeumt localStorage nach sieben Tagen ohne Besuch ab - ausser die Seite
// wurde auf den Home-Bildschirm gelegt. Genau der Fall "einmal die Woche spielen".
function istSafariOhneInstall(){
  try{
    var ua = navigator.userAgent || "";
    var safari = /Safari/.test(ua) && !/Chrome|Chromium|Android|Edg/.test(ua);
    var install = (window.navigator && window.navigator.standalone) ||
      (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
    return safari && !install;
  }catch(e){ return false; }
}

// Der Bedienteil zum Sync. Bewusst zwei getrennte Wege: einer macht den Raum
// auf, der andere tritt bei - "verbinden" allein waere mehrdeutig.
// Im Spiel steht der Verbindungszustand als kleine Pille. Vorher gab es ihn nur
// in den Einstellungen - man haette also erst wegnavigieren muessen, um zu sehen,
// ob das zweite Handy ueberhaupt noch mitzaehlt.
// Nach dem Einschalten zum Mikro-Block scrollen. Defensiv: im Testlauf gibt es
// kein scrollIntoView, und ein fehlender Scroll darf nie das Spiel aufhalten.
function zeigMikroBlock(){
  try{
    var el = document.getElementById("voiceStatus");
    if(el && el.parentNode && typeof el.parentNode.scrollIntoView === "function")
      el.parentNode.scrollIntoView({ block:"end", behavior:"smooth" });
  }catch(e){}
}

// ---- Neue Version auf dem Server? ---------------------------------------
// Der Service Worker ist network-first, aber eine installierte PWA laedt beim
// Antippen nicht zwingend neu - ein Handy kann tagelang auf einem alten Stand
// bleiben. Mit zwei Handys in derselben Runde ist das ein echtes Risiko, denn
// das Sync-Format traegt eine Versionsnummer.
var neuereVersion = null;
var versionsPruefer = null;      // im Test austauschbar

function pruefeVersion(){
  var f = versionsPruefer;
  if(!f){
    if(typeof fetch !== "function") return;
    f = function(){
      return fetch("./VERSION?t=" + new Date().getTime(), { cache:"no-store" })
        .then(function(r){ return r.text(); });
    };
  }
  try{
    f().then(function(txt){
      var neu = String(txt || "").trim();
      // Nur eine PLAUSIBLE Versionsnummer zaehlt: bei einem Fehler liefert der
      // Server eine HTML-Seite, und die wuerde sonst als "neue Version" gelten.
      if(/^1\.\d+$/.test(neu) && neu !== VER){ neuereVersion = neu; render(); }
    }, function(){});
  }catch(e){}
}

function versionsHinweis(){
  if(!neuereVersion) return "";
  return '<div class="warnzeile" data-act="neuladen" style="cursor:pointer">'
    + '&#8635; <b>Version ' + esc(neuereVersion) + '</b> ist da &ndash; zum Neuladen tippen.</div>';
}

function syncPille(){
  if(!syncAn()) return "";
  // Die Warnung ERSETZT die Pille nicht - sonst sieht man im wichtigsten Moment
  // nicht mehr, ob ueberhaupt noch eine Verbindung steht und zu welchem Raum.
  var warn = syncFremdeVersion
    ? '<div class="warnzeile">&#9888;&#65039; Das andere Handy l&auml;uft auf einer '
      + '<b>anderen Version</b> &ndash; dort die App einmal neu laden.</div>'
    : syncVerworfen
    ? '<div class="warnzeile">&#9888;&#65039; Das andere Handy hatte einen neueren '
      + 'Stand &ndash; deine letzten Eingaben wurden <b>überschrieben</b>.</div>'
    : "";
  var lage = syncLage();
  var kl = lage === "offen" ? "syncpille" : "syncpille aus";
  var txt = lage === "offen" ? "&#128241; " + esc(syncRaum)
          : lage === "verbinde" ? "&#128241; verbindet &hellip;"
          : "&#128241; " + esc(syncRaum) + " &ndash; keine Verbindung";
  return warn + '<div class="' + kl + '">' + txt + '</div>';
}

// Allein üben
// Trainings landen in state.practice, NICHT in state.history - sonst zaehlte
// jede Uebungsrunde als Sieg und die Rangliste waere Unsinn.
// ---------------------------------------------------------------------------
var TRAIN = {
  double: {
    name: "Doppel-Training",
    hint: "Jedes Doppel von D1 bis Bull, drei Darts pro Ziel.",
    max: 21,
    targets: (function(){
      var t=[]; for(var i=1;i<=20;i++) t.push({num:i, mult:2, label:"Doppel "+i, short:"D"+i});
      t.push({num:50, mult:1, label:"Bull", short:"Bull"}); return t;
    })(),
    unit: "Treffer"
  },
  around: {
    name: "Around the Clock",
    hint: "1 bis 20, dann Bull. Drei Darts pro Zahl, Doppel und Triple zählen auch.",
    max: 21,
    targets: (function(){
      var t=[]; for(var i=1;i<=20;i++) t.push({num:i, mult:1, label:"Die "+i, short:""+i});
      t.push({num:50, mult:1, label:"Bull", short:"Bull"}); return t;
    })(),
    unit: "Treffer"
  }
};

function startTraining(mode, playerId){
  var cfg = TRAIN[mode]; if(!cfg) return;
  state.train = {mode:mode, playerId:playerId, idx:0, tries:0, hits:0,
                 darts:0, results:[], done:false, ts:Date.now()};
  view = "train"; save();
}
function trainTarget(){
  var tr = state.train; if(!tr) return null;
  var cfg = TRAIN[tr.mode];
  return tr.idx < cfg.targets.length ? cfg.targets[tr.idx] : null;
}
// Ein Dart aufs aktuelle Ziel: getroffen ja/nein. Drei Fehlversuche = weiter.
function trainDart(hit){
  var tr = state.train; if(!tr || tr.done) return "noop";
  tr.darts++; tr.tries++;
  if(hit){
    tr.hits++;
    tr.results.push({target:tr.idx, hit:true, darts:tr.tries});
    tr.idx++; tr.tries=0;
  } else if(tr.tries>=3){
    tr.results.push({target:tr.idx, hit:false, darts:3});
    tr.idx++; tr.tries=0;
  }
  if(tr.idx >= TRAIN[tr.mode].targets.length){ tr.done = true; save(); return "done"; }
  save(); return hit ? "hit" : "miss";
}
function trainUndo(){
  var tr = state.train; if(!tr || !tr.results.length && !tr.tries) return;
  if(tr.tries>0){ tr.tries--; tr.darts--; tr.done=false; save(); return; }
  var last = tr.results.pop();
  tr.idx = last.target;
  tr.tries = Math.max(0, last.darts-1);
  tr.darts = Math.max(0, tr.darts-1);
  if(last.hit) tr.hits = Math.max(0, tr.hits-1);
  tr.done = false; save();
}
function finishTraining(){
  var tr = state.train; if(!tr) return null;
  var rec = null;
  if(tr.done && state.settings.keepHistory!==false){
    rec = {id:mid(), ts:tr.ts, ended:Date.now(), mode:tr.mode, playerId:tr.playerId,
           score:tr.hits, max:TRAIN[tr.mode].max, darts:tr.darts};
    state.practice.unshift(rec);
    capPractice();
  }
  state.train = null; save();
  return rec;
}
// Alte Uebungslaeufe wegwerfen, aber nie einen Rekord: der steht oft ganz
// hinten, weil er schon lange haelt.
function capPractice(){
  if(state.practice.length<=300) return;
  var keep = {};
  state.practice.forEach(function(r){
    var k = r.playerId+"|"+r.mode, b = keep[k];
    if(!b || r.score>b.score || (r.score===b.score && r.darts<b.darts)) keep[k] = r;
  });
  var behalten = state.practice.slice(0,300);
  var drin = {};
  behalten.forEach(function(r){ drin[r.id] = true; });
  for(var k2 in keep) if(!drin[keep[k2].id]) behalten.push(keep[k2]);
  state.practice = behalten;
}

// Bester Wert eines Spielers in einem Trainingsmodus.
function bestPractice(playerId, mode){
  var b = null;
  for(var i=0;i<state.practice.length;i++){
    var r = state.practice[i];
    if(r.playerId!==playerId || r.mode!==mode) continue;
    if(!b || r.score>b.score || (r.score===b.score && r.darts<b.darts)) b = r;
  }
  return b;
}
// Bestes Solo-X01: wenigste Darts fuer diesen Startwert.
function bestSolo(playerId, gameType){
  var b = null;
  for(var i=0;i<state.history.length;i++){
    var m = state.history[i];
    if(m.players.length!==1 || m.gameType!==gameType) continue;
    var p = m.players[0];
    if(p.id!==playerId || !p.darts) continue;
    if(!b || p.darts<b.darts) b = {darts:p.darts, ts:m.ended||m.ts, avg:p.avg};
  }
  return b;
}

// Spieler-Akte: alles, was ueber einen Spieler in den Daten steht
// ---------------------------------------------------------------------------
function playerStats(id){
  var r = {id:id, games:0, wins:0, legsWon:0, legsLost:0, darts:0, scored:0,
           best:0, checkout:0, t180:0, tons:0, form:[],
           solo:0, soloDarts:0, soloScored:0, soloBest:0};
  for(var i=0;i<state.history.length;i++){
    var m = state.history[i];
    var p = null;
    for(var j=0;j<m.players.length;j++) if(m.players[j].id===id) p = m.players[j];
    if(!p) continue;

    // Allein gespielt zaehlt separat - sonst stehen im selben Screen
    // "1 Spiel" und ein Schnitt aus zwei Partien.
    if(m.players.length<2){
      r.solo++;
      r.soloDarts += p.darts||0; r.soloScored += p.scored||0;
      if((p.best||0) > r.soloBest) r.soloBest = p.best||0;
      continue;
    }

    r.darts += p.darts||0; r.scored += p.scored||0;
    if((p.best||0) > r.best) r.best = p.best||0;
    if((p.checkout||0) > r.checkout) r.checkout = p.checkout||0;
    r.t180 += p.oneEighties||0; r.tons += p.tons||0;
    r.games++;
    r.legsWon += p.legsWon||0;
    for(var k=0;k<m.players.length;k++) if(m.players[k].id!==id) r.legsLost += m.players[k].legsWon||0;
    if(m.winnerId===id) r.wins++;
    if(r.form.length<10) r.form.push(m.winnerId===id);
  }
  r.avg = r.darts ? +((r.scored/r.darts*3).toFixed(1)) : 0;
  r.quote = r.games ? Math.round(r.wins/r.games*100) : 0;
  return r;
}

function renderPlayer(){
  var p = rosterOf(playerSel);
  if(!p){ view="home"; return renderHome(); }
  var s = playerStats(p.id);
  var me = p.id===meId();

  function row(label, val, sub){
    return '<div class="srow"><span class="sl">'+label+'</span>'

  var form = s.form.length

      + s.form.map(function(w){ return '<span class="dot2 '+(w?"a":"b")+'"></span>'; }).join("")
      + '<span class="dotsl">links = neu</span></div>'

  var duels = allDuels().filter(function(d){ return d.a===p.id || d.b===p.id; }).map(function(d){
    var other = d.a===p.id ? d.b : d.a;

  var bd = bestPractice(p.id, "double");

  return h()

    + (function(){

        if(!hw && !hand) return '';
        if(!hw) return '<div class="infoline" style="margin:-6px 3px 12px">'+hand

        if(!hand) return '';
        return '<div class="infoline" style="margin:-6px 3px 12px">'+hw+' gespielt gewonnen'
          + ' &middot; '+hand+' von Hand eingetragen</div>';
      })()
    + '<div class="card">'
    +   row("Spiele", s.games, s.games ? '&middot; '+s.quote+' % gewonnen' : '')
    +   row("Schnitt je 3 Darts", s.avg || '&mdash;')
    +   row("Beste Aufnahme", s.best || '&mdash;')
    +   row("Höchstes Finish", s.checkout || '&mdash;')
    +   (s.t180 ? row("180er", s.t180) : '')
    +   (s.legsWon+s.legsLost ? row("Legs", s.legsWon+' : '+s.legsLost) : '')

    + (s.solo ? '<div class="infoline">Dazu <b>'+s.solo+'</b> '+(s.solo===1?'Runde':'Runden')
        + ' allein &middot; Schnitt '
        + (s.soloDarts ? (s.soloScored/s.soloDarts*3).toFixed(1) : '0.0')
        + (s.soloBest ? ' &middot; beste Aufnahme '+s.soloBest : '')
        + ' <span class="muted">(zählen nicht in die Zahlen oben)</span></div>' : '')
    + '<label class="lbl" style="margin-top:16px">Form</label>' + form
    + (duels ? '<label class="lbl" style="margin-top:16px">Duelle</label>'
             + '<div class="card">'+duels+'</div>' : '')
    + (recs.length ? '<label class="lbl" style="margin-top:16px">Rekorde</label>'
             + '<div class="card">'+recs.join("")+'</div>' : '')

    + '<div class="stack">'
    +   '<button class="btn" data-act="setme" data-id="'+p.id+'">'
    +     (me ? '&#9733; Das bin ich &middot; abwählen' : '&#9734; Das bin ich') + '</button>'
    +   '<div class="row">'
    +     '<button class="btn" data-act="rename" data-id="'+p.id+'" style="flex:1">Umbenennen</button>'
    +     '<button class="btn danger" data-act="del" data-id="'+p.id+'" style="flex:1">Löschen</button>'

}

// ---------------------------------------------------------------------------
// Sprach-Eingabe ("Bike"-Modus): Wuerfe laut ansagen -> automatisch eintragen
// ---------------------------------------------------------------------------
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var recog = null;
var voiceOn = false;
var ttsOn = state.settings.tts !== false;
var speaking = false;
var voiceMsg = "";

// -- Sprach-Ausgabe (damit man bei weggelegtem Handy HOERT, was erkannt wurde)
function say(txt){
  if(!ttsOn || !("speechSynthesis" in window)) return;
  try{
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(txt);
    u.lang = "de-DE"; u.rate = 1.05;
    speaking = true;                                   // eigenes Echo nicht mitschreiben
    u.onend  = function(){ speaking = false; };
    u.onerror= function(){ speaking = false; };
    speechSynthesis.speak(u);
    setTimeout(function(){ speaking = false; }, Math.min(6000, 700 + txt.length*90));
  }catch(e){ speaking = false; }
}

// -- Wortlisten fuer den Parser (Artikel wie "ein/eine" bewusst RAUS -> keine Geister-1en)
var ZAHLWORT = {
  "null":0,"eins":1,"zwei":2,"zwo":2,"drei":3,"vier":4,
  "fuenf":5,"fünf":5,"funf":5,"sechs":6,"sieben":7,"acht":8,"neun":9,"zehn":10,
  "elf":11,"zwoelf":12,"zwölf":12,"zwolf":12,"dreizehn":13,"vierzehn":14,
  "fuenfzehn":15,"fünfzehn":15,"funfzehn":15,"sechzehn":16,"siebzehn":17,
  "achtzehn":18,"neunzehn":19,"zwanzig":20,
  "fuenfundzwanzig":25,"fünfundzwanzig":25,"funfundzwanzig":25,
  "fuenfzig":50,"fünfzig":50,"funfzig":50
};
// Zehner und Hunderter gehoeren NICHT in die Wurf-Tabelle - sie sind keine
// gueltigen Einzelwuerfe. Aber sie muessen erkannt werden: "sechzig zwanzig
// zwanzig" ist die normale Kneipen-Ansage, und wer sie nicht kennt, verschluckt
// die 60 lautlos und bucht 40 statt 100.
var ZEHNER = {"zehn":10,"zwanzig":20,"dreissig":30,"dreißig":30,"vierzig":40,
              "fuenfzig":50,"fünfzig":50,"funfzig":50,"sechzig":60,"siebzig":70,
              "achtzig":80,"neunzig":90};
var EINER  = {"ein":1,"eins":1,"zwei":2,"zwo":2,"drei":3,"vier":4,"fuenf":5,"fünf":5,
              "funf":5,"sechs":6,"sieben":7,"acht":8,"neun":9};

// Gibt die Zahl zurueck oder -1. (0 ist ein gueltiger Wert: "null".)
function zahlWort(w){
  if(ZAHLWORT.hasOwnProperty(w)) return ZAHLWORT[w];
  if(ZEHNER.hasOwnProperty(w)) return ZEHNER[w];
  if(/^\d+$/.test(w)) return parseInt(w,10);
  var m = /^(ein)?hundert(.*)$/.exec(w);
  if(m){
    if(!m[2]) return 100;
    var r = zahlWort(m[2]);
    return r >= 0 ? 100 + r : -1;
  }
  m = /^(.+?)und(.+)$/.exec(w);                       // "sechsundzwanzig"
  if(m && EINER.hasOwnProperty(m[1]) && ZEHNER.hasOwnProperty(m[2]))
    return EINER[m[1]] + ZEHNER[m[2]];
  return -1;
}
function multWord(w){
  // Die Schreibweisen stammen aus einer Messung gegen den Parser, nicht aus dem
  // Kopf: Chrome gibt bei de-DE "tripple" und "t 20" genauso zurueck wie "triple".
  if(/^(doppel|doppelt|doppelte|doppelten|double|zweifach|d)$/.test(w)) return 2;
  if(/^(dreifach|dreifache|dreifachen|tripel|trippel|triple|tripple|treble|trebble|threefold|dreier|t)$/.test(w)) return 3;
  if(/^(single|einfach|s)$/.test(w)) return 1;
  return 0;
}
function normName(s){ return String(s).toLowerCase().replace(/ß/g,"ss").trim(); }
function currentNames(){
  var m=state.match, ns=[];
  if(m) m.players.forEach(function(p){ ns.push(normName(p.name)); });
  return ns;
}
function nameMatches(spoken, actual){
  var a=normName(spoken), b=normName(actual);
  if(!a||!b) return false;
  return a===b || b.indexOf(a)===0 || a.indexOf(b)===0;
}
function sayLabel(mult,num){
  if(num===50) return "Bull";
  if(num===25) return "25";
  if(num===0)  return "daneben";
  if(mult===3) return "Triple "+num;
  if(mult===2) return "Doppel "+num;
  return ""+num;
}

// -- Der Parser: gesprochener Satz -> Liste von Wuerfen (max 3).
//    Multiplikator steht IMMER VOR der Zahl ("Doppel 2"), wie man deutsch spricht;
//    genau das loest Lions Beispiel "14, doppelt 2, 3" korrekt zu S14/D2/S3 auf.
function parseSpeech(text, names){
  names = names || [];
  var out = {throws:[], name:null, cmd:null, raw:text, zuGross:[]};
  var s = (text||"").toLowerCase().replace(/[.,;:!?]/g," ").replace(/-/g," ").replace(/\s+/g," ").trim();
  if(!s) return out;
  // "drei mal 20" ist EIN Wurf. Ohne diese Zeile werden daraus zwei Darts (3 und
  // 20) - die Aufnahme ist dann nach zwei Ansagen voll und zaehlt 23 statt 60.
  s = s.replace(/\b(zwei|zwo|2)\s*mal\b/g, "doppel").replace(/\b(drei|3)\s*mal\b/g, "triple");
  // Reihenfolge zaehlt: "stimmt nicht" ist eine Korrektur, "stimmt" eine Zusage.
  if(/\b(raus|weg|streich|streiche|loesch|lösch)\b/.test(s)
     || /\bstimmt (nicht|so nicht)\b/.test(s)
     || /\bnicht richtig\b/.test(s)) out.cmd="raus";
  else if(/\b(okay|ok|oke|passt|stimmt|richtig|korrekt|jup|jo|ja)\b/.test(s)) out.cmd="ok";
  else if(/\b(zurueck|zurück|rueckgaengig|rückgängig|korrektur|revidieren)\b/.test(s)) out.cmd="undo";
  else if(/\b(weiter|naechster|nächster|fertig|beenden)\b/.test(s)) out.cmd="skip";
  else if(/\b(stopp|stop|aufhoeren|aufhören|hoer auf|hör auf|mikro aus)\b/.test(s)) out.cmd="stop";
  var words = s.split(" ");
  var toks = [];
  for(var i=0;i<words.length;i++){
    var w = words[i];
    if(names.indexOf(w)>=0){ if(!out.name) out.name=w; continue; }   // Namen nicht als Wurf werten
    var mv = multWord(w); if(mv){ toks.push({t:"m",v:mv}); continue; }
    if(/^(bull|bulls|bullseye|bulle|bullsauge)$/.test(w)){ toks.push({t:"v",v:50}); continue; }
    if(/^(daneben|vorbei|verfehlt|nix|nichts|miss|fehlwurf)$/.test(w)){ toks.push({t:"v",v:0}); continue; }
    var zw = zahlWort(w);
    if(zw >= 0){ toks.push({t:"v",v:zw}); continue; }
    // "T20" am Stueck - so steht es auf jedem Board und so tippt es jeder.
    var kurz = /^([tds])(\d{1,2})$/.exec(w);
    if(kurz){ toks.push({t:"m",v:multWord(kurz[1])}); toks.push({t:"v",v:parseInt(kurz[2],10)}); continue; }
    if(/^\d+$/.test(w)){ toks.push({t:"v",v:parseInt(w,10)}); continue; }
  }
  var pending=1, pset=false;
  for(var j=0;j<toks.length;j++){
    var tk=toks[j];
    if(tk.t==="m"){ pending=tk.v; pset=true; continue; }
    var num=tk.v, mult=1;
    if(num===0||num===25||num===50){ pset=false; }
    else if(num>=1 && num<=20){ if(pset){ mult=pending; pset=false; } }
    else {                                               // keine Wurf-Zahl (z.B. 60)
      if(num>20 && num<=180) out.zuGross.push(num);      // gemerkt, nicht verschluckt
      pset=false; continue;
    }
    var dv = dartValue(mult, num);
    out.throws.push({mult:mult, num:num, label:dv.label, say:sayLabel(mult,num)});
    if(out.throws.length>=3) break;                      // eine Aufnahme = max 3 Darts
  }
  return out;
}

// -- Erkennung starten / stoppen (Auto-Neustart faengt iOS-Abbrueche + no-speech ab)
function ensureRecog(){
  if(recog || !SR) return;
  recog = new SR();
  recog.lang="de-DE"; recog.continuous=true; recog.interimResults=false; recog.maxAlternatives=4;
  recog.onresult = function(ev){
    if(speaking) return;                                 // eigene TTS-Stimme ignorieren
    var res = ev.results[ev.results.length-1];
    if(!res.isFinal) return;
    var names = currentNames();
    // Erste Alternative nehmen, die WIE EINE ANSAGE KLINGT - nicht die erste,
    // in der zufaellig eine Zahl steckt. Mit Musik im Raum ist das der
    // Unterschied zwischen "Wurf eingetragen" und "Refrain eingetragen".
    var liste = [];
    for(var i=0;i<res.length;i++){
      liste.push({ text:(res[i]&&res[i].transcript)||"",
                   confidence:(res[i]&&typeof res[i].confidence==="number")?res[i].confidence:0 });
    }
    var w = besteAlternative(liste);
    if(w.p) hoerEreignis(w.text, 1);      // eine Stelle fuer Filter UND Grenzfaelle
    else ansageVerworfen(w.text);
  };
  recog.onerror = function(ev){
    if(ev.error==="not-allowed" || ev.error==="service-not-allowed"){
      voiceOn=false; voiceMsg="Mikrofon nicht erlaubt – im Browser freigeben."; render();
    }
    // no-speech / aborted / network: onend uebernimmt den Neustart
  };
  recog.onend = function(){
    if(voiceOn){
      try{ recog.start(); }
      catch(e){ setTimeout(function(){ if(voiceOn){ try{recog.start();}catch(e2){} } }, 350); }
    }
    updateVoiceStatus();
  };
}
function startVoice(){
  if(!SR){ voiceMsg="Sprache: dieser Browser kann es nicht (Chrome/Android nutzen)."; return; }
  if(voiceOn) return;
  ensureRecog();
  voiceOn=true; voiceMsg="";
  try{ recog.start(); }
  catch(e){
    // Ohne das hier behaupten Knopf und Statuszeile weiter "Hoert zu",
    // waehrend die Erkennung gar nicht laeuft.
    voiceOn=false;
    voiceMsg="Mikrofon startet nicht &ndash; nochmal tippen.";
    render(); return;
  }
  say("Sprachmodus an. Sag deine Würfe.");               // entsperrt zugleich iOS-Sprachausgabe
}
function stopVoice(){
  voiceOn=false;
  if(recog){ try{ recog.abort(); }catch(e){} }
  try{ if("speechSynthesis" in window) speechSynthesis.cancel(); }catch(e){}
}
function updateVoiceStatus(msg){
  if(typeof msg==="string") voiceMsg=msg;
  var el=document.getElementById("voiceStatus");
  if(!el) return;
  if(!SR){ el.innerHTML='<span class="muted">Von diesem Browser nicht unterstützt – bitte Chrome (Android).</span>'; return; }
  if(!voiceOn){ el.innerHTML='<span class="muted">Mikro aus.</span>'+(voiceMsg?' '+voiceMsg:''); return; }
  el.innerHTML='<span style="color:var(--green)">&#9679; hört zu …</span>'+(voiceMsg?' &nbsp;'+voiceMsg:'');
}

// ---------------------------------------------------------------------------
// Musik im Hintergrund
//
// Die Web Speech API liefert nur fertigen Text, nie das Audiosignal - "Musik
// ausblenden" ist damit technisch ausgeschlossen. Was geht: prüfen, ob das, was
// ankam, überhaupt nach einer Darts-Ansage klingt.
//
// Bis 1.25 nahm onresult die erste Alternative, die IRGENDEINEN Wurf enthielt.
// Ein einzelnes "zwanzig" im Refrain reichte, um eine 20 einzutragen.
// ---------------------------------------------------------------------------

// Gehoert dieses Wort zu einer Wurf-Ansage?
function istWurfWort(w){
  if(/^\d+$/.test(w)) return true;
  if(zahlWort(w) >= 0) return true;
  if(multWord(w)) return true;
  if(/^(bull|bulls|bullseye|bulle|bullsauge)$/.test(w)) return true;
  if(/^(daneben|vorbei|verfehlt|nix|nichts|miss|fehlwurf)$/.test(w)) return true;
  if(/^(und|mal|punkte|rest|aus)$/.test(w)) return true;      // harmlose Fuellwoerter
  return false;
}

// Klingt das nach einer Ansage - oder nach einem Songtext, in dem zufaellig
// eine Zahl vorkam? sicherheit ist der confidence-Wert des Browsers; 0 oder
// undefined heisst "keine Angabe" und darf deshalb NICHT zur Ablehnung führen.
// Alles, worin ein Wurf oder ein Kommando steckt, wird angenommen.
//
// Hier stand kurzzeitig ein Filter gegen Hintergrundmusik (Wortanteil-Quote +
// confidence-Schwelle). Er ist wieder raus: "Arne hat Triple 20 geworfen" sind
// fuenf Woerter mit zwei Treffern = 40 % und waere abgelehnt worden, und Chrome
// meldet auch bei sauberer Sprache manchmal niedrige Sicherheiten. Ein Filter,
// der echte Ansagen schluckt, ist schlimmer als das Problem, das er loesen soll
// - zumal Musik selten Wurf-Vokabular enthaelt.
// Wer es doch braucht: der Schalter "Name muss dabei sein" in den Einstellungen.
function ansageBrauchbar(p, rohtext, sicherheit){
  if(p && p.cmd) return true;
  return !!(p && p.throws.length);
}

// Aus den Alternativen des Browsers die erste nehmen, die WIE EINE ANSAGE
// KLINGT - nicht die erste, in der zufaellig eine Zahl steckt.
// alternativen: [{text, confidence}]
function besteAlternative(alternativen){
  var names = currentNames(), ersterMitWurf = "";
  for(var i=0;i<alternativen.length;i++){
    var a = alternativen[i] || {};
    var t = a.text || "";
    var p = parseSpeech(t, names);
    if(ansageBrauchbar(p, t, a.confidence)) return { p:p, text:t };
    if(!ersterMitWurf && p.throws.length) ersterMitWurf = t;
  }
  return { p:null, text: ersterMitWurf || ((alternativen[0]||{}).text || "") };
}

// Eintrittspunkt fuer alles Gehoerte - eine Stelle, damit sie pruefbar ist.
var ueberhoert = 0;   // wie oft in Folge etwas verworfen wurde

function ansageVerworfen(text){
  ueberhoert++;
  updateVoiceStatus('&#128266; überhört: „'+esc(String(text).slice(0,48))+'“'
    + ' <span class="muted">(klang nicht nach einer Ansage)</span>'
    + (ueberhoert>=3 && !state.settings.nurMitName
       ? '<br><b>Viel Hintergrund?</b> Schalte in den Einstellungen '
         + '„Name muss dabei sein" ein &ndash; dann zählt nur, was deinen Namen nennt.'
       : ''));
}

function hoerEreignis(text, sicherheit){
  var p = parseSpeech(text, currentNames());
  if(!ansageBrauchbar(p, text, sicherheit)){ ansageVerworfen(text); return false; }
  ueberhoert = 0;                    // wieder verstanden - Zaehler zurueck
  applySpokenResult(p, text);
  return true;
}

// ---------------------------------------------------------------------------
// Sprachmodus: volle Aufnahme vorlesen, bestaetigen, einzeln korrigieren
//
// Beim Tippen sieht man, was man drueckt. Beim Sprechen nicht - und wenn die
// Erkennung nach dem dritten Dart sofort weiterschaltet, faellt ein falsch
// verstandener Wurf mitten im Spiel niemandem mehr auf. Deshalb bleibt die
// Aufnahme stehen, wird vorgelesen und wartet auf "okay".
//
// Kein eigenes Zustandsfeld: ob gewartet wird, ergibt sich aus der Lage. So
// muss auch nichts im Undo-Schnappschuss mitgefuehrt werden.
// ---------------------------------------------------------------------------
var korrigiere = null;    // {pos, label} - welcher Wurf gerade ersetzt wird

function wartetAufOk(){
  var m = state.match;
  return !!(m && !m.finished && typeof voiceOn !== "undefined" && voiceOn
            && m.currentTurn.length >= 3);
}

function leseAufnahmeVor(){
  var m = state.match; if(!m) return;
  var p = m.players[m.currentIdx];
  var gesprochen = m.currentTurn.map(function(d){ return sayLabel(d.mult, d.num); }).join(", ");
  var kurz = m.currentTurn.map(function(d){ return d.label; }).join(" ");
  updateVoiceStatus('<b>'+esc(p.name)+'</b>: '+kurz+' &middot; Rest <b>'+p.score+'</b>'
    + ' &middot; stimmt das? Sag „okay" &ndash; oder „'+esc(m.currentTurn[0].label)+' raus".');
  say(gesprochen + ". Rest " + p.score + ". Stimmt das?");
}

// "zwanzig raus" - welchen Wurf meint er? Bei mehreren gleichen den letzten,
// und das wird dazugesagt, damit klar ist, was passiert.
function korrekturStarten(wurf){
  var m = state.match;
  var pos = -1;
  for(var i=m.currentTurn.length-1;i>=0;i--){
    if(m.currentTurn[i].label === wurf.label){ pos = i; break; }
  }
  if(pos < 0){
    updateVoiceStatus('&#9888;&#65039; <b>'+esc(wurf.label)+'</b> steht gar nicht in dieser Aufnahme.');
    say(sayLabel(wurf.mult, wurf.num) + " steht da nicht. Sag okay, oder nenn einen Wurf, der drinsteht.");
    return;
  }
  var wieOft = 0;
  for(var j=0;j<m.currentTurn.length;j++) if(m.currentTurn[j].label===wurf.label) wieOft++;
  // "der letzte 20" klingt falsch, egal welches Wort dahinter steht. Die Position
  // ist ohnehin die nuetzlichere Auskunft: welcher der drei Wuerfe getauscht wird.
  var welcher = wieOft > 1 ? "Wurf " + (pos+1) + ", " : "";
  korrigiere = { pos: pos, label: wurf.label };
  updateVoiceStatus('Was soll statt <b>'+esc(wurf.label)+'</b> rein?'
    + (wieOft>1 ? ' <span class="muted">(Wurf '+(pos+1)+' von '+m.currentTurn.length+')</span>' : ''));
  say("Okay, " + welcher + sayLabel(wurf.mult, wurf.num) + " raus. Was willst du statt "
      + sayLabel(wurf.mult, wurf.num) + " haben?");
}

// Ersatz einsetzen: die ganze Aufnahme zurueckdrehen und neu einwerfen. Das ist
// der einzige Weg, bei dem Punkte, Bust-Pruefung und Statistik garantiert
// wieder zusammenpassen.
function korrekturAusfuehren(neu){
  var m = state.match;
  var liste = m.currentTurn.map(function(d){ return { mult:d.mult, num:d.num }; });
  liste[korrigiere.pos] = { mult:neu.mult, num:neu.num };
  korrigiere = null;

  var idxVorher = m.currentIdx, ergebnis = "ok";
  quietSay = true;
  try{
    while(state.match && state.match.currentTurn.length && undo()){}
    for(var i=0;i<liste.length;i++){
      if(!state.match || state.match.finished) break;
      ergebnis = applyDart(liste[i].mult, liste[i].num);
      if(ergebnis !== "ok" && ergebnis !== "voll") break;
    }
  } finally { quietSay = false; }

  var m2 = state.match;
  if(!m2 || m2.finished){ say("Spiel!"); return; }
  if(m2.currentIdx !== idxVorher){
    // Die Korrektur hat einen Bust erzeugt - die Aufnahme ist verfallen.
    var lt = m2.lastTurn;
    updateVoiceStatus('&#128165; So ist es überworfen &ndash; zurück auf <b>'
      + (lt?lt.rest:'') + '</b>, nächster Spieler.');
    say("So ist es überworfen. Zurück auf " + (lt?lt.rest:"") + ".");
    return;
  }
  leseAufnahmeVor();
}

// -- Erkanntes umsetzen: Kommandos, Namens-Check, dann Wuerfe eintragen + Rueckmeldung
function applySpokenResult(p, rawTxt){
  var m=state.match; if(!m || m.finished) return;
  quietSay = true;                       // der Sprachmodus formuliert selbst
  try{ applySpokenResultInner(p, rawTxt); } finally { quietSay = false; }
}
function applySpokenResultInner(p, rawTxt){
  var m=state.match; if(!m || m.finished) return;

  // Eine Korrektur laeuft: die naechste Ansage ist der Ersatzwurf.
  if(korrigiere){
    if(p.cmd==="ok"){
      korrigiere = null;
      snapshot(); endTurn(); save(); render();
      updateVoiceStatus("&#8594; nächster Spieler");
      say("Okay. " + dranText());
      return;
    }
    if(p.cmd==="stop"){ korrigiere=null; stopVoice(); render(); return; }
    if(p.throws.length){ korrekturAusfuehren(p.throws[0]); return; }
    updateVoiceStatus('Nicht verstanden. Welcher Wurf soll stattdessen rein?');
    say("Nicht verstanden. Welchen Wurf willst du stattdessen?");
    return;
  }

  // "sechzig zwanzig zwanzig" ergaebe sonst 40 statt 100 - und zwar lautlos.
  // Die Pruefung sass frueher im Mikro-Zweig; damit hing der Schutz daran, ueber
  // WELCHE Funktion die Ansage hereinkam. Hier gilt sie fuer jeden Weg.
  if(p.zuGross.length && !p.cmd){
    ueberhoert = 0;
    updateVoiceStatus('&#9888;&#65039; <b>'+p.zuGross[0]+'</b> ist kein einzelner Wurf. '
      + 'Sag die Würfe einzeln &ndash; z.B. „Triple 20" statt „60".');
    say(p.zuGross[0] + " ist kein einzelner Wurf. Sag zum Beispiel Triple 20.");
    return;
  }

  // "20 raus" ausserhalb des Wartezustands: das ist eine Korrektur ins Leere -
  // ohne diese Schranke wuerde die 20 als WURF fuer den naechsten Spieler
  // gebucht, weil der Satz ja eine Zahl enthaelt.
  if(p.cmd==="raus" && !wartetAufOk()){
    updateVoiceStatus('Gerade gibt es nichts zu korrigieren &ndash; die Aufnahme ist schon durch.'
      + ' Mit „zurück" nimmst du den letzten Wurf weg.');
    say("Da ist gerade nichts zu korrigieren. Sag zurück, wenn du den letzten Wurf wegnehmen willst.");
    return;
  }

  // Die Aufnahme ist voll und wartet auf Bestaetigung.
  if(wartetAufOk()){
    if(p.cmd==="ok" || p.cmd==="skip"){
      snapshot(); endTurn(); save(); render();
      updateVoiceStatus("&#8594; nächster Spieler");
      say(dranText());
      return;
    }
    if(p.cmd==="undo"){
      if(undo()){
        updateVoiceStatus("&#8617;&#65039; letzter Wurf zurück");
        say("Zurück. Sag den Wurf nochmal.");
      } else { say("Da ist nichts zum Zurücknehmen"); }
      return;
    }
    if(p.cmd==="raus"){
      if(p.throws.length) korrekturStarten(p.throws[0]);
      else {
        updateVoiceStatus('Welcher Wurf soll raus? Zum Beispiel „20 raus".');
        say("Welcher Wurf soll raus?");
      }
      return;
    }
    if(p.cmd==="stop"){ stopVoice(); render(); return; }
    leseAufnahmeVor();     // alles andere: nochmal vorlesen
    return;
  }
  // Zwischen zwei Legs bleibt das Mikro absichtlich an. Ein Wurf darf dann aber
  // nicht ins naechste Leg rutschen, waehrend auf dem Schirm noch der Zwischenstand steht.
  if((view==="leg" || view==="platz") && !(p.cmd==="skip" || p.cmd==="stop" || p.cmd==="undo")){
    updateVoiceStatus('Runde ist zu Ende &ndash; sag „weiter“.');
    say("Runde ist zu Ende. Sag weiter."); return;
  }
  if(p.cmd && p.throws.length===0){
    if(p.cmd==="undo"){
      if(undo()){ updateVoiceStatus("&#8617;&#65039; letzter Wurf zurück"); say("Zurück"); }
      else { updateVoiceStatus("Nichts zum Zurücknehmen."); say("Da ist nichts zum Zurücknehmen"); }
      return;
    }
    if(p.cmd==="skip"){
      if(view==="leg" || view==="platz"){
        view="game"; save(); render();
        updateVoiceStatus("&#8594; weiter"); say("Weiter"); return;
      }
      snapshot(); endTurn(); save(); render(); updateVoiceStatus("&#8594; nächster Spieler"); say("Nächster"); return;
    }
    if(p.cmd==="stop"){ stopVoice(); render(); return; }
  }
  if(p.throws.length===0){
    updateVoiceStatus('nicht verstanden: „'+esc(rawTxt||"")+'“');
    say("Nicht verstanden"); return;
  }
  var cur = m.players[m.currentIdx];
  // Musik im Raum: wer das anschaltet, muss den Werfer nennen. Ein Refrain sagt
  // nie "Arne". Kommandos sind ausgenommen, sonst kaeme man aus dem Dialog nicht raus.
  if(state.settings.nurMitName && !p.name){
    updateVoiceStatus('&#9888;&#65039; Ohne Namen nicht eingetragen &ndash; sag z.B. „<b>'
      + esc(cur.name)+'</b> Triple 20".');
    return;
  }
  if(p.name && !nameMatches(p.name, cur.name)){          // vor falschem Spieler schuetzen
    updateVoiceStatus('&#9888;&#65039; „'+esc(p.name)+'“ gesagt, aber <b>'+esc(cur.name)+'</b> ist dran – nichts eingetragen.');
    say(cur.name+" ist dran, nicht "+p.name);
    return;
  }
  var idxBefore=m.currentIdx, applied=[], event="ok", nichtGezaehlt=[];
  for(var k=0;k<p.throws.length;k++){
    if(!state.match || state.match.finished) break;
    if(state.match.currentIdx!==idxBefore) break;         // Aufnahme lief voll -> Rest verwerfen
    var th=p.throws[k];
    var r=applyDart(th.mult, th.num);                     // rendert selbst
    if(r==="noop") break;
    applied.push(th);
    if(r==="win"){ event="win"; break; }
    if(r==="leg"){ event="leg"; break; }
    if(r==="platz"){ event="platz"; break; }
    if(r==="bust"){ event="bust"; break; }
    if(r==="nostart"){ nichtGezaehlt.push(th.label); continue; }
    if(state.match && state.match.currentIdx!==idxBefore){ event="full"; break; }
  }
  var labels = applied.map(function(a){return a.label;}).join(" ");
  var spoken = applied.map(function(a){return a.say;}).join(", ");
  if(event==="win"){ say("Spiel! "+cur.name+" gewinnt."); return; }
  if(event==="platz"){
    var offen2 = m.players.filter(function(q){ return m.platz.indexOf(q.id)<0; });
    var naechster = offen2[0];
    updateVoiceStatus('&#127942; <b>'+esc(cur.name)+'</b> ist durch &middot; weiter um Platz '
      + (m.platz.length+1) + (naechster ? ' &middot; '+esc(naechster.name)+' ist dran' : ''));
    say(cur.name + " ist durch. Weiter geht es um Platz " + (m.platz.length+1) + ". "
        + (naechster ? naechster.name + " ist dran." : ""));
    return;
  }
  if(event==="leg"){
    var lw = m.legs[m.legs.length-1];
    updateVoiceStatus('&#127919; Leg an <b>'+esc(cur.name)+'</b> ('+(lw?lw.darts:0)+' Darts) &middot; sag „weiter“');
    say("Leg für "+cur.name+". Sag weiter für das nächste Leg."); return;
  }
  if(nichtGezaehlt.length && !applied.filter(function(a){return nichtGezaehlt.indexOf(a.label)<0;}).length){
    updateVoiceStatus('&#9888;&#65039; Doppel-In: '+esc(cur.name)+' ist noch nicht drin &ndash; '
      + esc(nichtGezaehlt.join(" "))+' zählt nicht.');
    say("Noch kein Doppel."); return;
  }
  if(event==="bust"){
    updateVoiceStatus('&#128165; '+esc(cur.name)+': '+esc(labels)+' – überworfen, zurück auf <b>'+cur.score+'</b>');
    say(spoken+". Überworfen. Zurück auf "+cur.score); return;
  }
  if(wartetAufOk()){
    // Volle Aufnahme: vorlesen und auf "okay" warten, statt stillschweigend
    // weiterzureichen. Ein falsch verstandener Wurf faellt sonst niemandem auf.
    leseAufnahmeVor();
    return;
  }
  var extra = (applied.length<p.throws.length) ? ' (Aufnahme voll, Rest verworfen)' : '';
  // Nach jedem Wurf gleich sagen, was jetzt sinnvoll ist - mit weggelegtem
  // Handy ist das der halbe Nutzen des Sprachmodus.
  var rat = ratText(cur.score, 3-m.currentTurn.length, m.doubleOut);
  updateVoiceStatus('&#127919; '+esc(cur.name)+': <b>'+esc(labels)+'</b> &middot; Rest <b>'+cur.score+'</b>'
    + extra + (rat ? ' &middot; <span class="co">'+esc(rat)+'</span>' : ''));
  say(spoken+". Rest "+cur.score+(rat?". "+rat:""));
}

// ---------------------------------------------------------------------------
// Ein Klick-Handler fuer alles (Delegation -> ueberlebt jedes Re-Render)
// ---------------------------------------------------------------------------
document.getElementById("app").addEventListener("click", function(ev){
  var t = ev.target.closest("[data-act]"); if(!t) return;
  var act = t.getAttribute("data-act");

  if(act==="standok"){ standDefekt=false; render(); return; }
  if(act==="reloadstate"){
    if(confirm("Stand des anderen Fensters laden? Was hier offen ist, geht verloren.")){
      state = load(); standUebernommen();
      fremdGeschrieben=false; view=restoreView(); render();
    }
    return;
  }
  if(act==="nav"){
    view=t.getAttribute("data-view");
    if(view==="setup") setupSel=null;
    settingsMsg="";                    // auch beim Betreten leeren, sonst taucht
                                       // eine alte Meldung spaeter als Geist auf
    save(); render(); return;
  }
  if(act==="resume"){ view="game"; save(); render(); return; }
  if(act==="resumetrain"){ view="train"; save(); render(); return; }
  if(act==="sync_neu"){
    syncMsg = "";
    if(!syncOeffnen(syncCode())) syncMsg = "Dieses Handy kann keine Verbindung aufbauen.";
    else if(state.match) syncSenden();       // der Beitretende soll sofort den Stand sehen
    render(); return;
  }
  if(act==="sync_bei"){
    var f = document.getElementById("syncCodeEin");
    var code = ((f ? f.value : "") || "").trim().toUpperCase();
    if(code.length !== 6){ syncMsg = "Der Code hat sechs Zeichen."; render(); return; }
    syncMsg = "";
    if(!syncOeffnen(code)) syncMsg = "Dieses Handy kann keine Verbindung aufbauen.";
    else if(state.match) syncSenden();       // nur wer selbst etwas hat, meldet sich mit Stand
    render(); return;
  }
  if(act==="sync_aus"){ syncSchliessen(); syncMsg = ""; render(); return; }

  if(act==="abort"){ if(confirm("Aktuelles Spiel verwerfen?")){ state.match=null; save(); render(); } return; }

  // Roster
  if(act==="add"){
    var inp=document.getElementById("newName");
    var wunsch=(inp?inp.value:"").trim();
    if(!wunsch){ teamMsg="Bitte erst einen Namen eintippen."; render(); return; }
    if(state.roster.some(function(p){return p.name.toLowerCase()===wunsch.toLowerCase();})){
      if(!confirm("„"+wunsch+"“ gibt es schon. Trotzdem ein zweiter Spieler mit dem Namen?")) return;
      wunsch = wunsch+" (2)";
    }
    teamMsg="";
    var neu=addPlayer(wunsch, t.getAttribute("data-guest")==="1");
    // Wer im Setup dazukommt, spielt auch mit - sonst muss man ihn noch antippen.
    if(neu && view==="setup" && setupSel) setupSel.selected.add(neu);
    render(); return;
  }
  if(act==="rename"){
    var id=t.getAttribute("data-id"); var p=state.roster.find(function(x){return x.id===id;});
    var nn=prompt("Neuer Name:", p?p.name:""); if(nn&&nn.trim()){ p.name=nn.trim(); save(); render(); } return;
  }
  if(act==="del"){
    var id2=t.getAttribute("data-id"); var p2=state.roster.find(function(x){return x.id===id2;});
    if(confirm("„"+(p2?p2.name:"")+"“ löschen? Gespielte Partien bleiben im Verlauf.")){
      state.roster=state.roster.filter(function(x){return x.id!==id2;});
      if(playerSel===id2){ playerSel=null; view="home"; }
      if(state.settings.meId===id2) state.settings.meId=null;
      h2hAuto=true; save(); render();
    } return;
  }
  if(act==="win"){ bumpWins(t.getAttribute("data-id"), parseInt(t.getAttribute("data-d"),10)); render(); return; }
  if(act==="setme"){
    var mid2=t.getAttribute("data-id");
    state.settings.meId = (state.settings.meId===mid2) ? null : mid2;
    h2hAuto = true; save(); render(); return;
  }
  if(act==="winset"){
    var wid=t.getAttribute("data-id"); var wp=state.roster.find(function(x){return x.id===wid;});
    var wv=prompt("Wins für "+(wp?wp.name:"")+":", wp?String(totalWins(wid)):"0");
    if(wv!==null){
      var n=parseInt(wv,10);
      if(isNaN(n)) teamMsg="„"+esc(wv)+"“ ist keine Zahl.";
      else { teamMsg=""; setWins(wid, n); }
      render();
    }
    return;
  }
  if(act==="resetwins"){
    if(confirm("Alle Wins auf 0 setzen? Gespielte Partien bleiben in der Historie.")){
      state.roster.forEach(function(p){ p.winsManual = -historyWins(p.id); }); save(); render();
    } return;
  }

  // Setup
  if(act==="pick"){ var pid=t.getAttribute("data-id");
    if(setupSel.selected.has(pid)) setupSel.selected.delete(pid); else setupSel.selected.add(pid);
    render(); return; }
  if(act==="gt"){ setupSel.gameType=parseInt(t.getAttribute("data-g"),10); render(); return; }
  if(act==="do"){ setupSel.doubleOut = t.getAttribute("data-v")==="1"; render(); return; }
  if(act==="bo"){ setupSel.bestOf = parseInt(t.getAttribute("data-n"),10); render(); return; }
  if(act==="din"){ setupSel.doubleIn = !setupSel.doubleIn; render(); return; }
  if(act==="start"){
    var ids = state.roster.filter(function(p){return setupSel.selected.has(p.id);}).map(function(p){return p.id;});
    if(ids.length<1){ return; }
    if(!darfUeberschreiben()) return;
    startMatch(ids, {gameType:setupSel.gameType, doubleOut:setupSel.doubleOut,
                     doubleIn:setupSel.doubleIn, bestOf:setupSel.bestOf});
    render(); return;
  }
  if(act==="nextleg"){ view="game"; save(); render(); return; }
  if(act==="nextplatz"){ view="game"; save(); render(); return; }
  if(act==="platzende"){
    // Abbrechen: der Rest bleibt ohne Platz, das Ergebnis wird trotzdem gebucht.
    var m0 = state.match;
    m0.finished = true; m0.winnerId = m0.platz[0];
    view = "win"; save(); render(); return;
  }

  // Allein üben
  if(act==="solowho"){ soloWho=t.getAttribute("data-id"); render(); return; }
  if(act==="openplayer"){ playerSel=t.getAttribute("data-id"); view="player"; render(); return; }
  if(act==="solox01"){
    if(!soloWho || !rosterOf(soloWho)) return;       // ohne Spieler kein Spiel
    if(!darfUeberschreiben()) return;
    startMatch([soloWho], {mode:"solo"}); render(); return;
  }
  if(act==="train_double" || act==="train_around"){
    if(!soloWho || !rosterOf(soloWho)) return;
    if(!darfUeberschreiben()) return;
    startTraining(act==="train_double" ? "double" : "around", soloWho); render(); return;
  }
  if(act==="thit"){ trainDart(true); render(); return; }
  if(act==="tmiss"){ trainDart(false); render(); return; }
  if(act==="tundo"){ trainUndo(); render(); return; }
  if(act==="tquit"){
    if(confirm("Übung abbrechen? Der Lauf wird nicht gespeichert.")){
      state.train=null; view="solo"; save(); render();
    } return;
  }
  if(act==="train_again"){
    var tm=state.train.mode, tp=state.train.playerId;
    finishTraining(); startTraining(tm, tp); render(); return;
  }
  if(act==="train_end"){ finishTraining(); view="solo"; render(); return; }

  // Einstellungen
  if(act==="s_gt"){ state.settings.gameType=parseInt(t.getAttribute("data-v"),10); save(); render(); return; }
  if(act==="s_do"){ state.settings.doubleOut=t.getAttribute("data-v")==="1"; save(); render(); return; }
  if(act==="s_bo"){ state.settings.bestOf=parseInt(t.getAttribute("data-v"),10); save(); render(); return; }
  if(act==="s_di"){ state.settings.doubleIn=!state.settings.doubleIn; save(); render(); return; }
  if(act==="s_platz"){ state.settings.platzSpiel=!(state.settings.platzSpiel!==false); save(); render(); return; }
  if(act==="s_name"){ state.settings.nurMitName=!state.settings.nurMitName; save(); render(); return; }
  if(act==="s_tts"){ state.settings.tts=!state.settings.tts; ttsOn=!!state.settings.tts; save(); render(); return; }
  if(act==="s_hist"){ state.settings.keepHistory=!(state.settings.keepHistory!==false); save(); render(); return; }
  if(act==="s_export"){
    settingsMsg = exportBlob() ? "Sicherung gespeichert." : "Download ging nicht – nimm die Zwischenablage.";
    render(); return;
  }
  if(act==="s_copy"){
    settingsMsg = "Kopiere …";
    render();
    exportClipboard(function(ok){
      settingsMsg = ok ? "In der Zwischenablage – irgendwo einfügen und sichern."
                       : "Kopieren wurde abgelehnt – nimm „Als Datei sichern“.";
      render();
    });
    return;
  }
  if(act==="s_import"){
    var fi=document.getElementById("impFile"); if(!fi) return;
    fi.onchange=function(){
      var f=fi.files&&fi.files[0];
      fi.value="";                       // sonst feuert dieselbe Datei kein zweites Mal
      if(!f) return;
      var rd=new FileReader();
      rd.onload=function(){
        if(!confirm("Sicherung einspielen? Der aktuelle Stand wird ersetzt.")) return;
        var err=importText(String(rd.result));
        settingsMsg = err ? err : "Sicherung eingespielt.";
        view="settings";                 // dort steht die Meldung, dort wurde geklickt
        render();
      };
      rd.onerror=function(){
        settingsMsg="Die Datei konnte nicht gelesen werden.";
        render();
      };
      rd.readAsText(f);
    };
    fi.click(); return;
  }
  if(act==="s_clearhist"){
    if(!state.history.length) return;
    if(confirm("Verlauf löschen? Die Wins bleiben als Zahl stehen, aber Duell-Bilanz und Statistik sind weg.")){
      // Wins einfrieren, sonst faellt Lion nach dem Loeschen von 10 auf 1 zurueck.
      clearHistory(); settingsMsg = "Verlauf gelöscht, Wins eingefroren."; render();
    }
    return;
  }
  if(act==="s_reset"){
    if(confirm("Wirklich ALLES zurücksetzen? Team, Wins und Verlauf sind dann weg.")){
      resetAll(); settingsMsg=""; view="home"; render();
    }
    return;
  }

  // Direktvergleich
  if(act==="h2hpick"){
    var hid=t.getAttribute("data-id"); var k=h2hSel.indexOf(hid);
    if(k>=0){
      h2hSel.splice(k,1);
    } else if(h2hSel.length<2){
      h2hSel.push(hid);
    } else {
      // Voll: der zuletzt gewaehlte Gegner wird ersetzt, der eigene Platz bleibt.
      var me0 = meId();
      if(h2hSel[0]===me0 && hid!==me0) h2hSel[1] = hid;
      else h2hSel = [h2hSel[1], hid];
    }
    if(h2hSel.length===2) h2hSel = orderPair(h2hSel[0], h2hSel[1]);
    h2hAuto = false;                      // ab jetzt gilt Lions Wahl
    render(); return;
  }
  if(act==="h2hopen"){
    h2hSel = orderPair(t.getAttribute("data-a"), t.getAttribute("data-b"));
    h2hAuto=false; view="h2h"; render(); return;
  }
  if(act==="duelstart"){
    if(h2hSel.length!==2) return;
    if(!rosterOf(h2hSel[0]) || !rosterOf(h2hSel[1])) return;   // geloeschte Spieler nicht neu starten
    if(!darfUeberschreiben()) return;
    startMatch([h2hSel[0],h2hSel[1]], {}); render(); return;
  }

  // Spiel
  if(act==="imode"){
    // Eine angefangene Aufnahme zurueckdrehen: sonst zaehlt der Summen-Pfad die
    // schon geworfenen Darts ein zweites Mal (2 Darts + Summe = 5 Darts).
    if(state.match && !state.match.finished){
      while(state.match.currentTurn.length && undo()){}
    }
    state.settings.inputMode = t.getAttribute("data-v")==="sum" ? "sum" : "single";
    sumInput=""; pendingFinish=null; pendingOpen=null; pendingBust=null; save(); render(); return;
  }
  if(act==="sumkey"){
    var k=t.getAttribute("data-k");
    if(k==="del"){ sumInput=sumInput.slice(0,-1); sumMsg=""; render(); return; }
    if(k==="ok"){
      if(sumInput==="") return;
      sumMsg="";
      var v=parseInt(sumInput,10);
      var r=applyTurnSum(v);
      if(r==="needopen"){ pendingOpen=v; render(); return; }
      if(r==="finish"){ pendingFinish=v; render(); return; }
      if(r==="bustfrage"){ pendingBust=v; render(); return; }
      if(r==="ungueltig"){ sumInput=""; render(); return; }
      sumInput=""; render(); return;
    }
    // Frueher setzte eine zu grosse Zahl das Feld still auf die letzte Ziffer
    // zurueck: aus 2-0-0 wurde "0", und wer nicht hinsah, buchte eine Null.
    var probe = sumInput + k;
    if(probe.length>3 || parseInt(probe,10)>180){
      sumMsg = "Mehr als 180 gibt es nicht &ndash; Ziffer verworfen.";
    } else {
      sumInput = probe; sumMsg = "";
    }
    render(); return;
  }
  if(act==="sumfin"){
    var dd=parseInt(t.getAttribute("data-d"),10);
    applyTurnSum(pendingFinish, dd); pendingFinish=null; sumInput=""; render(); return;
  }
  if(act==="sumbustd"){
    var db=parseInt(t.getAttribute("data-d"),10);
    applyTurnSum(pendingBust, db); pendingBust=null; sumInput=""; render(); return;
  }
  if(act==="sumbust"){
    // Auf 0 gekommen, aber nicht mit einem Doppel: das ist ein Bust.
    var v3 = pendingFinish; pendingFinish=null; sumInput="";
    var m3 = state.match, p3 = m3.players[m3.currentIdx];
    snapshot();
    p3.darts += 3; p3.legDarts += 3;
    m3.currentTurn = [{label:String(v3), value:0, sum:true}];
    bust(); save(); render(); return;
  }
  if(act==="sumopen"){
    var ja = t.getAttribute("data-v")==="1";
    var v2 = pendingOpen; pendingOpen=null;
    var r2 = applyTurnSum(v2, null, ja);
    if(r2==="finish"){ pendingFinish=v2; }
    else sumInput="";
    render(); return;
  }
  if(act==="sumcancel"){ pendingFinish=null; pendingOpen=null; pendingBust=null; render(); return; }
  if(act==="mult"){ curMult=parseInt(t.getAttribute("data-m"),10); render(); return; }
  if(act==="num"){ applyDart(curMult, parseInt(t.getAttribute("data-n"),10)); return; }
  if(act==="undo"){ undo(); return; }
  // "Passt" ist der getippte Zwilling des gesprochenen "okay" - inklusive Ansage,
  // damit man auch mit weggelegtem Handy hoert, wer als naechstes dran ist.
  if(act==="wok"){
    if(state.match && !state.match.finished){
      snapshot(); endTurn(); save(); render();
      if(voiceOn){ updateVoiceStatus("&#8594; nächster Spieler"); say(dranText()); }
    }
    return;
  }
  if(act==="skip"){ if(state.match&&!state.match.finished){ snapshot(); endTurn(); save(); render(); } return; }
  if(act==="quit"){ if(confirm("Spiel abbrechen? Kein Sieg wird gezählt.")){ state.match=null; view="home"; save(); render(); } return; }

  // Sprach-Eingabe
  if(act==="neuladen"){ try{ location.reload(); }catch(e){} return; }
  if(act==="voice"){
    if(voiceOn){ stopVoice(); render(); return; }
    startVoice(); render();
    // Der Mikro-Block steht ganz unten: gemessen auf 390x844 beginnt der Hinweis
    // bei 843 px, also genau an der Fensterkante. Wer das Mikro einschaltet, will
    // ihn JETZT sehen - also hinfuehren statt hoffen, dass jemand scrollt.
    zeigMikroBlock();
    return;
  }
  if(act==="tts"){
    ttsOn=!ttsOn; state.settings.tts=ttsOn; save();
    if(!ttsOn){ try{ if("speechSynthesis" in window) speechSynthesis.cancel(); }catch(e){} }
    render(); return;
  }

  // Win
  if(act==="winagain"){
    var m0=state.match;
    var ids2=m0.players.map(function(p){return p.id;});
    var o={gameType:m0.gameType, doubleOut:m0.doubleOut, doubleIn:m0.doubleIn, bestOf:m0.bestOf, mode:m0.mode};
    finishMatch();
    startMatch(ids2, o); render(); return;
  }
  if(act==="winhome"){
    finishMatch(); view="home"; render(); return;
  }
});

// Bildschirm anlassen, solange gespielt wird. Zwischen zwei Aufnahmen vergehen
// leicht zwei Minuten, in denen niemand das Handy anfasst.
var wachHalter = null, wachLaeuft = false, wachSoll = false;
function bildschirmWach(an){
  wachSoll = an;
  try{
    if(!navigator.wakeLock) return;
    if(an && !wachHalter && !wachLaeuft){
      // Ohne das Laeuft-Flag fordert jeder Dart eine eigene Sperre an - die
      // Freigabe kennt aber nur die letzte, der Rest bleibt verwaist offen.
      wachLaeuft = true;
      navigator.wakeLock.request("screen").then(function(w){
        wachLaeuft = false;
        if(!wachSoll){ w.release().catch(function(){}); return; }   // inzwischen abbestellt
        wachHalter = w;
        w.addEventListener("release", function(){ wachHalter = null; });
      }).catch(function(){ wachLaeuft = false; });
    } else if(!an && wachHalter){
      wachHalter.release().catch(function(){});
      wachHalter = null;
    }
  }catch(e){}
}
if(typeof document.addEventListener === "function"){
  document.addEventListener("visibilitychange", function(){
    // Nach dem Zurueckwechseln ist die Sperre weg - neu anfordern.
    if(!document.hidden && LIVE_VIEWS.indexOf(view)>=0) bildschirmWach(true);
  });
}

// Ein zweites offenes Fenster (PWA neben Safari-Tab) schreibt denselben

if(typeof window.addEventListener === "function"){
  window.addEventListener("storage", function(ev){
    if(!ev || ev.key !== KEY) return;
    fremdGeschrieben = true;
    if(!state.match && !state.train){        // nichts offen -> einfach uebernehmen
      state = load(); standUebernommen();
      fremdGeschrieben = false;
      view = restoreView();
    }
    render();
  });
}
