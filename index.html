<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Darts">
<title>Darts</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AF%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0f1115; --card:#1a1d24; --card2:#20242d; --line:#2a2f3a;
    --text:#e9e7e0; --muted:#8b93a3; --green:#22c55e; --red:#e5484d;
    --gold:#f5c451; --accent:#22c55e; --accent2:#60a5fa; --shadow:0 6px 20px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;}
  body{min-height:100vh;}
  #app{max-width:520px; margin:0 auto; padding:0 14px calc(env(safe-area-inset-bottom) + 20px);}
  header{position:sticky; top:0; z-index:5; background:linear-gradient(180deg,var(--bg) 70%,transparent);
    padding:calc(env(safe-area-inset-top) + 12px) 0 10px; display:flex; align-items:center; gap:10px;}
  header .logo{font-size:22px;}
  header h1{font-size:18px; font-weight:700; margin:0; letter-spacing:.3px; flex:1;}
  header .ver{font-size:11px; color:var(--muted);}
  header .iconbtn{background:transparent; border:none; color:var(--muted); font-size:21px;
    padding:10px 8px; margin:-10px -8px -10px 0; cursor:pointer; line-height:1;
    min-width:44px; min-height:44px;}
  .cardhead [data-act]{padding:13px 2px 13px 16px; margin:-13px -2px -13px 0; cursor:pointer;}
  .okmsg{font-size:13px; color:var(--accent); margin-top:10px; font-weight:600;}
  /* Allein üben */
  .tcard{display:flex; align-items:center; gap:12px; background:var(--card);
    border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:10px; cursor:pointer;}
  .tcard:active{background:var(--card2);}
  .tcard .tmain{flex:1; min-width:0;}
  .tcard .tt{font-size:16px; font-weight:700;}
  .tcard .ts{font-size:12px; color:var(--muted); margin-top:2px;}
  .tcard .tb{font-size:22px; font-weight:800; color:var(--gold); flex:none;}
  .tcard .tb small{font-size:11px; color:var(--muted); font-weight:600;}
  .tbig{text-align:center; padding:26px 14px 20px; margin-top:6px;}
  .tbig .tlabel{font-size:38px; font-weight:800; letter-spacing:-.5px;}
  .tdots{display:flex; justify-content:center; gap:9px; margin-top:14px;}
  .tdot{width:15px; height:15px; border-radius:50%; border:2px solid var(--line);}
  .tdot.used{background:var(--red); border-color:transparent;}
  .tgrid{display:flex; flex-wrap:wrap; gap:5px; margin-top:14px;}
  .tmark{font-size:11px; font-weight:700; padding:4px 6px; border-radius:7px;
    background:var(--card2); border:1px solid var(--line); color:var(--muted); min-width:30px; text-align:center;}
  .tmark.hit{background:var(--accent); color:#08240f; border-color:transparent;}
  .tmark.miss{color:var(--red); border-color:#3a2a2d;}
  .tmark.now{border-color:var(--accent); color:var(--text);}
  /* Spieler-Akte */
  .phead{display:flex; align-items:center; gap:12px; margin-bottom:12px; padding:0 3px;}
  .phead .pname{flex:1; font-size:23px; font-weight:800; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .phead .pname .star{color:var(--gold); font-size:19px;}
  .phead .pname .badge{font-size:11px; color:var(--muted); margin-left:7px;
    border:1px solid var(--line); padding:1px 6px; border-radius:8px; vertical-align:middle;}
  .phead .pwins{font-size:26px; font-weight:800; color:var(--gold); flex:none;}
  .phead .pwins small{font-size:11px; color:var(--muted); font-weight:600; margin-left:3px;}
  .srow{display:flex; align-items:baseline; padding:10px 2px; border-bottom:1px solid var(--line);}
  .srow:last-child{border-bottom:none;}
  .srow .sl{flex:1; font-size:14px; color:var(--muted); font-weight:600;}
  .srow .sv{font-size:17px; font-weight:800;}
  .srow .sv small{font-size:11.5px; color:var(--muted); font-weight:600;}
  .alarm{background:#3a2a2d; border:1px solid var(--red); border-radius:12px;
    padding:11px 13px; margin:calc(env(safe-area-inset-top) + 10px) 0 0;
    font-size:13px; color:#ffb4b6; line-height:1.45;}
  .alarm .alarmlink{color:var(--text); font-weight:700; text-decoration:underline; cursor:pointer;
    display:inline-block; padding:6px 0;}
  .infoline{font-size:12.5px; color:var(--muted); margin:10px 3px 0;}
  .infoline b{color:var(--text); font-weight:700;}
  .pick .nm .sublbl{font-size:11.5px; color:var(--muted); font-weight:500; margin-top:2px;}
  .btn{display:flex; align-items:center; justify-content:center; gap:8px;
    min-height:50px; padding:0 16px; border:none; border-radius:14px; cursor:pointer;
    font-size:16px; font-weight:600; color:var(--text); background:var(--card2);
    border:1px solid var(--line); width:100%; user-select:none;}
  .btn:active{transform:scale(.98);}
  .btn.primary{background:var(--accent); color:#08240f; border-color:transparent;}
  .btn.ghost{background:transparent;}
  .btn.danger{color:var(--red); border-color:#3a2a2d;}
  .btn.sm{min-height:40px; font-size:14px; padding:0 12px; border-radius:11px; width:auto;}
  .row{display:flex; gap:10px;}
  .stack{display:flex; flex-direction:column; gap:10px;}
  .muted{color:var(--muted);}
  .center{text-align:center;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px;}

  /* Rangliste */
  .rank{display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line);}
  .rank:last-child{border-bottom:none;}
  .rank .pos{width:26px; font-size:18px; font-weight:800; color:var(--muted); text-align:center;}
  .rank .pos.gold{color:var(--gold);}
  .rank .nm{flex:1; min-width:0; font-size:17px; font-weight:600;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .rank .nm .badge{font-size:11px; color:var(--muted); margin-left:6px; border:1px solid var(--line);
    padding:1px 6px; border-radius:8px;}
  .rank .wins{font-size:18px; font-weight:800;}
  .rank .wins small{font-size:12px; color:var(--muted); font-weight:600; margin-left:3px;}
  .rank.tap{cursor:pointer;} .rank.tap:active{background:var(--card2);}
  .rank .chev{color:var(--muted); font-size:16px; flex:none;}

  /* Wins-Stepper (Team verwalten) */
  .wctl{display:flex; align-items:center; flex:none; background:var(--card2);
    border:1px solid var(--line); border-radius:11px; overflow:hidden;}
  .wctl button{width:40px; min-height:42px; border:none; background:transparent; color:var(--text);
    font-size:22px; font-weight:800; line-height:1; cursor:pointer;}
  .wctl button:active{background:var(--line);}
  .wctl .wv{min-width:42px; text-align:center; font-size:18px; font-weight:800; cursor:pointer;
    padding:9px 4px; border-left:1px solid var(--line); border-right:1px solid var(--line);}

  /* Setup */
  .pick{display:flex; align-items:center; gap:12px; padding:13px; border:1px solid var(--line);
    border-radius:13px; background:var(--card2); margin-bottom:8px; cursor:pointer;}
  .pick.on{border-color:var(--accent); background:rgba(34,197,94,.10);}
  .pick .dot{width:22px; height:22px; border-radius:50%; border:2px solid var(--line); flex:none;}
  .pick.on .dot{border-color:var(--accent); background:var(--accent);}
  .pick .nm{flex:1; font-weight:600;}
  .seg{display:flex; gap:8px;}
  .seg .btn{flex:1;}
  .seg .btn.on{background:var(--accent); color:#08240f; border-color:transparent;}
  input.txt{width:100%; min-height:50px; background:var(--card2); border:1px solid var(--line);
    border-radius:13px; color:var(--text); font-size:16px; padding:0 14px; outline:none;}
  input.txt:focus{border-color:var(--accent);}
  label.lbl{font-size:13px; color:var(--muted); margin:2px 2px 6px; display:block;}

  /* Game scoreboard */
  .board{display:flex; gap:8px; margin-bottom:12px;}
  .pcard{flex:1; background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:10px 8px; text-align:center; position:relative;}
  .pcard.active{border-color:var(--accent); background:rgba(34,197,94,.08); box-shadow:var(--shadow);}
  .pcard .pn{font-size:13px; color:var(--muted); font-weight:700; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;}
  .pcard.active .pn{color:var(--accent);}
  .pcard .ps{font-size:34px; font-weight:800; line-height:1.05; margin:2px 0;}
  .pcard .pmeta{font-size:11px; color:var(--muted);}
  .pcard .arrow{position:absolute; top:-9px; left:50%; transform:translateX(-50%); font-size:12px;}
  .pcard .legbadge{position:absolute; top:6px; right:7px; min-width:19px; height:19px; line-height:19px;
    border-radius:7px; background:var(--card2); border:1px solid var(--line); color:var(--muted);
    font-size:11px; font-weight:800; padding:0 4px;}
  .pcard.active .legbadge{color:var(--accent); border-color:rgba(34,197,94,.45);}
  .legline{font-size:12px; color:var(--muted); text-align:center; margin:-2px 0 9px;}
  .legline b{color:var(--text);}
  .rank .nmtap{cursor:pointer;}
  .rank .nm .star{color:var(--gold); font-size:14px;}
  .rank .nm .sublbl{font-size:11.5px; color:var(--muted); font-weight:600; margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .turn{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px; margin-bottom:12px;}
  .turn .slots{display:flex; gap:8px; margin-bottom:8px;}
  .slot{flex:1; height:52px; border-radius:12px; border:1px dashed var(--line); display:flex;
    align-items:center; justify-content:center; font-size:18px; font-weight:800; color:var(--muted);
    background:var(--card2);}
  .slot.filled{border-style:solid; border-color:var(--accent); color:var(--text);}
  .slot.dead{border-color:var(--line); color:var(--muted); text-decoration:line-through;}
  .lastturn{font-size:12.5px; color:var(--muted); text-align:center; margin:-4px 0 10px; line-height:1.4;}
  .lastturn b{color:var(--text); font-weight:700;}
  .lastturn.bust{color:var(--red);} .lastturn.bust b{color:var(--red);}
  .lastturn.win{color:var(--gold);} .lastturn.win b{color:var(--gold);}
  .lastturn.dead{color:var(--gold);}
  .turn .info{display:flex; justify-content:space-between; align-items:center; font-size:13px;}
  .turn .co{color:var(--gold); font-weight:700;}
  .turn .sum{color:var(--muted);} .turn .sum b{color:var(--text);}

  .mult{display:flex; gap:8px; margin-bottom:8px;}
  .mult .btn{flex:1; min-height:46px;}
  .mult .btn.on{background:var(--accent); color:#08240f; border-color:transparent;}

  .modeseg{margin-bottom:9px;}
  .modeseg .btn{min-height:42px; font-size:14px;}
  .sumbox{background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:14px; text-align:center; margin-bottom:9px;}
  .sumval{font-size:42px; font-weight:800; line-height:1.05; letter-spacing:-1px;}
  .sumval.empty{font-size:17px; color:var(--muted); font-weight:600; padding:12px 0 11px;}
  .sumrest{font-size:12.5px; color:var(--muted); margin-top:5px;}
  .sumrest b{color:var(--text);} .sumrest .w{color:var(--gold); font-weight:600;}
  .sumpad{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .sumpad .btn{min-height:58px; font-size:22px; border-radius:13px;}
  .sumfinish{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px;}
  .sumfinish .sflabel{font-size:14px; font-weight:600; text-align:center; margin-bottom:11px;}
  .sumfinish .btn{min-height:58px; font-size:20px;}
  .pad{display:grid; grid-template-columns:repeat(5,1fr); gap:7px;}
  .pad .btn{min-height:52px; font-size:18px; padding:0; border-radius:12px; background:var(--card2);}
  .pad .btn.bull{color:var(--red);} .pad .btn.miss{color:var(--muted);}
  .gctl{display:flex; gap:10px; margin-top:10px; align-items:stretch;}
  .gctl .btn{flex:1; min-height:54px;}
  .gctl .skipbtn{flex:1; font-size:12.5px; line-height:1.25; color:var(--muted); padding:0 8px;}

  /* Sprach-Eingabe ("Bike"-Modus) */
  .voice{margin-top:12px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px;}
  .voice .vhead{display:flex; gap:8px; align-items:stretch;}
  .micbtn{flex:1; display:flex; align-items:center; justify-content:center; gap:9px; min-height:54px;
    border:1px solid var(--line); border-radius:13px; background:var(--card2); color:var(--text);
    font-size:16px; font-weight:700; cursor:pointer; user-select:none; padding:0 12px;}
  .micbtn:active{transform:scale(.98);}
  .micbtn.on{background:var(--red); border-color:transparent; color:#fff; animation:vpulse 1.5s ease-in-out infinite;}
  .micbtn:disabled{opacity:.5; cursor:default;}
  .ttsbtn{width:56px; min-height:54px; font-size:22px; border:1px solid var(--line); border-radius:13px;
    background:var(--card2); color:var(--text); cursor:pointer;}
  .ttsbtn.off{opacity:.42;}
  @keyframes vpulse{0%,100%{box-shadow:0 0 0 0 rgba(229,72,77,.55);} 50%{box-shadow:0 0 0 11px rgba(229,72,77,0);}}
  .voice .vstat{font-size:13px; margin-top:10px; min-height:18px; line-height:1.45;}
  .voice .vstat b{color:var(--text);}
  .voice .vhint{font-size:12px; color:var(--muted); margin-top:6px; line-height:1.4;}

  /* Win */
  .win{text-align:center; padding:30px 0 10px;}
  .win .trophy{font-size:64px;}
  .win h2{font-size:26px; margin:10px 0 4px;}
  .win .sub{color:var(--muted); margin-bottom:22px;}

  /* Direktvergleich */
  .cardhead{font-size:13px; color:var(--muted); font-weight:700; margin-bottom:4px;
    display:flex; justify-content:space-between; align-items:baseline;}
  .chips{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:12px;}
  .chip{border:1px solid var(--line); background:var(--card2); color:var(--muted);
    border-radius:11px; padding:9px 13px; font-size:14px; font-weight:700; cursor:pointer;}
  .chip.on.a{background:var(--accent); border-color:transparent; color:#08240f;}
  .chip.on.b{background:var(--accent2); border-color:transparent; color:#06213f;}
  .h2hcard{text-align:center; padding:16px 14px 14px;}
  .h2hnames{display:flex; justify-content:center; align-items:baseline; gap:10px;
    font-size:14px; font-weight:700; color:var(--muted);}
  .h2hnames .vs{font-size:11px; opacity:.7;}
  .h2hbig{display:flex; justify-content:center; align-items:baseline; gap:10px; margin:2px 0 10px;}
  .h2hbig .a{font-size:46px; font-weight:800; color:var(--accent); line-height:1;}
  .h2hbig .b{font-size:46px; font-weight:800; color:var(--accent2); line-height:1;}
  .h2hbig .sep{font-size:26px; color:var(--muted); font-weight:700;}
  .bar{height:7px; border-radius:5px; background:var(--accent2); overflow:hidden;}
  .bar i{display:block; height:100%; background:var(--accent);}
  .h2hsub{font-size:12px; color:var(--muted); margin-top:7px;}
  .h2hstreak{font-size:12.5px; color:var(--gold); margin-top:8px; font-weight:600;}
  .cmp{display:flex; align-items:center; padding:9px 2px; border-bottom:1px solid var(--line);}
  .cmp:last-child{border-bottom:none;}
  .cmp .ca,.cmp .cb{width:74px; font-size:16px; font-weight:800;}
  .cmp .cb{text-align:right;}
  .cmp .cl{flex:1; text-align:center; font-size:12px; color:var(--muted); font-weight:600;}
  .cmp.la .ca{color:var(--accent);} .cmp.lb .cb{color:var(--accent2);}
  .dots{display:flex; align-items:center; gap:6px; margin-top:12px; padding:0 3px;}
  .dot2{width:11px; height:11px; border-radius:50%; background:var(--line); flex:none;}
  .dot2.a{background:var(--accent);} .dot2.b{background:var(--accent2);}
  .dotsl{font-size:11px; color:var(--muted); margin-left:5px;}
  .grow{display:flex; align-items:center; gap:11px; padding:10px 2px; border-bottom:1px solid var(--line);}
  .grow:last-child{border-bottom:none;}
  .grow .gdate{font-size:11.5px; color:var(--muted); width:74px; flex:none; font-weight:600;}
  .grow .gmain{flex:1; font-size:14px; min-width:0;}
  .grow .gmain b{font-weight:700;}
  .grow .gsub{display:block; font-size:11px; color:var(--muted); margin-top:1px;}
  .grow .gdot{width:8px; height:8px; border-radius:50%; flex:none;}
  .grow .gdot.a{background:var(--accent);} .grow .gdot.b{background:var(--accent2);}
  .duel{display:flex; align-items:center; gap:8px; padding:11px 2px;
    border-bottom:1px solid var(--line); cursor:pointer;}
  .duel:last-child{border-bottom:none;} .duel:active{background:var(--card2);}
  .duel .dn{flex:1; min-width:0; font-size:15px; font-weight:600;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .duel .dnb{text-align:right;}
  .duel .ds{font-size:17px; font-weight:800; flex:none; letter-spacing:.5px;}
  .duel .ds i{font-style:normal; color:var(--muted); margin:0 3px; font-weight:600;}
  .duelfuss{font-size:11.5px; color:var(--muted); padding:9px 2px 2px; line-height:1.4;}
  .duel .ds .va{color:var(--accent);} .duel .ds .vb{color:var(--accent2);}
  .duel.la .dna{color:var(--accent);} .duel.lb .dnb{color:var(--accent2);}
  .duel .ds .va{color:var(--accent);} .duel .ds .vb{color:var(--muted);}

  .fab{margin-top:8px;}
  .hint{font-size:12px; color:var(--muted); text-align:center; margin-top:14px;}
  a{color:var(--accent);}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

// ---------------------------------------------------------------------------
// Speicher
// ---------------------------------------------------------------------------
var KEY    = "darts_v2";
var KEY_V1 = "darts_v1";
var VER    = "1.16";

function sumMode(){ return state.settings.inputMode === "sum"; }
function defaultSettings(){
  return { gameType:501, doubleOut:true, doubleIn:false, bestOf:1,
           tts:true, keepHistory:true, meId:"lion", inputMode:"single" };
}
function defaultState(){
  return {
    v:2,
    roster:[
      {id:"arne",   name:"Arne",   winsManual:3, guest:false},
      {id:"justus", name:"Justus", winsManual:2, guest:false},
      {id:"lion",   name:"Lion",   winsManual:1, guest:false}
    ],
    match:null,
    history:[],
    practice:[],
    train:null,
    settings:defaultSettings()
  };
}
function mid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

// v1 -> v2: die von Hand gepflegten Wins ueberleben als Basis-Offset (winsManual).
// Sie werden NICHT ueberschrieben - gespielte Matches kommen oben drauf.
function migrate(old){
  var s = defaultState();
  if(old && old.roster && old.roster.length){
    s.roster = old.roster.map(function(p){
      return {id:p.id, name:p.name, winsManual:(p.wins||0), guest:!!p.guest};
    });
  }
  if(old && old.match && !old.match.finished){          // laufendes Spiel mitnehmen
    var m = old.match;
    m.id=mid(); m.ts=Date.now(); m.mode="x01";
    m.bestOf=1; m.legNo=1; m.startIdx=0; m.doubleIn=false; m.legs=[];
    m._undo=[];                   // v1-Schnappschuesse kennen die Leg-Felder nicht
    m.players = m.players.map(function(p){
      return {id:p.id, name:p.name, score:p.score, darts:p.darts||0, legsWon:0,
              scored:0, best:0, tons:0, oneEighties:0, checkout:0,
              legDarts:p.darts||0, legStart:false};
    });
    s.match = m;
  }
  return s;
}
// Felder nachziehen, die eine aeltere v2-Fassung noch nicht kannte.
function upgradeShape(s){
  if(!Array.isArray(s.history)) s.history=[];
  s.history = s.history.filter(function(m){ return m && Array.isArray(m.players) && m.players.length; });
  if(!Array.isArray(s.practice)) s.practice=[];
  s.practice = s.practice.filter(function(r){ return r && r.playerId && r.mode; });
  // Fremde IDs koennten Anfuehrungszeichen enthalten und aus einem data-Attribut
  // ausbrechen. Durch slug() ist das ausgeschlossen.
  var vergeben = {};
  s.roster.forEach(function(p){
    var clean = slug(String(p.id||p.name||""));
    while(vergeben[clean]) clean += "x";     // sonst teilen sich zwei Zeilen einen Schluessel
    vergeben[clean] = true;
    if(clean!==p.id){
      var alt=p.id; p.id=clean;
      (s.history||[]).forEach(function(m2){
        (m2.players||[]).forEach(function(q){ if(q.id===alt) q.id=clean; });
        if(m2.winnerId===alt) m2.winnerId=clean;
      });
      (s.practice||[]).forEach(function(r){ if(r.playerId===alt) r.playerId=clean; });
      if(s.settings && s.settings.meId===alt) s.settings.meId=clean;
    }
  });
  if(!("train" in s)) s.train=null;
  if(!s.settings) s.settings=defaultSettings();
  var d=defaultSettings(); for(var k in d) if(!(k in s.settings)) s.settings[k]=d[k];
  s.roster.forEach(function(p){
    if(typeof p.winsManual!=="number") p.winsManual = (typeof p.wins==="number"?p.wins:0);
    delete p.wins;
  });
  if(s.match && (!Array.isArray(s.match.players) || !s.match.players.length)) s.match=null;
  if(s.match){
    var m=s.match;
    // Felder, ohne die der naechste Dart wirft. Fremde oder alte Sicherungen
    // bringen sie nicht immer mit.
    if(!Array.isArray(m._undo)) m._undo=[];
    if(!("lastTurn" in m)) m.lastTurn=null;
    if(!Array.isArray(m.currentTurn)) m.currentTurn=[];
    if(typeof m.currentIdx!=="number" || !m.players[m.currentIdx]) m.currentIdx=0;
    if(typeof m.gameType!=="number") m.gameType=501;
    if(typeof m.turnStartScore!=="number") m.turnStartScore=m.players[m.currentIdx].score;
    if(typeof m.legNo!=="number") m.legNo=1;
    if(typeof m.startIdx!=="number") m.startIdx=0;
    if(typeof m.bestOf!=="number") m.bestOf=1;
    if(!m.legs) m.legs=[];
    if(!m.id) m.id=mid();
    m.players.forEach(function(p){
      ["legsWon","scored","best","tons","oneEighties","checkout","legDarts"].forEach(function(f){
        if(typeof p[f]!=="number") p[f]=0; });
      if(typeof p.legStart!=="boolean") p.legStart=false;
    });
  }
  s.v=2;
  return s;
}
// Laeuft eine Uebung, deren Modus diese Fassung ueberhaupt kennt? TRAIN wird

var LIVE_VIEWS = ["game","leg","win","train"];
var speicherKaputt = false;   // localStorage lehnt ab (Safari-Privatmodus, Quota)

var view  = "home";          // home | roster | setup | game | leg | win | h2h | player | solo | train | settings
                             // Der gemerkte Bildschirm wird ganz unten gesetzt -
                             // dort sind TRAIN und die Render-Funktionen belegt.
var curMult = 1;         // aktueller Multiplikator im Zahlenfeld
var setupSel = null;     // {selected:[ids], gameType, doubleOut, doubleIn, bestOf}
var h2hSel = null;       // [idA, idB] im Direktvergleich
var h2hAuto = true;      // true = von der App vorbelegt, wird beim naechsten Blick neu bestimmt
var settingsMsg = "";    // kurze Rueckmeldung im Einstellungs-Screen

// ---------------------------------------------------------------------------
// Darts-Regeln: Wurf-Werte, Checkout-Rechner
// ---------------------------------------------------------------------------
function dartValue(mult, num){
  // Fehlwurf: der gedrueckte Multiplikator darf daraus kein "D0" machen - sonst
  // eroeffnet ein Danebenwurf ein Doppel-In-Leg.
  if(num===0)  return {value:0,  isDouble:false, label:"&ndash;"};
  if(num===25) return {value:25, isDouble:false, label:"25"};       // aeusserer Bull = Single
  if(num===50) return {value:50, isDouble:true,  label:"Bull"};     // Bull = Doppel-25
  var pre = mult===3 ? "T" : (mult===2 ? "D" : "");
  return {value:num*mult, isDouble:mult===2, label:pre+num};
}

// Alle moeglichen Einzelwuerfe (fuer den Checkout-Rechner), absteigend sortiert.
var DOUBLES = [];  for(var n=1;n<=20;n++) DOUBLES.push({value:n*2, label:"D"+n}); DOUBLES.push({value:50,label:"Bull"});
var ALLTHROWS = [];
for(var n=1;n<=20;n++) ALLTHROWS.push({value:n*3, label:"T"+n});
for(var n=1;n<=20;n++) ALLTHROWS.push({value:n*2, label:"D"+n});
for(var n=1;n<=20;n++) ALLTHROWS.push({value:n,   label:""+n});
ALLTHROWS.push({value:25,label:"25"}); ALLTHROWS.push({value:50,label:"Bull"});
ALLTHROWS.sort(function(a,b){return b.value-a.value;}); // "hoch zielen zuerst"

// Kuerzestes Finish fuer 'score' mit hoechstens 'dartsLeft' Darts.
// doubleOut=true -> der letzte Dart muss ein Doppel (oder Bull) sein.
function checkout(score, dartsLeft, doubleOut){
  if(dartsLeft<1) return null;
  if(score<=0 || score > (doubleOut?170:180)) return null;
  var finishers = doubleOut ? DOUBLES : ALLTHROWS;
  var i,j,rem,d;
  // 1 Dart
  for(i=0;i<finishers.length;i++) if(finishers[i].value===score) return [finishers[i].label];
  if(dartsLeft<2) return null;
  // 2 Darts
  for(i=0;i<ALLTHROWS.length;i++){
    rem = score-ALLTHROWS[i].value; if(rem<=0) continue;
    d = finishers.find(function(x){return x.value===rem;});
    if(d) return [ALLTHROWS[i].label, d.label];
  }
  if(dartsLeft<3) return null;
  // 3 Darts
  for(i=0;i<ALLTHROWS.length;i++){
    for(j=0;j<ALLTHROWS.length;j++){
      rem = score-ALLTHROWS[i].value-ALLTHROWS[j].value; if(rem<=0) continue;
      d = finishers.find(function(x){return x.value===rem;});
      if(d) return [ALLTHROWS[i].label, ALLTHROWS[j].label, d.label];
    }
  }
  return null;
}

// ---------------------------------------------------------------------------
// Spiel-Logik
// ---------------------------------------------------------------------------
function rosterOf(id){ return state.roster.find(function(p){return p.id===id;}); }

// Vor jedem Start: laeuft noch etwas, das sonst kommentarlos verschwindet?
// Ein gewonnenes, nicht eingetragenes Spiel ist der teuerste Fall - es waere
// aus Rangliste und Duellbilanz ersatzlos weg.
function darfUeberschreiben(){
  if(state.match && state.match.finished)
    return confirm("Das gewonnene Spiel ist noch nicht eingetragen. Wirklich verwerfen?");
  if(state.match)
    return confirm("Es läuft noch ein Spiel. Wirklich verwerfen?");
  if(state.train && !state.train.done)
    return confirm("Es läuft noch eine Übung. Wirklich abbrechen?");
  return true;
}

// "Das bin ich": in Duellen steht dieser Spieler immer links. Ohne den Marker
// entschiede die alphabetische Reihenfolge, und Lion staende mal links, mal
// rechts - bei einer Bilanz wie 3:8 muss man dann jedes Mal neu hinsehen.
function meId(){
  var id = state.settings && state.settings.meId;
  return (id && rosterOf(id)) ? id : null;
}
// Paar so drehen, dass "ich" vorne steht.
function orderPair(a, b){
  var me = meId();
  return (me && b===me && a!==me) ? [b, a] : [a, b];
}

// Wins = von Hand gepflegter Grundstand + jedes gewonnene Match aus der Historie.
function historyWins(id){
  var n=0;
  for(var i=0;i<state.history.length;i++){
    var m = state.history[i];
    if(m.players.length<2) continue;          // allein gespielt ist kein Sieg ueber jemanden
    if(m.winnerId===id) n++;
  }
  return n;
}
function totalWins(id){
  var r=rosterOf(id);
  return Math.max(0, (r?(r.winsManual||0):0) + historyWins(id));
}

function legsNeeded(m){ return Math.floor((m.bestOf||1)/2)+1; }

function freshPlayer(id, gt){
  var r = rosterOf(id);
  return {id:id, name:r?r.name:nameOf(id), score:gt, darts:0, legsWon:0,
          scored:0, best:0, tons:0, oneEighties:0, checkout:0,
          legDarts:0, legStart:true};
}

// opts: {gameType, doubleOut, doubleIn, bestOf, mode}  - fehlendes kommt aus den Einstellungen.
function startMatch(playerIds, opts){
  opts = opts || {};
  var st = state.settings;
  var gt = opts.gameType || st.gameType;
  state.match = {
    id:mid(), ts:Date.now(), mode:opts.mode||"x01",
    gameType:gt,
    doubleOut: opts.doubleOut!==undefined ? !!opts.doubleOut : !!st.doubleOut,
    doubleIn:  opts.doubleIn !==undefined ? !!opts.doubleIn  : !!st.doubleIn,
    bestOf:    opts.bestOf   || st.bestOf || 1,
    players: playerIds.map(function(id){ return freshPlayer(id, gt); }),
    currentIdx:0, startIdx:0, legNo:1,
    currentTurn:[], turnStartScore:gt, lastTurn:null,
    legs:[], finished:false, winnerId:null, _undo:[]
  };
  curMult = 1; view = "game"; save();
}

// Alles, was ein Undo wiederherstellen muss - an EINER Stelle. Wer hier ein Feld
// vergisst, baut eine Anzeige, die nach dem Zurueck weiter das Alte behauptet.
var MATCH_SNAP = ["players","currentIdx","currentTurn","turnStartScore",
                  "finished","winnerId","legNo","startIdx","legs","lastTurn"];
function snapshot(){
  var m = state.match, o = {};
  for(var i=0;i<MATCH_SNAP.length;i++) o[MATCH_SNAP[i]] = m[MATCH_SNAP[i]];
  m._undo.push(JSON.stringify(o));
  if(m._undo.length>80) m._undo.shift();
}
// Rueckgabe: wurde wirklich etwas zurueckgenommen? Ohne die Antwort meldet der
// Sprachmodus "zurueck" auch dann, wenn der Stapel leer war.
function undo(){
  var m = state.match; if(!m || !m._undo.length) return false;
  var s = JSON.parse(m._undo.pop());
  // Nur Felder uebernehmen, die im Schnappschuss stehen - ein Stapel aus einer
  // aelteren Fassung kennt legs/legNo/startIdx nicht und wuerde sie auf
  // undefined setzen.
  for(var i=0;i<MATCH_SNAP.length;i++){
    var f = MATCH_SNAP[i];
    if(Object.prototype.hasOwnProperty.call(s,f)) m[f] = s[f];
  }
  curMult = 1; view = "game"; save(); render(); return true;
}

// Aufnahme abschliessen: erst die Statistik buchen, dann weiterreichen.
// Nach einem Bust ist score wieder turnStartScore -> got=0, genau richtig.
function closeTurn(kind){
  var m = state.match, p = m.players[m.currentIdx];
  var got = m.turnStartScore - p.score;
  if(got>0){
    p.scored += got;
    if(got>p.best) p.best = got;
    if(got>=100) p.tons++;
    if(got===180) p.oneEighties++;
  }
  // Was der Vorgaenger geworfen hat, muss stehen bleiben. Sonst ist ein Bust
  // vom Bildschirm nicht zu unterscheiden und "was hatt ich?" nicht zu beantworten.
  // Wer ohne Wurf weiterreicht, loescht damit aber nicht die Anzeige davor.
  if(m.currentTurn.length){
    m.lastTurn = {
      id:p.id, name:p.name, kind:kind||"ok", sum:Math.max(0,got), rest:p.score,
      labels:m.currentTurn.map(function(d){return d.label;})
    };
  }
}
var quietSay = false;   // true, solange der Sprachmodus selbst ansagt

// Ansage nach der Aufnahme: "Arne 105, Rest 396" bzw. "Ueberworfen".
// Genau das, was man beim Darts sowieso laut sagt.
function sayLastTurn(){
  if(quietSay) return;
  var lt = state.match && state.match.lastTurn; if(!lt) return;
  if(lt.kind==="bust")         say(lt.name+". Überworfen. Zurück auf "+lt.rest);
  else if(lt.kind==="nostart") say("Noch kein Doppel");
  else if(lt.kind==="ok" && lt.labels.length) say(lt.name+" "+lt.sum+". Rest "+lt.rest);
}

function endTurn(kind){
  var m = state.match;
  closeTurn(kind);
  sayLastTurn();
  m.currentTurn = [];
  m.currentIdx = (m.currentIdx+1) % m.players.length;
  m.turnStartScore = m.players[m.currentIdx].score;
  curMult = 1;
}

function bust(){
  var m = state.match;
  var p = m.players[m.currentIdx];
  p.score = m.turnStartScore;   // ganzer Aufnahme-Wurf zurueck
  endTurn("bust");
}

// Leg gewonnen: Zwischenstand oder Matchende. Der Anwurf wechselt jedes Leg.
function winLeg(p){
  var m = state.match;
  p.legsWon++;
  m.legs.push({no:m.legNo, winnerId:p.id, darts:p.legDarts});
  if(p.legsWon >= legsNeeded(m)){
    m.finished = true; m.winnerId = p.id; view = "win";
    return;
  }
  m.legNo++;
  m.startIdx = (m.startIdx+1) % m.players.length;
  m.currentIdx = m.startIdx;
  m.players.forEach(function(q){ q.score=m.gameType; q.legDarts=0; q.legStart=true; });
  m.currentTurn = []; m.turnStartScore = m.gameType; curMult = 1;
  m.lastTurn = null;              // sonst steht der Ausmach-Wurf im naechsten Leg
  view = "leg";
}

// Ein Dart. mult in {1,2,3}, num in 1..20 oder 0/25/50.
// Rueckgabe: ok | bust | leg | win | nostart | noop
function applyDart(mult, num){
  var m = state.match; if(!m || m.finished) return "noop";
  var dv = dartValue(mult, num);
  snapshot();
  var p = m.players[m.currentIdx];
  p.darts++; p.legDarts++;
  curMult = 1;                  // gilt fuer JEDEN Ausgang - sonst bleibt Triple haengen

  // Doppel-In: bis zum ersten Doppel zaehlt kein Wurf auf das Konto. Der Wurf
  // wird mit Wert 0 gebucht, sonst zeigt die Aufnahme-Summe Punkte an, die
  // nirgendwo abgezogen wurden.
  if(m.doubleIn && p.legStart && !dv.isDouble){
    m.currentTurn.push({label:dv.label, value:0, isDouble:false, nostart:true});
    if(m.currentTurn.length>=3) endTurn("nostart");
    save(); render(); return "nostart";
  }
  if(m.doubleIn && p.legStart) p.legStart = false;

  m.currentTurn.push({label:dv.label, value:dv.value, isDouble:dv.isDouble});
  var ns = p.score - dv.value;

  if(ns===0 && (!m.doubleOut || dv.isDouble)){          // Leg ausgemacht
    var finishFrom = m.turnStartScore;
    p.score = 0;
    closeTurn(legsNeeded(m) > p.legsWon+1 ? "leg" : "win");
    if(finishFrom > (p.checkout||0)) p.checkout = finishFrom;
    winLeg(p);
    save(); render(); return m.finished ? "win" : "leg";
  }
  // Bust: unter 0, oder (Doppel-Out) genau 1, oder 0 ohne Doppel
  if(ns<0 || (m.doubleOut && ns===1) || (ns===0 && m.doubleOut && !dv.isDouble)){
    bust(); save(); render(); return "bust";
  }
  p.score = ns;
  if(m.currentTurn.length>=3) endTurn();
  save(); render(); return "ok";
}

// Match abschliessen -> wandert in die Historie, aus der Rangliste und H2H entstehen.
function finishMatch(){
  var m = state.match; if(!m) return null;
  var rec = null;
  if(state.settings.keepHistory!==false && m.finished){
    rec = {
      id:m.id, ts:m.ts, ended:Date.now(), mode:m.mode, gameType:m.gameType,
      doubleOut:m.doubleOut, doubleIn:m.doubleIn, bestOf:m.bestOf, winnerId:m.winnerId,
      legs:m.legs.slice(),
      players:m.players.map(function(p){
        return {id:p.id, name:p.name, legsWon:p.legsWon, darts:p.darts, scored:p.scored,
                best:p.best, tons:p.tons, oneEighties:p.oneEighties, checkout:p.checkout,
                avg: p.darts ? +((p.scored/p.darts*3).toFixed(2)) : 0};
      })
    };
    state.history.unshift(rec);
    // Deckeln, aber nichts unterschlagen: der aelteste Sieg wird eingefroren,
    // sonst sinkt die Rangliste beim 501. Spiel stillschweigend.
    capHistory();
  }
  state.match = null; save();
  return rec;
}

// Alte Spiele wegwerfen, aber nichts unterschlagen: der Sieg wandert in den
// Handeintrag, und der beste Solo-Lauf je Startwert bleibt stehen - sonst
// verschwindet ein Rekord, den die App zwei Zeilen weiter noch anzeigt.
function capHistory(){
  if(state.history.length<=500) return;
  var behalten = state.history.slice(0,500);
  var drin = {};
  behalten.forEach(function(m){ drin[m.id] = true; });
  var rest = state.history.slice(500);
  var beste = {};
  rest.forEach(function(m){
    if(!m.players || m.players.length!==1) return;
    var p = m.players[0]; if(!p.darts) return;
    var k = p.id+"|"+m.gameType;
    if(!beste[k] || p.darts < beste[k].players[0].darts) beste[k] = m;
  });
  rest.forEach(function(m){
    if(m.players && m.players.length>=2 && m.winnerId){
      var rr = rosterOf(m.winnerId);
      if(rr) rr.winsManual = (rr.winsManual||0)+1;
    }
  });
  for(var k2 in beste){
    var b = beste[k2];
    // Nur behalten, wenn es kein besseres unter den behaltenen gibt.
    var besser = behalten.some(function(m){
      return m.players && m.players.length===1 && m.players[0].id===b.players[0].id
        && m.gameType===b.gameType && m.players[0].darts && m.players[0].darts <= b.players[0].darts;
    });
    if(!besser && !drin[b.id]) behalten.push(b);
  }
  state.history = behalten;
}

// Wins von Hand aendern: der Handeintrag ist ein Offset auf die gespielten Siege.
function bumpWins(id, delta){
  var r = rosterOf(id); if(!r) return;
  if(totalWins(id)+delta < 0) return;
  r.winsManual = (r.winsManual||0) + delta; save();
}
function setWins(id, val){
  var r = rosterOf(id); if(!r) return;
  r.winsManual = Math.max(0, Math.round(val||0)) - historyWins(id); save();
}

// ---------------------------------------------------------------------------
// Roster-Verwaltung
// ---------------------------------------------------------------------------
// Ist dieser Schluessel schon vergeben - im Team ODER in den Aufzeichnungen?
function idBelegt(id){
  if(state.roster.some(function(p){return p.id===id;})) return true;
  for(var i=0;i<state.history.length;i++){
    var ps = state.history[i].players||[];
    for(var j=0;j<ps.length;j++) if(ps[j].id===id) return true;
  }
  for(var k=0;k<state.practice.length;k++) if(state.practice[k].playerId===id) return true;
  return false;
}

function slug(name){
  return name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") || ("p"+Date.now());
}
function addPlayer(name, guest){
  name = (name||"").trim(); if(!name) return null;
  var id = slug(name);
  // Auch gegen die Historie pruefen: sonst erbt ein namensgleicher Neuling die
  // Siege eines geloeschten Spielers.
  while(idBelegt(id)) id += "x";
  state.roster.push({id:id, name:name, winsManual:0, guest:!!guest});
  save();
  return id;
}

// Rendering
// ---------------------------------------------------------------------------
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }

function h(){ return '<header><span class="logo">&#127919;</span><h1>Darts</h1>'
  + '<button class="iconbtn" data-act="nav" data-view="settings" aria-label="Einstellungen">&#9881;&#65039;</button>'
  + '</header>'; }

// Die zuletzt gespielten Paarungen direkt auf der Startseite - eine Zeile je
// Duell, tippen fuehrt in den Direktvergleich.
function duelCard(){
  var alle = allDuels();
  var d = alle.slice(0,4);
  // Runden mit mehr als zwei Leuten zaehlen in die Rangliste, tauchen hier aber
  // in keiner Zeile auf. Ohne diese Zahl passt die Rangliste nicht zur Karte.
  var mehr = 0;
  for(var i=0;i<state.history.length;i++)
    if(state.history[i].players && state.history[i].players.length>2) mehr++;
  if(!d.length && !mehr) return '';
  var rows = d.map(function(x){
    var lead = x.winsA===x.winsB ? "" : (x.winsA>x.winsB ? " la" : " lb");

// 3-Dart-Schnitt. Die laufende Aufnahme zaehlt live mit, sonst springt die Zahl erst
// beim Spielerwechsel - das sieht auf dem Board aus wie ein Fehler.
function avgOf(p){
  var m = state.match, sc = p.scored||0, d = p.darts||0;
  if(m && !m.finished && m.players[m.currentIdx]===p) sc += Math.max(0, m.turnStartScore - p.score);
  return d ? (sc/d*3).toFixed(1) : "0.0";
}
function fmtDate(ts){
  var d=new Date(ts), p2=function(n){return n<10?"0"+n:""+n;};
  return p2(d.getDate())+"."+p2(d.getMonth()+1)+"."+" "+p2(d.getHours())+":"+p2(d.getMinutes());
}

// Eine Zeile ueber dem Board: Leg-Stand und - bei zwei Spielern - die laufende
// Duellbilanz. Genau die Frage "wie steht es gerade zwischen Arne und mir".
function gameHead(m, multi){
  var parts = [];
  if(multi) parts.push('Leg '+m.legNo+' &middot; erst bei <b>'+legsNeeded(m)+'</b> ist Schluss');
  if(m.players.length===2){
    var r = h2h(m.players[0].id, m.players[1].id);
    if(r.n) parts.push('Duell <b>'+r.winsA+':'+r.winsB+'</b> aus '+r.n);
  }
  return parts.length ? '<div class="legline">'+parts.join(' &nbsp;&middot;&nbsp; ')+'</div>' : '';
}

// Was zuletzt passiert ist - in Worten. Ohne diese Zeile ist ein Bust auf dem
// Bildschirm von "nichts passiert" nicht zu unterscheiden.
function lastTurnLine(m){
  var lt = m.lastTurn;
  if(!lt || !lt.labels || !lt.labels.length) return '';
  var wuerfe = lt.labels.join(' ');
  if(lt.kind==="bust")
    return '<div class="lastturn bust">&#128165; <b>'+esc(lt.name)+'</b> '+wuerfe
      + ' &middot; überworfen, zurück auf <b>'+lt.rest+'</b></div>';
  if(lt.kind==="nostart")
    return '<div class="lastturn dead">&#9888;&#65039; <b>'+esc(lt.name)+'</b> '+wuerfe
      + ' &middot; noch kein Doppel &ndash; zählt nicht</div>';
  if(lt.kind==="leg" || lt.kind==="win")
    return '<div class="lastturn win">&#127919; <b>'+esc(lt.name)+'</b> '+wuerfe
      + ' &middot; ausgemacht</div>';
  return '<div class="lastturn">Zuletzt <b>'+esc(lt.name)+'</b> '+wuerfe
    + ' = <b>'+lt.sum+'</b> &middot; Rest '+lt.rest+'</div>';
}

// ---------------------------------------------------------------------------
// Summen-Eingabe: die ganze Aufnahme auf einmal
// An der Scheibe ruft einer "einundachtzig" - dann will man 81 tippen und nicht
// drei Darts einzeln. Der Einzel-Modus bleibt fuer alle, die genau zaehlen wollen.
// ---------------------------------------------------------------------------

// Eine komplette Aufnahme buchen. dartsUsed nur beim Ausmachen relevant.
// Rueckgabe: ok | bust | leg | win | finish | ungueltig | noop
// opened: undefined = die App muss fragen, true = mit Doppel eroeffnet,
// false = ausdruecklich ohne. Ohne diese Unterscheidung war Doppel-In im
// Summen-Modus schlicht wirkungslos, waehrend der Schirm das Gegenteil behauptete.
function applyTurnSum(sum, dartsUsed, opened){
  var m = state.match; if(!m || m.finished) return "noop";
  sum = Math.round(sum);
  if(!(sum>=0 && sum<=180)) return "ungueltig";
  var p = m.players[m.currentIdx];

  if(m.doubleIn && p.legStart){
    if(opened===undefined) return "needopen";
    if(opened===false){                      // geworfen, aber nicht eroeffnet
      snapshot();
      var dn = dartsUsed || 3;
      p.darts += dn; p.legDarts += dn;
      m.currentTurn = [{label:String(sum), value:0, sum:true, nostart:true}];
      endTurn("nostart");
      save(); render(); return "nostart";
    }
    p.legStart = false;
  }

  var ns = p.score - sum;

  // Ausgemacht: fuer die Statistik zaehlt, mit wie vielen Darts.
  if(ns===0 && !dartsUsed) return "finish";

  snapshot();
  var d = dartsUsed || 3;
  p.darts += d; p.legDarts += d;
  m.currentTurn = [{label:String(sum), value:sum, sum:true}];

  if(ns===0){
    p.score = 0;
    closeTurn(legsNeeded(m) > p.legsWon+1 ? "leg" : "win");
    if(m.turnStartScore > (p.checkout||0)) p.checkout = m.turnStartScore;
    sayLastTurn();
    winLeg(p);
    save(); render(); return m.finished ? "win" : "leg";
  }
  if(ns<0 || (m.doubleOut && ns===1)){
    bust(); save(); render(); return "bust";
  }
  p.score = ns;
  endTurn();
  save(); render(); return "ok";
}

function renderSumPad(m, cur){
  var val = sumInput==="" ? 0 : parseInt(sumInput,10);
  var rest = cur.score - val;
  var warn = "";
  if(sumInput!==""){
    if(val>180) warn = 'Mehr als 180 gibt es nicht';
    else if(rest<0) warn = 'Mehr als der Rest &ndash; das wäre überworfen';
    else if(m.doubleOut && rest===1) warn = 'Rest 1 ist nicht ausspielbar &ndash; überworfen';
    else if(rest===0) warn = 'Ausgemacht!';
  }
  function key(k, cls, label){
    return '<button class="btn'+(cls?" "+cls:"")+'" data-act="sumkey" data-k="'+k+'">'
      + (label||k) + '</button>';
  }
  var pad = "";
  [7,8,9,4,5,6,1,2,3].forEach(function(n){ pad += key(n); });
  pad += key("del","ghost","&#9003;") + key(0) + key("ok","primary","&#10003;");

  if(pendingOpen!==null){
    return '<div class="sumfinish">'
      + '<div class="sflabel">Doppel-In: war ein Doppel dabei?</div>'
      + '<div class="row">'
      +   '<button class="btn primary" data-act="sumopen" data-v="1">Ja &middot; '+pendingOpen+' zählen</button>'
      +   '<button class="btn" data-act="sumopen" data-v="0">Nein</button>'
      + '</div>'
      + '<button class="btn ghost sm" data-act="sumcancel" style="width:auto;margin:10px auto 0">Abbrechen</button>'
      + '</div>';
  }
  if(pendingFinish!==null){
    return '<div class="sumfinish">'
      + '<div class="sflabel">Mit wie vielen Darts ausgemacht?</div>'
      + '<div class="row">'
      +   '<button class="btn primary" data-act="sumfin" data-d="1">1</button>'
      +   '<button class="btn primary" data-act="sumfin" data-d="2">2</button>'
      +   '<button class="btn primary" data-act="sumfin" data-d="3">3</button>'
      + '</div>'
      + '<button class="btn ghost sm" data-act="sumcancel" style="width:auto;margin:10px auto 0">Abbrechen</button>'
      + '</div>';
  }

  return '<div class="sumbox">'
    + '<div class="sumval'+(sumInput===""?" empty":"")+'">'+(sumInput===""?"Aufnahme":sumInput)+'</div>'
    + '<div class="sumrest">'+(warn ? '<span class="w">'+warn+'</span>'
        : (sumInput==="" ? 'Punkte der ganzen Aufnahme' : 'Rest danach: <b>'+rest+'</b>'))+'</div>'
    + '</div>'
    + '<div class="sumpad">'+pad+'</div>';
}

  var m = state.match;
  var w = m.players.find(function(p){return p.id===m.winnerId;});
  var multi = (m.bestOf||1)>1;
  var rows = m.players.slice().sort(function(a,b){return b.legsWon-a.legsWon;}).map(function(p){
    var d = [];
    if(p.checkout) d.push("Finish "+p.checkout);

    if(p.oneEighties) d.push(p.oneEighties+"&times;180");

      + '<div class="sublbl">&#8960; '+(p.darts?(p.scored/p.darts*3).toFixed(1):"0.0")

      + '<div class="wins">'+(multi?p.legsWon:(p.id===m.winnerId?1:0))+'<small>Legs</small></div></div>';
  }).join("");
  return h()
    + '<div class="win"><div class="trophy">&#127942;</div>'
    + '<h2>'+esc(w?w.name:"?")+(m.players.length<2?' hat es geschafft!':' gewinnt!')+'</h2>'
    + '<div class="sub">'+m.gameType+(multi?' &middot; Best of '+m.bestOf:'')
      + ' &middot; '+(m.doubleOut?'Doppel-Out':'beliebiger Ausgang')+'</div></div>'
    + (function(){
        // Allein gespielt gibt es keinen Gegner - der eigene Rekord ist die Messlatte.
        if(m.players.length!==1) return '';
        var alt = bestSolo(m.players[0].id, m.gameType);
        var jetzt = m.players[0].darts;
        if(!alt) return '<div class="okmsg" style="text-align:center">Erster Lauf &ndash; das ist ab jetzt dein Rekord: '
          + jetzt + ' Darts.</div>';
        if(jetzt < alt.darts) return '<div class="okmsg" style="text-align:center">Neuer Rekord! '
          + jetzt + ' statt ' + alt.darts + ' Darts.</div>';
        return '<div class="hint">'+jetzt+' Darts &middot; Rekord steht bei '+alt.darts+'.</div>';
      })()
    + '<div class="card" style="margin-bottom:14px">'+rows+'</div>'
    + '<div class="stack">'
    + (state.settings.keepHistory!==false
        ? '<button class="btn primary" data-act="winagain">Speichern &middot; nochmal</button>'
          + '<button class="btn" data-act="winhome">Speichern &middot; zur Rangliste</button>'
        : '<button class="btn primary" data-act="winagain">Nochmal</button>'
          + '<button class="btn" data-act="winhome">Zur Rangliste</button>'
          + '<div class="hint">Verlauf ist aus &ndash; dieses Spiel wird nicht mitgezählt.</div>')
    + '<button class="btn ghost" data-act="undo">&#8630; Doch nicht &ndash; letzten Dart zurück</button>'
    + '</div>';
}

// ---------------------------------------------------------------------------
// Direktvergleich (H2H): "wie steht es zwischen NUR Arne und mir"
// Gezaehlt werden ausschliesslich Matches, in denen genau diese zwei gespielt
// haben. Runden zu dritt werden getrennt ausgewiesen - sonst waere die Bilanz
// eine andere Zahl, als Lion im Kopf hat.
// ---------------------------------------------------------------------------
function h2h(idA, idB){
  var r = {a:idA, b:idB, n:0, winsA:0, winsB:0, legsA:0, legsB:0,
           dartsA:0, dartsB:0, scoredA:0, scoredB:0, bestA:0, bestB:0,
           coA:0, coB:0, t180A:0, t180B:0, games:[], multiN:0, multiA:0, multiB:0};
  for(var i=0;i<state.history.length;i++){
    var m = state.history[i];
    var pa = null, pb = null;
    for(var j=0;j<m.players.length;j++){
      if(m.players[j].id===idA) pa = m.players[j];
      if(m.players[j].id===idB) pb = m.players[j];
    }
    if(!pa || !pb) continue;
    if(m.players.length!==2){                       // Runde zu dritt: separat
      r.multiN++;
      if(m.winnerId===idA) r.multiA++;
      if(m.winnerId===idB) r.multiB++;
      continue;
    }
    r.n++;
    if(m.winnerId===idA) r.winsA++; else if(m.winnerId===idB) r.winsB++;
    r.legsA += pa.legsWon||0;  r.legsB += pb.legsWon||0;
    r.dartsA += pa.darts||0;   r.dartsB += pb.darts||0;
    r.scoredA += pa.scored||0; r.scoredB += pb.scored||0;
    r.t180A += pa.oneEighties||0; r.t180B += pb.oneEighties||0;
    if((pa.best||0) > r.bestA) r.bestA = pa.best||0;
    if((pb.best||0) > r.bestB) r.bestB = pb.best||0;
    if((pa.checkout||0) > r.coA) r.coA = pa.checkout||0;
    if((pb.checkout||0) > r.coB) r.coB = pb.checkout||0;
    r.games.push({ts:m.ended||m.ts, gameType:m.gameType, bestOf:m.bestOf,
                  winnerId:m.winnerId, legsA:pa.legsWon||0, legsB:pb.legsWon||0});
  }
  r.avgA = r.dartsA ? +((r.scoredA/r.dartsA*3).toFixed(1)) : 0;
  r.avgB = r.dartsB ? +((r.scoredB/r.dartsB*3).toFixed(1)) : 0;
  r.games.sort(function(x,y){return y.ts-x.ts;});
  r.streak = streakOf(r.games);
  return r;
}
// Aktuelle Serie: wer hat die letzten n Duelle in Folge geholt (games neueste zuerst).
function streakOf(games){
  if(!games.length) return null;
  var who = games[0].winnerId, n = 0;
  for(var i=0;i<games.length;i++){ if(games[i].winnerId!==who) break; n++; }
  return {id:who, n:n};
}

// Alle 1-gegen-1-Paarungen, die es wirklich gab - nach Spielzahl sortiert.
function allDuels(){
  var map = {};
  for(var i=0;i<state.history.length;i++){
    var m = state.history[i];
    if(m.players.length!==2) continue;
    var raw = m.players[0].id < m.players[1].id
      ? [m.players[0].id, m.players[1].id] : [m.players[1].id, m.players[0].id];
    var key = raw[0]+"|"+raw[1];
    if(!map[key]){
      var ord = orderPair(raw[0], raw[1]);
      map[key] = {a:ord[0], b:ord[1], n:0, winsA:0, winsB:0, last:0};
    }
    var d = map[key];
    d.n++;
    if(m.winnerId===d.a) d.winsA++; else if(m.winnerId===d.b) d.winsB++;
    if((m.ended||m.ts) > d.last) d.last = m.ended||m.ts;
  }
  var out = [];
  for(var k in map) out.push(map[k]);
  out.sort(function(x,y){ return (y.last-x.last) || (y.n-x.n); });
  return out;
}

// Ein geloeschter Spieler steht weiter in der Historie - dort steht auch sein
// Name. Ohne diesen Rueckgriff zeigt die App den rohen Schluessel ("arne").
function nameOf(id){
  var r = rosterOf(id); if(r) return r.name;
  for(var i=0;i<state.history.length;i++){
    var ps = state.history[i].players||[];
    for(var j=0;j<ps.length;j++) if(ps[j].id===id && ps[j].name) return ps[j].name;
  }
  return id;
}

function renderH2H(){
  // Solange Lion nicht selbst gewaehlt hat, zeigt der Screen immer das zuletzt
  // gespielte Duell - sonst klebt eine alte Vorbelegung fest, obwohl inzwischen
  // ganz andere Leute gegeneinander gespielt haben.
  // Nur vorbelegen, solange Lion nicht selbst gewaehlt hat - sonst springt ein
  // abgewaehlter Chip sofort zurueck und die Auswahl fuehlt sich kaputt an.
  if(h2hAuto || !h2hSel){
    var d0 = allDuels()[0];
    if(d0) h2hSel = [d0.a, d0.b];
    else {
      var ids = state.roster.slice(0,2).map(function(p){return p.id;});
      h2hSel = ids.length===2 ? orderPair(ids[0], ids[1]) : ids;
    }
    h2hAuto = true;
  }
  var chips = state.roster.map(function(p){
    var k = h2hSel.indexOf(p.id);
    var cls = k===0 ? " on a" : (k===1 ? " on b" : "");
    return '<button class="chip'+cls+'" data-act="h2hpick" data-id="'+p.id+'">'
      + esc(p.name)+(p.id===meId()?' &#9733;':'')+'</button>';
  }).join("");

  if(h2hSel.length<2){
    return h()
      + '<button class="btn ghost sm" data-act="nav" data-view="home" style="width:auto;margin-bottom:12px">&#8592; Zurück</button>'
      + '<label class="lbl">Zwei Spieler antippen</label>'
      + '<div class="chips">'+chips+'</div>'
      + '<div class="hint">Noch '+(2-h2hSel.length)+' auswählen.</div>';
  }

  var A = h2hSel[0], B = h2hSel[1], r = h2h(A,B);
  var na = esc(nameOf(A)), nb = esc(nameOf(B));
  var tot = r.winsA + r.winsB;
  var pct = tot ? Math.round(r.winsA/tot*100) : 50;

  var dots = r.games.slice(0,7).map(function(g){
    return '<span class="dot2 '+(g.winnerId===A?"a":(g.winnerId===B?"b":"n"))+'"></span>';
  }).join("");

  var rows = r.games.slice(0,12).map(function(g){
    var win = g.winnerId===A ? na : nb;
    var res = (g.bestOf>1)
      ? (g.winnerId===A ? g.legsA+':'+g.legsB : g.legsB+':'+g.legsA) : '&mdash;';
    return '<div class="grow">'
      + '<div class="gdate">'+fmtDate(g.ts)+'</div>'
      + '<div class="gmain"><b>'+win+'</b> gewinnt'
        + '<span class="gsub">'+g.gameType+(g.bestOf>1?' &middot; Bo'+g.bestOf+' &middot; '+res:'')+'</span></div>'
      + '<div class="gdot '+(g.winnerId===A?"a":"b")+'"></div>'
      + '</div>';
  }).join("");

  function line(label, va, vb){
    var lead = va===vb ? "" : (va>vb ? " la" : " lb");
    return '<div class="cmp'+lead+'"><span class="ca">'+va+'</span>'
      + '<span class="cl">'+label+'</span><span class="cb">'+vb+'</span></div>';
  }

  var streakTxt = "";
  if(r.streak && r.streak.n>=2) streakTxt = esc(nameOf(r.streak.id))+' hat die letzten '+r.streak.n+' geholt';
  else if(r.streak) streakTxt = esc(nameOf(r.streak.id))+' hat zuletzt gewonnen';

  return h()
    + '<button class="btn ghost sm" data-act="nav" data-view="home" style="width:auto;margin-bottom:12px">&#8592; Zurück</button>'
    + '<div class="chips">'+chips+'</div>'
    + '<div class="card h2hcard">'
    +   '<div class="h2hnames"><span>'+na+'</span><span class="vs">vs</span><span>'+nb+'</span></div>'
    +   '<div class="h2hbig"><span class="a">'+r.winsA+'</span><span class="sep">:</span><span class="b">'+r.winsB+'</span></div>'
    +   (tot ? '<div class="bar"><i style="width:'+pct+'%"></i></div>'
             + '<div class="h2hsub">'
               + (r.winsA===r.winsB ? 'ausgeglichen'
                  : (r.winsA>r.winsB ? pct+' % für '+na : (100-pct)+' % für '+nb))
               + ' &middot; '+tot+' Duelle</div>'
           : '<div class="h2hsub">Noch kein Duell zu zweit gespielt.</div>')
    +   (streakTxt ? '<div class="h2hstreak">&#128293; '+streakTxt+'</div>' : '')
    + '</div>'
    + (r.n ? '<div class="card" style="margin-top:12px">'
        + ((r.legsA+r.legsB > r.winsA+r.winsB) ? line("Legs", r.legsA, r.legsB) : "")
        + line("Schnitt je 3 Darts", r.avgA, r.avgB)
        + line("Beste Aufnahme", r.bestA, r.bestB)
        + line("Höchstes Finish", r.coA, r.coB)
        + (r.t180A||r.t180B ? line("180er", r.t180A, r.t180B) : "")
        + '</div>' : '')
    + (dots ? '<div class="dots">'+dots+'<span class="dotsl">letzte Duelle, links = neu</span></div>' : '')
    + (r.multiN ? '<div class="hint" style="text-align:left;margin-top:12px">'
        + 'Dazu '+r.multiN+' Runden mit mehr Leuten &middot; '+na+' '+r.multiA+' &middot; '+nb+' '+r.multiB
        + ' <span class="muted">(zählen nicht ins Duell)</span></div>' : '')
    + (rows ? '<label class="lbl" style="margin-top:16px">Die letzten Duelle</label>'
        + '<div class="card">'+rows+'</div>' : '')
    + '<button class="btn primary" data-act="duelstart" style="margin-top:14px">'
      + '&#127919;&nbsp; '+na+' gegen '+nb+' spielen</button>';
}

// Einstellungen + Datensicherung
// Die App fuehrt jetzt eine Historie - ein geleerter Browser-Cache wuerde sie
// ersatzlos vernichten. Darum Export/Import direkt hier drin.
// ---------------------------------------------------------------------------
function exportPayload(){ return {app:"darts", v:2, exported:Date.now(), state:state}; }

// Verlauf loeschen, ohne dass Lion von 10 Wins auf 1 zurueckfaellt: der
// abgeleitete Stand wird vorher in den Handeintrag eingefroren.
function clearHistory(){
  state.roster.forEach(function(p){ p.winsManual = totalWins(p.id); });
  state.history = []; save();
}
function resetAll(){
  state = defaultState(); h2hSel=null; h2hAuto=true; setupSel=null; save();
}

function exportBlob(){
  var data = JSON.stringify(exportPayload(), null, 1);
  var name = "darts-sicherung-" + new Date().toISOString().slice(0,10) + ".json";
  try{
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([data], {type:"application/json"}));
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 800);
    return true;
  }catch(e){ return false; }
}
// writeText liefert ein Promise. Frueher wurde sofort "true" gemeldet und die
// Ablehnung landete als unbehandelter Fehler - der Screen log, die Sicherung
// existierte nicht.
function exportClipboard(fertig){
  var data = JSON.stringify(exportPayload());
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(data).then(function(){ fertig(true); },
                                              function(){ fertig(false); });
      return;
    }
  }catch(e){}
  fertig(false);
}
// Import: ersetzt den kompletten Stand. Wird nur nach Rueckfrage aufgerufen.
function importText(txt){
  var neu;
  try{
    var obj = JSON.parse(txt);
    var st = obj && obj.state ? obj.state : obj;
    if(!st || !Array.isArray(st.roster) || !st.roster.length) return "In der Datei steht kein Team.";
    // Eintraege ohne Spielerliste bringen jede Auswertung zum Absturz - und der
    // kaputte Stand laege danach schon im Speicher, also auch nach dem Neustart.
    if(Array.isArray(st.history))
      st.history = st.history.filter(function(m){ return m && Array.isArray(m.players) && m.players.length; });
    if(Array.isArray(st.practice))
      st.practice = st.practice.filter(function(r){ return r && r.playerId && r.mode; });
    neu = upgradeShape(st);
  }catch(e){
    return "Die Sicherung ist beschädigt und wurde nicht eingespielt.";
  }
  state = neu;
  h2hSel = null; h2hAuto = true; setupSel = null; playerSel = null; soloWho = null;
  save();
  return null;
}

// ---------------------------------------------------------------------------
// Allein üben
// Trainings landen in state.practice, NICHT in state.history - sonst zaehlte
// jede Uebungsrunde als Sieg und die Rangliste waere Unsinn.
// ---------------------------------------------------------------------------
var TRAIN = {
  double: {
    name: "Doppel-Training",
    hint: "Jedes Doppel von D1 bis Bull, drei Darts pro Ziel.",
    max: 21,
    targets: (function(){
      var t=[]; for(var i=1;i<=20;i++) t.push({num:i, mult:2, label:"Doppel "+i, short:"D"+i});
      t.push({num:50, mult:1, label:"Bull", short:"Bull"}); return t;
    })(),
    unit: "Treffer"
  },
  around: {
    name: "Around the Clock",
    hint: "1 bis 20, dann Bull. Drei Darts pro Zahl, Doppel und Triple zählen auch.",
    max: 21,
    targets: (function(){
      var t=[]; for(var i=1;i<=20;i++) t.push({num:i, mult:1, label:"Die "+i, short:""+i});
      t.push({num:50, mult:1, label:"Bull", short:"Bull"}); return t;
    })(),
    unit: "Treffer"
  }
};

function startTraining(mode, playerId){
  var cfg = TRAIN[mode]; if(!cfg) return;
  state.train = {mode:mode, playerId:playerId, idx:0, tries:0, hits:0,
                 darts:0, results:[], done:false, ts:Date.now()};
  view = "train"; save();
}
function trainTarget(){
  var tr = state.train; if(!tr) return null;
  var cfg = TRAIN[tr.mode];
  return tr.idx < cfg.targets.length ? cfg.targets[tr.idx] : null;
}
// Ein Dart aufs aktuelle Ziel: getroffen ja/nein. Drei Fehlversuche = weiter.
function trainDart(hit){
  var tr = state.train; if(!tr || tr.done) return "noop";
  tr.darts++; tr.tries++;
  if(hit){
    tr.hits++;
    tr.results.push({target:tr.idx, hit:true, darts:tr.tries});
    tr.idx++; tr.tries=0;
  } else if(tr.tries>=3){
    tr.results.push({target:tr.idx, hit:false, darts:3});
    tr.idx++; tr.tries=0;
  }
  if(tr.idx >= TRAIN[tr.mode].targets.length){ tr.done = true; save(); return "done"; }
  save(); return hit ? "hit" : "miss";
}
function trainUndo(){
  var tr = state.train; if(!tr || !tr.results.length && !tr.tries) return;
  if(tr.tries>0){ tr.tries--; tr.darts--; tr.done=false; save(); return; }
  var last = tr.results.pop();
  tr.idx = last.target;
  tr.tries = Math.max(0, last.darts-1);
  tr.darts = Math.max(0, tr.darts-1);
  if(last.hit) tr.hits = Math.max(0, tr.hits-1);
  tr.done = false; save();
}
function finishTraining(){
  var tr = state.train; if(!tr) return null;
  var rec = null;
  if(tr.done && state.settings.keepHistory!==false){
    rec = {id:mid(), ts:tr.ts, ended:Date.now(), mode:tr.mode, playerId:tr.playerId,
           score:tr.hits, max:TRAIN[tr.mode].max, darts:tr.darts};
    state.practice.unshift(rec);
    capPractice();
  }
  state.train = null; save();
  return rec;
}
// Alte Uebungslaeufe wegwerfen, aber nie einen Rekord: der steht oft ganz
// hinten, weil er schon lange haelt.
function capPractice(){
  if(state.practice.length<=300) return;
  var keep = {};
  state.practice.forEach(function(r){
    var k = r.playerId+"|"+r.mode, b = keep[k];
    if(!b || r.score>b.score || (r.score===b.score && r.darts<b.darts)) keep[k] = r;
  });
  var behalten = state.practice.slice(0,300);
  var drin = {};
  behalten.forEach(function(r){ drin[r.id] = true; });
  for(var k2 in keep) if(!drin[keep[k2].id]) behalten.push(keep[k2]);
  state.practice = behalten;
}

// Bester Wert eines Spielers in einem Trainingsmodus.
function bestPractice(playerId, mode){
  var b = null;
  for(var i=0;i<state.practice.length;i++){
    var r = state.practice[i];
    if(r.playerId!==playerId || r.mode!==mode) continue;
    if(!b || r.score>b.score || (r.score===b.score && r.darts<b.darts)) b = r;
  }
  return b;
}
// Bestes Solo-X01: wenigste Darts fuer diesen Startwert.
function bestSolo(playerId, gameType){
  var b = null;
  for(var i=0;i<state.history.length;i++){
    var m = state.history[i];
    if(m.players.length!==1 || m.gameType!==gameType) continue;
    var p = m.players[0];
    if(p.id!==playerId || !p.darts) continue;
    if(!b || p.darts<b.darts) b = {darts:p.darts, ts:m.ended||m.ts, avg:p.avg};
  }
  return b;

function playerStats(id){
  var r = {id:id, games:0, wins:0, legsWon:0, legsLost:0, darts:0, scored:0,
           best:0, checkout:0, t180:0, tons:0, form:[],
           solo:0, soloDarts:0, soloScored:0, soloBest:0};
  for(var i=0;i<state.history.length;i++){
    var m = state.history[i];
    var p = null;
    for(var j=0;j<m.players.length;j++) if(m.players[j].id===id) p = m.players[j];
    if(!p) continue;

    // Allein gespielt zaehlt separat - sonst stehen im selben Screen
    // "1 Spiel" und ein Schnitt aus zwei Partien.
    if(m.players.length<2){
      r.solo++;
      r.soloDarts += p.darts||0; r.soloScored += p.scored||0;
      if((p.best||0) > r.soloBest) r.soloBest = p.best||0;
      continue;
    }

    r.darts += p.darts||0; r.scored += p.scored||0;
    if((p.best||0) > r.best) r.best = p.best||0;
    if((p.checkout||0) > r.checkout) r.checkout = p.checkout||0;
    r.t180 += p.oneEighties||0; r.tons += p.tons||0;
    r.games++;
    r.legsWon += p.legsWon||0;
    for(var k=0;k<m.players.length;k++) if(m.players[k].id!==id) r.legsLost += m.players[k].legsWon||0;
    if(m.winnerId===id) r.wins++;
    if(r.form.length<10) r.form.push(m.winnerId===id);
  }
  r.avg = r.darts ? +((r.scored/r.darts*3).toFixed(1)) : 0;
  r.quote = r.games ? Math.round(r.wins/r.games*100) : 0;
  return r;
}
