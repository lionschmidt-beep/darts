<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Darts">
<title>Darts</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AF%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0f1115; --card:#1a1d24; --card2:#20242d; --line:#2a2f3a;
    --text:#e9e7e0; --muted:#8b93a3; --green:#22c55e; --red:#e5484d;
    --gold:#f5c451; --accent:#22c55e; --accent2:#60a5fa; --shadow:0 6px 20px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;}
  body{min-height:100vh;}
  #app{max-width:520px; margin:0 auto; padding:0 14px calc(env(safe-area-inset-bottom) + 20px);}
  header{position:sticky; top:0; z-index:5; background:linear-gradient(180deg,var(--bg) 70%,transparent);
    padding:calc(env(safe-area-inset-top) + 12px) 0 10px; display:flex; align-items:center; gap:10px;}
  header .logo{font-size:22px;}
  header h1{font-size:18px; font-weight:700; margin:0; letter-spacing:.3px; flex:1;}
  header .ver{font-size:11px; color:var(--muted);}
  header .iconbtn{background:transparent; border:none; color:var(--muted); font-size:19px;
    padding:4px 2px; cursor:pointer; line-height:1;}
  .okmsg{font-size:13px; color:var(--accent); margin-top:10px; font-weight:600;}
  .infoline{font-size:12.5px; color:var(--muted); margin:10px 3px 0;}
  .infoline b{color:var(--text); font-weight:700;}
  .pick .nm .sublbl{font-size:11.5px; color:var(--muted); font-weight:500; margin-top:2px;}
  .btn{display:flex; align-items:center; justify-content:center; gap:8px;
    min-height:50px; padding:0 16px; border:none; border-radius:14px; cursor:pointer;
    font-size:16px; font-weight:600; color:var(--text); background:var(--card2);
    border:1px solid var(--line); width:100%; user-select:none;}
  .btn:active{transform:scale(.98);}
  .btn.primary{background:var(--accent); color:#08240f; border-color:transparent;}
  .btn.ghost{background:transparent;}
  .btn.danger{color:var(--red); border-color:#3a2a2d;}
  .btn.sm{min-height:40px; font-size:14px; padding:0 12px; border-radius:11px; width:auto;}
  .row{display:flex; gap:10px;}
  .stack{display:flex; flex-direction:column; gap:10px;}
  .muted{color:var(--muted);}
  .center{text-align:center;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px;}

  /* Rangliste */
  .rank{display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line);}
  .rank:last-child{border-bottom:none;}
  .rank .pos{width:26px; font-size:18px; font-weight:800; color:var(--muted); text-align:center;}
  .rank .pos.gold{color:var(--gold);}
  .rank .nm{flex:1; min-width:0; font-size:17px; font-weight:600;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .rank .nm .badge{font-size:11px; color:var(--muted); margin-left:6px; border:1px solid var(--line);
    padding:1px 6px; border-radius:8px;}
  .rank .wins{font-size:18px; font-weight:800;}
  .rank .wins small{font-size:12px; color:var(--muted); font-weight:600; margin-left:3px;}
  .rank.tap{cursor:pointer;} .rank.tap:active{background:var(--card2);}
  .rank .chev{color:var(--muted); font-size:16px; flex:none;}

  /* Wins-Stepper (Team verwalten) */
  .wctl{display:flex; align-items:center; flex:none; background:var(--card2);
    border:1px solid var(--line); border-radius:11px; overflow:hidden;}
  .wctl button{width:40px; min-height:42px; border:none; background:transparent; color:var(--text);
    font-size:22px; font-weight:800; line-height:1; cursor:pointer;}
  .wctl button:active{background:var(--line);}
  .wctl .wv{min-width:42px; text-align:center; font-size:18px; font-weight:800; cursor:pointer;
    padding:9px 4px; border-left:1px solid var(--line); border-right:1px solid var(--line);}

  /* Setup */
  .pick{display:flex; align-items:center; gap:12px; padding:13px; border:1px solid var(--line);
    border-radius:13px; background:var(--card2); margin-bottom:8px; cursor:pointer;}
  .pick.on{border-color:var(--accent); background:rgba(34,197,94,.10);}
  .pick .dot{width:22px; height:22px; border-radius:50%; border:2px solid var(--line); flex:none;}
  .pick.on .dot{border-color:var(--accent); background:var(--accent);}
  .pick .nm{flex:1; font-weight:600;}
  .seg{display:flex; gap:8px;}
  .seg .btn{flex:1;}
  .seg .btn.on{background:var(--accent); color:#08240f; border-color:transparent;}
  input.txt{width:100%; min-height:50px; background:var(--card2); border:1px solid var(--line);
    border-radius:13px; color:var(--text); font-size:16px; padding:0 14px; outline:none;}
  input.txt:focus{border-color:var(--accent);}
  label.lbl{font-size:13px; color:var(--muted); margin:2px 2px 6px; display:block;}

  /* Game scoreboard */
  .board{display:flex; gap:8px; margin-bottom:12px;}
  .pcard{flex:1; background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:10px 8px; text-align:center; position:relative;}
  .pcard.active{border-color:var(--accent); background:rgba(34,197,94,.08); box-shadow:var(--shadow);}
  .pcard .pn{font-size:13px; color:var(--muted); font-weight:700; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;}
  .pcard.active .pn{color:var(--accent);}
  .pcard .ps{font-size:34px; font-weight:800; line-height:1.05; margin:2px 0;}
  .pcard .pmeta{font-size:11px; color:var(--muted);}
  .pcard .arrow{position:absolute; top:-9px; left:50%; transform:translateX(-50%); font-size:12px;}
  .pcard .legbadge{position:absolute; top:6px; right:7px; min-width:19px; height:19px; line-height:19px;
    border-radius:7px; background:var(--card2); border:1px solid var(--line); color:var(--muted);
    font-size:11px; font-weight:800; padding:0 4px;}
  .pcard.active .legbadge{color:var(--accent); border-color:rgba(34,197,94,.45);}
  .legline{font-size:12px; color:var(--muted); text-align:center; margin:-2px 0 9px;}
  .legline b{color:var(--text);}
  .rank .nmtap{cursor:pointer;}
  .rank .nm .star{color:var(--gold); font-size:14px;}
  .rank .nm .sublbl{font-size:11.5px; color:var(--muted); font-weight:600; margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .turn{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px; margin-bottom:12px;}
  .turn .slots{display:flex; gap:8px; margin-bottom:8px;}
  .slot{flex:1; height:52px; border-radius:12px; border:1px dashed var(--line); display:flex;
    align-items:center; justify-content:center; font-size:18px; font-weight:800; color:var(--muted);
    background:var(--card2);}
  .slot.filled{border-style:solid; border-color:var(--accent); color:var(--text);}
  .turn .info{display:flex; justify-content:space-between; align-items:center; font-size:13px;}
  .turn .co{color:var(--gold); font-weight:700;}
  .turn .sum{color:var(--muted);} .turn .sum b{color:var(--text);}

  .mult{display:flex; gap:8px; margin-bottom:8px;}
  .mult .btn{flex:1; min-height:46px;}
  .mult .btn.on{background:var(--accent); color:#08240f; border-color:transparent;}

  .pad{display:grid; grid-template-columns:repeat(5,1fr); gap:7px;}
  .pad .btn{min-height:52px; font-size:18px; padding:0; border-radius:12px; background:var(--card2);}
  .pad .btn.bull{color:var(--red);} .pad .btn.miss{color:var(--muted);}
  .gctl{display:flex; gap:8px; margin-top:10px;}
  .gctl .btn{flex:1;}

  /* Sprach-Eingabe ("Bike"-Modus) */
  .voice{margin-top:12px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px;}
  .voice .vhead{display:flex; gap:8px; align-items:stretch;}
  .micbtn{flex:1; display:flex; align-items:center; justify-content:center; gap:9px; min-height:54px;
    border:1px solid var(--line); border-radius:13px; background:var(--card2); color:var(--text);
    font-size:16px; font-weight:700; cursor:pointer; user-select:none; padding:0 12px;}
  .micbtn:active{transform:scale(.98);}
  .micbtn.on{background:var(--red); border-color:transparent; color:#fff; animation:vpulse 1.5s ease-in-out infinite;}
  .micbtn:disabled{opacity:.5; cursor:default;}
  .ttsbtn{width:56px; min-height:54px; font-size:22px; border:1px solid var(--line); border-radius:13px;
    background:var(--card2); color:var(--text); cursor:pointer;}
  .ttsbtn.off{opacity:.42;}
  @keyframes vpulse{0%,100%{box-shadow:0 0 0 0 rgba(229,72,77,.55);} 50%{box-shadow:0 0 0 11px rgba(229,72,77,0);}}
  .voice .vstat{font-size:13px; margin-top:10px; min-height:18px; line-height:1.45;}
  .voice .vstat b{color:var(--text);}
  .voice .vhint{font-size:12px; color:var(--muted); margin-top:6px; line-height:1.4;}

  /* Win */
  .win{text-align:center; padding:30px 0 10px;}
  .win .trophy{font-size:64px;}
  .win h2{font-size:26px; margin:10px 0 4px;}
  .win .sub{color:var(--muted); margin-bottom:22px;}

  /* Direktvergleich */
  .cardhead{font-size:13px; color:var(--muted); font-weight:700; margin-bottom:4px;
    display:flex; justify-content:space-between; align-items:baseline;}
  .chips{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:12px;}
  .chip{border:1px solid var(--line); background:var(--card2); color:var(--muted);
    border-radius:11px; padding:9px 13px; font-size:14px; font-weight:700; cursor:pointer;}
  .chip.on.a{background:var(--accent); border-color:transparent; color:#08240f;}
  .chip.on.b{background:var(--accent2); border-color:transparent; color:#06213f;}
  .h2hcard{text-align:center; padding:16px 14px 14px;}
  .h2hnames{display:flex; justify-content:center; align-items:baseline; gap:10px;
    font-size:14px; font-weight:700; color:var(--muted);}
  .h2hnames .vs{font-size:11px; opacity:.7;}
  .h2hbig{display:flex; justify-content:center; align-items:baseline; gap:10px; margin:2px 0 10px;}
  .h2hbig .a{font-size:46px; font-weight:800; color:var(--accent); line-height:1;}
  .h2hbig .b{font-size:46px; font-weight:800; color:var(--accent2); line-height:1;}
  .h2hbig .sep{font-size:26px; color:var(--muted); font-weight:700;}
  .bar{height:7px; border-radius:5px; background:var(--accent2); overflow:hidden;}
  .bar i{display:block; height:100%; background:var(--accent);}
  .h2hsub{font-size:12px; color:var(--muted); margin-top:7px;}
  .h2hstreak{font-size:12.5px; color:var(--gold); margin-top:8px; font-weight:600;}
  .cmp{display:flex; align-items:center; padding:9px 2px; border-bottom:1px solid var(--line);}
  .cmp:last-child{border-bottom:none;}
  .cmp .ca,.cmp .cb{width:74px; font-size:16px; font-weight:800;}
  .cmp .cb{text-align:right;}
  .cmp .cl{flex:1; text-align:center; font-size:12px; color:var(--muted); font-weight:600;}
  .cmp.la .ca{color:var(--accent);} .cmp.lb .cb{color:var(--accent2);}
  .dots{display:flex; align-items:center; gap:6px; margin-top:12px; padding:0 3px;}
  .dot2{width:11px; height:11px; border-radius:50%; background:var(--line); flex:none;}
  .dot2.a{background:var(--accent);} .dot2.b{background:var(--accent2);}
  .dotsl{font-size:11px; color:var(--muted); margin-left:5px;}
  .grow{display:flex; align-items:center; gap:11px; padding:10px 2px; border-bottom:1px solid var(--line);}
  .grow:last-child{border-bottom:none;}
  .grow .gdate{font-size:11.5px; color:var(--muted); width:74px; flex:none; font-weight:600;}
  .grow .gmain{flex:1; font-size:14px; min-width:0;}
  .grow .gmain b{font-weight:700;}
  .grow .gsub{display:block; font-size:11px; color:var(--muted); margin-top:1px;}
  .grow .gdot{width:8px; height:8px; border-radius:50%; flex:none;}
  .grow .gdot.a{background:var(--accent);} .grow .gdot.b{background:var(--accent2);}
  .duel{display:flex; align-items:center; gap:8px; padding:11px 2px;
    border-bottom:1px solid var(--line); cursor:pointer;}
  .duel:last-child{border-bottom:none;} .duel:active{background:var(--card2);}
  .duel .dn{flex:1; min-width:0; font-size:15px; font-weight:600;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .duel .dnb{text-align:right;}
  .duel .ds{font-size:17px; font-weight:800; flex:none; letter-spacing:.5px;}
  .duel .ds i{font-style:normal; color:var(--muted); margin:0 3px; font-weight:600;}
  .duel.la .dna{color:var(--accent);} .duel.lb .dnb{color:var(--accent2);}

  .fab{margin-top:8px;}
  .hint{font-size:12px; color:var(--muted); text-align:center; margin-top:14px;}
  a{color:var(--accent);}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

// ---------------------------------------------------------------------------
// Speicher
// ---------------------------------------------------------------------------
var KEY    = "darts_v2";
var KEY_V1 = "darts_v1";
var VER    = "1.5";

function defaultSettings(){
  return { gameType:501, doubleOut:true, doubleIn:false, bestOf:1,
           tts:true, keepHistory:true, meId:"lion" };
}
function defaultState(){
  return {
    v:2,
    roster:[
      {id:"arne",   name:"Arne",   winsManual:3, guest:false},
      {id:"justus", name:"Justus", winsManual:2, guest:false},
      {id:"lion",   name:"Lion",   winsManual:1, guest:false}
    ],
    match:null,
    history:[],
    settings:defaultSettings()
  };
}
function mid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

// v1 -> v2: die von Hand gepflegten Wins ueberleben als Basis-Offset (winsManual).
// Sie werden NICHT ueberschrieben - gespielte Matches kommen oben drauf.
function migrate(old){
  var s = defaultState();
  if(old && old.roster && old.roster.length){
    s.roster = old.roster.map(function(p){
      return {id:p.id, name:p.name, winsManual:(p.wins||0), guest:!!p.guest};
    });
  }
  if(old && old.match && !old.match.finished){          // laufendes Spiel mitnehmen
    var m = old.match;
    m.id=mid(); m.ts=Date.now(); m.mode="x01";
    m.bestOf=1; m.legNo=1; m.startIdx=0; m.doubleIn=false; m.legs=[];
    m.players = m.players.map(function(p){
      return {id:p.id, name:p.name, score:p.score, darts:p.darts||0, legsWon:0,
              scored:0, best:0, tons:0, oneEighties:0, checkout:0,
              legDarts:p.darts||0, legStart:false};
    });
    s.match = m;
  }
  return s;
}
// Felder nachziehen, die eine aeltere v2-Fassung noch nicht kannte.
function upgradeShape(s){
  if(!s.history) s.history=[];
  if(!s.settings) s.settings=defaultSettings();
  var d=defaultSettings(); for(var k in d) if(!(k in s.settings)) s.settings[k]=d[k];
  s.roster.forEach(function(p){
    if(typeof p.winsManual!=="number") p.winsManual = (typeof p.wins==="number"?p.wins:0);
    delete p.wins;
  });
  if(s.match){
    var m=s.match;
    if(typeof m.legNo!=="number") m.legNo=1;
    if(typeof m.startIdx!=="number") m.startIdx=0;
    if(typeof m.bestOf!=="number") m.bestOf=1;
    if(!m.legs) m.legs=[];
    if(!m.id) m.id=mid();
    m.players.forEach(function(p){
      ["legsWon","scored","best","tons","oneEighties","checkout","legDarts"].forEach(function(f){
        if(typeof p[f]!=="number") p[f]=0; });
      if(typeof p.legStart!=="boolean") p.legStart=false;
    });
  }
  s.v=2;
  return s;
}
function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){ var s=JSON.parse(raw); if(s&&s.roster) return upgradeShape(s); }
  }catch(e){}
  try{
    var old = JSON.parse(localStorage.getItem(KEY_V1));
    if(old && old.roster) return migrate(old);
  }catch(e){}
  return defaultState();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

var state = load();
var view  = "home";      // home | roster | setup | game | leg | win | h2h | stats | settings
var curMult = 1;         // aktueller Multiplikator im Zahlenfeld
var setupSel = null;     // {selected:[ids], gameType, doubleOut, doubleIn, bestOf}
var h2hSel = null;       // [idA, idB] im Direktvergleich
var h2hAuto = true;      // true = von der App vorbelegt, wird beim naechsten Blick neu bestimmt
var settingsMsg = "";    // kurze Rueckmeldung im Einstellungs-Screen

// ---------------------------------------------------------------------------
// Darts-Regeln: Wurf-Werte, Checkout-Rechner
// ---------------------------------------------------------------------------
function dartValue(mult, num){
  if(num===25) return {value:25, isDouble:false, label:"25"};       // aeusserer Bull = Single
  if(num===50) return {value:50, isDouble:true,  label:"Bull"};     // Bull = Doppel-25
  var pre = mult===3 ? "T" : (mult===2 ? "D" : "");
  return {value:num*mult, isDouble:mult===2, label:pre+num};
}

// Alle moeglichen Einzelwuerfe (fuer den Checkout-Rechner), absteigend sortiert.
var DOUBLES = [];  for(var n=1;n<=20;n++) DOUBLES.push({value:n*2, label:"D"+n}); DOUBLES.push({value:50,label:"Bull"});
var ALLTHROWS = [];
for(var n=1;n<=20;n++) ALLTHROWS.push({value:n*3, label:"T"+n});
for(var n=1;n<=20;n++) ALLTHROWS.push({value:n*2, label:"D"+n});
for(var n=1;n<=20;n++) ALLTHROWS.push({value:n,   label:""+n});
ALLTHROWS.push({value:25,label:"25"}); ALLTHROWS.push({value:50,label:"Bull"});
ALLTHROWS.sort(function(a,b){return b.value-a.value;}); // "hoch zielen zuerst"

// Kuerzestes Finish fuer 'score' mit hoechstens 'dartsLeft' Darts.
// doubleOut=true -> der letzte Dart muss ein Doppel (oder Bull) sein.
function checkout(score, dartsLeft, doubleOut){
  if(score<=0 || score>170) return null;
  var finishers = doubleOut ? DOUBLES : ALLTHROWS;
  var i,j,rem,d;
  // 1 Dart
  for(i=0;i<finishers.length;i++) if(finishers[i].value===score) return [finishers[i].label];
  if(dartsLeft<2) return null;
  // 2 Darts
  for(i=0;i<ALLTHROWS.length;i++){
    rem = score-ALLTHROWS[i].value; if(rem<=0) continue;
    d = finishers.find(function(x){return x.value===rem;});
    if(d) return [ALLTHROWS[i].label, d.label];
  }
  if(dartsLeft<3) return null;
  // 3 Darts
  for(i=0;i<ALLTHROWS.length;i++){
    for(j=0;j<ALLTHROWS.length;j++){
      rem = score-ALLTHROWS[i].value-ALLTHROWS[j].value; if(rem<=0) continue;
      d = finishers.find(function(x){return x.value===rem;});
      if(d) return [ALLTHROWS[i].label, ALLTHROWS[j].label, d.label];
    }
  }
  return null;
}

// ---------------------------------------------------------------------------
// Spiel-Logik
// ---------------------------------------------------------------------------
function rosterOf(id){ return state.roster.find(function(p){return p.id===id;}); }

// "Das bin ich": in Duellen steht dieser Spieler immer links. Ohne den Marker
// entschiede die alphabetische Reihenfolge, und Lion staende mal links, mal
// rechts - bei einer Bilanz wie 3:8 muss man dann jedes Mal neu hinsehen.
function meId(){
  var id = state.settings && state.settings.meId;
  return (id && rosterOf(id)) ? id : null;
}
// Paar so drehen, dass "ich" vorne steht.
function orderPair(a, b){
  var me = meId();
  return (me && b===me && a!==me) ? [b, a] : [a, b];
}

// Wins = von Hand gepflegter Grundstand + jedes gewonnene Match aus der Historie.
function historyWins(id){
  var n=0; for(var i=0;i<state.history.length;i++) if(state.history[i].winnerId===id) n++;
  return n;
}
function totalWins(id){
  var r=rosterOf(id);
  return Math.max(0, (r?(r.winsManual||0):0) + historyWins(id));
}

function legsNeeded(m){ return Math.floor((m.bestOf||1)/2)+1; }

function freshPlayer(id, gt){
  var r = rosterOf(id);
  return {id:id, name:r?r.name:id, score:gt, darts:0, legsWon:0,
          scored:0, best:0, tons:0, oneEighties:0, checkout:0,
          legDarts:0, legStart:true};
}

// opts: {gameType, doubleOut, doubleIn, bestOf, mode}  - fehlendes kommt aus den Einstellungen.
function startMatch(playerIds, opts){
  opts = opts || {};
  var st = state.settings;
  var gt = opts.gameType || st.gameType;
  state.match = {
    id:mid(), ts:Date.now(), mode:opts.mode||"x01",
    gameType:gt,
    doubleOut: opts.doubleOut!==undefined ? !!opts.doubleOut : !!st.doubleOut,
    doubleIn:  opts.doubleIn !==undefined ? !!opts.doubleIn  : !!st.doubleIn,
    bestOf:    opts.bestOf   || st.bestOf || 1,
    players: playerIds.map(function(id){ return freshPlayer(id, gt); }),
    currentIdx:0, startIdx:0, legNo:1,
    currentTurn:[], turnStartScore:gt,
    legs:[], finished:false, winnerId:null, _undo:[]
  };
  curMult = 1; view = "game"; save();
}

function snapshot(){
  var m = state.match;
  m._undo.push(JSON.stringify({
    players:m.players, currentIdx:m.currentIdx, currentTurn:m.currentTurn,
    turnStartScore:m.turnStartScore, finished:m.finished, winnerId:m.winnerId,
    legNo:m.legNo, startIdx:m.startIdx, legs:m.legs
  }));
  if(m._undo.length>80) m._undo.shift();
}
function undo(){
  var m = state.match; if(!m || !m._undo.length) return;
  var s = JSON.parse(m._undo.pop());
  m.players=s.players; m.currentIdx=s.currentIdx; m.currentTurn=s.currentTurn;
  m.turnStartScore=s.turnStartScore; m.finished=s.finished; m.winnerId=s.winnerId;
  m.legNo=s.legNo; m.startIdx=s.startIdx; m.legs=s.legs;
  curMult = 1; view = "game"; save(); render();
}

// Aufnahme abschliessen: erst die Statistik buchen, dann weiterreichen.
// Nach einem Bust ist score wieder turnStartScore -> got=0, genau richtig.
function closeTurn(){
  var m = state.match, p = m.players[m.currentIdx];
  var got = m.turnStartScore - p.score;
  if(got>0){
    p.scored += got;
    if(got>p.best) p.best = got;
    if(got>=100) p.tons++;
    if(got===180) p.oneEighties++;
  }
}
function endTurn(){
  var m = state.match;
  closeTurn();
  m.currentTurn = [];
  m.currentIdx = (m.currentIdx+1) % m.players.length;
  m.turnStartScore = m.players[m.currentIdx].score;
  curMult = 1;
}

function bust(){
  var m = state.match;
  var p = m.players[m.currentIdx];
  p.score = m.turnStartScore;   // ganzer Aufnahme-Wurf zurueck
  endTurn();
}

// Leg gewonnen: Zwischenstand oder Matchende. Der Anwurf wechselt jedes Leg.
function winLeg(p){
  var m = state.match;
  p.legsWon++;
  m.legs.push({no:m.legNo, winnerId:p.id, darts:p.legDarts});
  if(p.legsWon >= legsNeeded(m)){
    m.finished = true; m.winnerId = p.id; view = "win";
    return;
  }
  m.legNo++;
  m.startIdx = (m.startIdx+1) % m.players.length;
  m.currentIdx = m.startIdx;
  m.players.forEach(function(q){ q.score=m.gameType; q.legDarts=0; q.legStart=true; });
  m.currentTurn = []; m.turnStartScore = m.gameType; curMult = 1;
  view = "leg";
}

// Ein Dart. mult in {1,2,3}, num in 1..20 oder 0/25/50.
// Rueckgabe: ok | bust | leg | win | nostart | noop
function applyDart(mult, num){
  var m = state.match; if(!m || m.finished) return "noop";
  var dv = dartValue(mult, num);
  snapshot();
  var p = m.players[m.currentIdx];
  m.currentTurn.push({label:dv.label, value:dv.value, isDouble:dv.isDouble});
  p.darts++; p.legDarts++;

  // Doppel-In: bis zum ersten Doppel zaehlt kein Wurf auf das Konto.
  if(m.doubleIn && p.legStart && !dv.isDouble){
    if(m.currentTurn.length>=3) endTurn();
    save(); render(); return "nostart";
  }
  if(m.doubleIn && p.legStart) p.legStart = false;

  var ns = p.score - dv.value;

  if(ns===0 && (!m.doubleOut || dv.isDouble)){          // Leg ausgemacht
    var finishFrom = m.turnStartScore;
    p.score = 0;
    closeTurn();
    if(finishFrom > (p.checkout||0)) p.checkout = finishFrom;
    winLeg(p);
    save(); render(); return m.finished ? "win" : "leg";
  }
  // Bust: unter 0, oder (Doppel-Out) genau 1, oder 0 ohne Doppel
  if(ns<0 || (m.doubleOut && ns===1) || (ns===0 && m.doubleOut && !dv.isDouble)){
    bust(); save(); render(); return "bust";
  }
  p.score = ns;
  curMult = 1;                                          // Multiplikator zurueck auf Single
  if(m.currentTurn.length>=3) endTurn();
  save(); render(); return "ok";
}

// Match abschliessen -> wandert in die Historie, aus der Rangliste und H2H entstehen.
function finishMatch(){
  var m = state.match; if(!m) return null;
  var rec = null;
  if(state.settings.keepHistory!==false && m.finished){
    rec = {
      id:m.id, ts:m.ts, ended:Date.now(), mode:m.mode, gameType:m.gameType,
      doubleOut:m.doubleOut, doubleIn:m.doubleIn, bestOf:m.bestOf, winnerId:m.winnerId,
      legs:m.legs.slice(),
      players:m.players.map(function(p){
        return {id:p.id, name:p.name, legsWon:p.legsWon, darts:p.darts, scored:p.scored,
                best:p.best, tons:p.tons, oneEighties:p.oneEighties, checkout:p.checkout,
                avg: p.darts ? +((p.scored/p.darts*3).toFixed(2)) : 0};
      })
    };
    state.history.unshift(rec);
    if(state.history.length>500) state.history.length = 500;
  }
  state.match = null; save();
  return rec;
}

// Wins von Hand aendern: der Handeintrag ist ein Offset auf die gespielten Siege.
function bumpWins(id, delta){
  var r = rosterOf(id); if(!r) return;
  if(totalWins(id)+delta < 0) return;
  r.winsManual = (r.winsManual||0) + delta; save();
}
function setWins(id, val){
  var r = rosterOf(id); if(!r) return;
  r.winsManual = Math.max(0, Math.round(val||0)) - historyWins(id); save();
}

function slug(name){
  return name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") || ("p"+Date.now());
}
function addPlayer(name, guest){
  name = (name||"").trim(); if(!name) return;
  var id = slug(name);
  while(state.roster.some(function(p){return p.id===id;})) id += "x";
  state.roster.push({id:id, name:name, winsManual:0, guest:!!guest});
  save();
}

// 3-Dart-Schnitt. Die laufende Aufnahme zaehlt live mit, sonst springt die Zahl erst
// beim Spielerwechsel - das sieht auf dem Board aus wie ein Fehler.
function avgOf(p){
  var m = state.match, sc = p.scored||0, d = p.darts||0;
  if(m && !m.finished && m.players[m.currentIdx]===p) sc += Math.max(0, m.turnStartScore - p.score);
  return d ? (sc/d*3).toFixed(1) : "0.0";
}
function fmtDate(ts){
  var d=new Date(ts), p2=function(n){return n<10?"0"+n:""+n;};
  return p2(d.getDate())+"."+p2(d.getMonth()+1)+"."+" "+p2(d.getHours())+":"+p2(d.getMinutes());
}

  var parts = [];
  if(multi) parts.push('Leg '+m.legNo+' &middot; erst bei <b>'+legsNeeded(m)+'</b> ist Schluss');
  if(m.players.length===2){
    var r = h2h(m.players[0].id, m.players[1].id);
    if(r.n) parts.push('Duell <b>'+r.winsA+':'+r.winsB+'</b> aus '+r.n);
  }
  return parts.length ? '<div class="legline">'+parts.join(' &nbsp;&middot;&nbsp; ')+'</div>' : '';
}

// ---------------------------------------------------------------------------
// Direktvergleich (H2H): "wie steht es zwischen NUR Arne und mir"
// Gezaehlt werden ausschliesslich Matches, in denen genau diese zwei gespielt
// haben. Runden zu dritt werden getrennt ausgewiesen - sonst waere die Bilanz
// eine andere Zahl, als Lion im Kopf hat.
// ---------------------------------------------------------------------------
function h2h(idA, idB){
  var r = {a:idA, b:idB, n:0, winsA:0, winsB:0, legsA:0, legsB:0,
           dartsA:0, dartsB:0, scoredA:0, scoredB:0, bestA:0, bestB:0,
           coA:0, coB:0, t180A:0, t180B:0, games:[], multiN:0, multiA:0, multiB:0};
  for(var i=0;i<state.history.length;i++){
    var m = state.history[i];
    var pa = null, pb = null;
    for(var j=0;j<m.players.length;j++){
      if(m.players[j].id===idA) pa = m.players[j];
      if(m.players[j].id===idB) pb = m.players[j];
    }
    if(!pa || !pb) continue;
    if(m.players.length!==2){                       // Runde zu dritt: separat
      r.multiN++;
      if(m.winnerId===idA) r.multiA++;
      if(m.winnerId===idB) r.multiB++;
      continue;
    }
    r.n++;
    if(m.winnerId===idA) r.winsA++; else if(m.winnerId===idB) r.winsB++;
    r.legsA += pa.legsWon||0;  r.legsB += pb.legsWon||0;
    r.dartsA += pa.darts||0;   r.dartsB += pb.darts||0;
    r.scoredA += pa.scored||0; r.scoredB += pb.scored||0;
    r.t180A += pa.oneEighties||0; r.t180B += pb.oneEighties||0;
    if((pa.best||0) > r.bestA) r.bestA = pa.best||0;
    if((pb.best||0) > r.bestB) r.bestB = pb.best||0;
    if((pa.checkout||0) > r.coA) r.coA = pa.checkout||0;
    if((pb.checkout||0) > r.coB) r.coB = pb.checkout||0;
    r.games.push({ts:m.ended||m.ts, gameType:m.gameType, bestOf:m.bestOf,
                  winnerId:m.winnerId, legsA:pa.legsWon||0, legsB:pb.legsWon||0});
  }
  r.avgA = r.dartsA ? +((r.scoredA/r.dartsA*3).toFixed(1)) : 0;
  r.avgB = r.dartsB ? +((r.scoredB/r.dartsB*3).toFixed(1)) : 0;
  r.games.sort(function(x,y){return y.ts-x.ts;});
  r.streak = streakOf(r.games);
  return r;
}
// Aktuelle Serie: wer hat die letzten n Duelle in Folge geholt (games neueste zuerst).
function streakOf(games){
  if(!games.length) return null;
  var who = games[0].winnerId, n = 0;
  for(var i=0;i<games.length;i++){ if(games[i].winnerId!==who) break; n++; }
  return {id:who, n:n};
}

// Alle 1-gegen-1-Paarungen, die es wirklich gab - nach Spielzahl sortiert.
function allDuels(){
  var map = {};
  for(var i=0;i<state.history.length;i++){
    var m = state.history[i];
    if(m.players.length!==2) continue;
    var raw = m.players[0].id < m.players[1].id
      ? [m.players[0].id, m.players[1].id] : [m.players[1].id, m.players[0].id];
    var key = raw[0]+"|"+raw[1];
    if(!map[key]){
      var ord = orderPair(raw[0], raw[1]);
      map[key] = {a:ord[0], b:ord[1], n:0, winsA:0, winsB:0, last:0};
    }
    var d = map[key];
    d.n++;
    if(m.winnerId===d.a) d.winsA++; else if(m.winnerId===d.b) d.winsB++;
    if((m.ended||m.ts) > d.last) d.last = m.ended||m.ts;
  }
  var out = [];
  for(var k in map) out.push(map[k]);
  out.sort(function(x,y){ return (y.last-x.last) || (y.n-x.n); });
  return out;
}

// ---------------------------------------------------------------------------
// Sprach-Eingabe ("Bike"-Modus): Wuerfe laut ansagen -> automatisch eintragen
// ---------------------------------------------------------------------------
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var recog = null;
var voiceOn = false;
var ttsOn = state.settings.tts !== false;
var speaking = false;
var voiceMsg = "";

// -- Sprach-Ausgabe (damit man bei weggelegtem Handy HOERT, was erkannt wurde)
function say(txt){
  if(!ttsOn || !("speechSynthesis" in window)) return;
  try{
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(txt);
    u.lang = "de-DE"; u.rate = 1.05;
    speaking = true;                                   // eigenes Echo nicht mitschreiben
    u.onend  = function(){ speaking = false; };
    u.onerror= function(){ speaking = false; };
    speechSynthesis.speak(u);
    setTimeout(function(){ speaking = false; }, Math.min(6000, 700 + txt.length*90));
  }catch(e){ speaking = false; }
}

// -- Wortlisten fuer den Parser (Artikel wie "ein/eine" bewusst RAUS -> keine Geister-1en)
var ZAHLWORT = {
  "null":0,"eins":1,"zwei":2,"zwo":2,"drei":3,"vier":4,
  "fuenf":5,"fünf":5,"funf":5,"sechs":6,"sieben":7,"acht":8,"neun":9,"zehn":10,
  "elf":11,"zwoelf":12,"zwölf":12,"zwolf":12,"dreizehn":13,"vierzehn":14,
  "fuenfzehn":15,"fünfzehn":15,"funfzehn":15,"sechzehn":16,"siebzehn":17,
  "achtzehn":18,"neunzehn":19,"zwanzig":20,
  "fuenfundzwanzig":25,"fünfundzwanzig":25,"funfundzwanzig":25,
  "fuenfzig":50,"fünfzig":50,"funfzig":50
};
function multWord(w){
  if(/^(doppel|doppelt|doppelte|doppelten|double|zweifach)$/.test(w)) return 2;
  if(/^(dreifach|dreifache|dreifachen|tripel|triple|threefold|dreier)$/.test(w)) return 3;
  return 0;
}
function normName(s){ return String(s).toLowerCase().replace(/ß/g,"ss").trim(); }
function currentNames(){
  var m=state.match, ns=[];
  if(m) m.players.forEach(function(p){ ns.push(normName(p.name)); });
  return ns;
}
function nameMatches(spoken, actual){
  var a=normName(spoken), b=normName(actual);
  if(!a||!b) return false;
  return a===b || b.indexOf(a)===0 || a.indexOf(b)===0;
}
function sayLabel(mult,num){
  if(num===50) return "Bull";
  if(num===25) return "25";
  if(num===0)  return "daneben";
  if(mult===3) return "Triple "+num;
  if(mult===2) return "Doppel "+num;
  return ""+num;
}

// -- Der Parser: gesprochener Satz -> Liste von Wuerfen (max 3).
//    Multiplikator steht IMMER VOR der Zahl ("Doppel 2"), wie man deutsch spricht;
//    genau das loest Lions Beispiel "14, doppelt 2, 3" korrekt zu S14/D2/S3 auf.
function parseSpeech(text, names){
  names = names || [];
  var out = {throws:[], name:null, cmd:null, raw:text};
  var s = (text||"").toLowerCase().replace(/[.,;:!?]/g," ").replace(/-/g," ").replace(/\s+/g," ").trim();
  if(!s) return out;
  if(/\b(zurueck|zurück|rueckgaengig|rückgängig|falsch|korrektur|revidieren)\b/.test(s)) out.cmd="undo";
  else if(/\b(weiter|naechster|nächster|fertig|beenden)\b/.test(s)) out.cmd="skip";
  else if(/\b(stopp|stop|aufhoeren|aufhören|hoer auf|hör auf|mikro aus)\b/.test(s)) out.cmd="stop";
  var words = s.split(" ");
  var toks = [];
  for(var i=0;i<words.length;i++){
    var w = words[i];
    if(names.indexOf(w)>=0){ if(!out.name) out.name=w; continue; }   // Namen nicht als Wurf werten
    var mv = multWord(w); if(mv){ toks.push({t:"m",v:mv}); continue; }
    if(/^(bull|bulls|bullseye|bulle|bullsauge)$/.test(w)){ toks.push({t:"v",v:50}); continue; }
    if(/^(daneben|vorbei|verfehlt|nix|nichts|miss|fehlwurf)$/.test(w)){ toks.push({t:"v",v:0}); continue; }
    if(ZAHLWORT.hasOwnProperty(w)){ toks.push({t:"v",v:ZAHLWORT[w]}); continue; }
    if(/^\d+$/.test(w)){ toks.push({t:"v",v:parseInt(w,10)}); continue; }
  }
  var pending=1, pset=false;
  for(var j=0;j<toks.length;j++){
    var tk=toks[j];
    if(tk.t==="m"){ pending=tk.v; pset=true; continue; }
    var num=tk.v, mult=1;
    if(num===0||num===25||num===50){ pset=false; }
    else if(num>=1 && num<=20){ if(pset){ mult=pending; pset=false; } }
    else { pset=false; continue; }                       // ungueltige Zahl (>20) -> verwerfen
    var dv = dartValue(mult, num);
    out.throws.push({mult:mult, num:num, label:dv.label, say:sayLabel(mult,num)});
    if(out.throws.length>=3) break;                      // eine Aufnahme = max 3 Darts
  }
  return out;
}

// -- Erkennung starten / stoppen (Auto-Neustart faengt iOS-Abbrueche + no-speech ab)
function ensureRecog(){
  if(recog || !SR) return;
  recog = new SR();
  recog.lang="de-DE"; recog.continuous=true; recog.interimResults=false; recog.maxAlternatives=4;
  recog.onresult = function(ev){
    if(speaking) return;                                 // eigene TTS-Stimme ignorieren
    var res = ev.results[ev.results.length-1];
    if(!res.isFinal) return;
    var names = currentNames();
    var best=null, bestTxt="";
    for(var i=0;i<res.length;i++){                        // beste Alternative nehmen, die parsebar ist
      var t=(res[i]&&res[i].transcript)||"";
      var p=parseSpeech(t, names);
      if(!best || p.throws.length>best.throws.length){ best=p; bestTxt=t; }
      if(best && best.throws.length>=1) break;
    }
    if(best) applySpokenResult(best, bestTxt);
  };
  recog.onerror = function(ev){
    if(ev.error==="not-allowed" || ev.error==="service-not-allowed"){
      voiceOn=false; voiceMsg="Mikrofon nicht erlaubt – im Browser freigeben."; render();
    }
    // no-speech / aborted / network: onend uebernimmt den Neustart
  };
  recog.onend = function(){
    if(voiceOn){
      try{ recog.start(); }
      catch(e){ setTimeout(function(){ if(voiceOn){ try{recog.start();}catch(e2){} } }, 350); }
    }
    updateVoiceStatus();
  };
}
function startVoice(){
  if(!SR){ voiceMsg="Sprache: dieser Browser kann es nicht (Chrome/Android nutzen)."; return; }
  if(voiceOn) return;
  ensureRecog();
  voiceOn=true; voiceMsg="";
  try{ recog.start(); }catch(e){}
  say("Sprachmodus an. Sag deine Würfe.");               // entsperrt zugleich iOS-Sprachausgabe
}
function stopVoice(){
  voiceOn=false;
  if(recog){ try{ recog.abort(); }catch(e){} }
  try{ if("speechSynthesis" in window) speechSynthesis.cancel(); }catch(e){}
}
function updateVoiceStatus(msg){
  if(typeof msg==="string") voiceMsg=msg;
  var el=document.getElementById("voiceStatus");
  if(!el) return;
  if(!SR){ el.innerHTML='<span class="muted">Von diesem Browser nicht unterstützt – bitte Chrome (Android).</span>'; return; }
  if(!voiceOn){ el.innerHTML='<span class="muted">Mikro aus.</span>'+(voiceMsg?' '+voiceMsg:''); return; }
  el.innerHTML='<span style="color:var(--green)">&#9679; hört zu …</span>'+(voiceMsg?' &nbsp;'+voiceMsg:'');
}

// -- Erkanntes umsetzen: Kommandos, Namens-Check, dann Wuerfe eintragen + Rueckmeldung
function applySpokenResult(p, rawTxt){
  var m=state.match; if(!m || m.finished) return;
  if(p.cmd && p.throws.length===0){
    if(p.cmd==="undo"){ undo(); updateVoiceStatus("&#8617;&#65039; letzter Wurf zurück"); say("Zurück"); return; }
    if(p.cmd==="skip"){
      if(view==="leg"){ view="game"; render(); updateVoiceStatus("&#8594; Leg "+m.legNo); say("Leg "+m.legNo); return; }
      snapshot(); endTurn(); save(); render(); updateVoiceStatus("&#8594; nächster Spieler"); say("Nächster"); return;
    }
    if(p.cmd==="stop"){ stopVoice(); render(); return; }
  }
  if(p.throws.length===0){
    updateVoiceStatus('nicht verstanden: „'+esc(rawTxt||"")+'“'); return;
  }
  var cur = m.players[m.currentIdx];
  if(p.name && !nameMatches(p.name, cur.name)){          // vor falschem Spieler schuetzen
    updateVoiceStatus('&#9888;&#65039; „'+esc(p.name)+'“ gesagt, aber <b>'+esc(cur.name)+'</b> ist dran – nichts eingetragen.');
    say(cur.name+" ist dran, nicht "+p.name);
    return;
  }
  var idxBefore=m.currentIdx, applied=[], event="ok";
  for(var k=0;k<p.throws.length;k++){
    if(!state.match || state.match.finished) break;
    if(state.match.currentIdx!==idxBefore) break;         // Aufnahme lief voll -> Rest verwerfen
    var th=p.throws[k];
    var r=applyDart(th.mult, th.num);                     // rendert selbst
    if(r==="noop") break;
    applied.push(th);
    if(r==="win"){ event="win"; break; }
    if(r==="leg"){ event="leg"; break; }
    if(r==="bust"){ event="bust"; break; }
    if(r==="nostart"){ event="nostart"; break; }
    if(state.match && state.match.currentIdx!==idxBefore){ event="full"; break; }
  }
  var labels = applied.map(function(a){return a.label;}).join(" ");
  var spoken = applied.map(function(a){return a.say;}).join(", ");
  if(event==="win"){ say("Spiel! "+cur.name+" gewinnt."); return; }
  if(event==="leg"){
    var lw = m.legs[m.legs.length-1];
    updateVoiceStatus('&#127919; Leg an <b>'+esc(cur.name)+'</b> ('+(lw?lw.darts:0)+' Darts) &middot; sag „weiter“');
    say("Leg für "+cur.name+". Sag weiter für das nächste Leg."); return;
  }
  if(event==="nostart"){
    updateVoiceStatus('&#9888;&#65039; Doppel-In: '+esc(cur.name)+' ist noch nicht drin &ndash; erst ein Doppel zählt.');
    say("Noch kein Doppel."); return;
  }
  if(event==="bust"){
    updateVoiceStatus('&#128165; '+esc(cur.name)+': '+esc(labels)+' – überworfen, zurück auf <b>'+cur.score+'</b>');
    say(spoken+". Überworfen. Zurück auf "+cur.score); return;
  }
  var extra = (applied.length<p.throws.length) ? ' (Aufnahme voll, Rest verworfen)' : '';
  updateVoiceStatus('&#127919; '+esc(cur.name)+': <b>'+esc(labels)+'</b> &middot; Rest <b>'+cur.score+'</b>'+extra);
  say(spoken+". Rest "+cur.score);
}

// ---------------------------------------------------------------------------
// Ein Klick-Handler fuer alles (Delegation -> ueberlebt jedes Re-Render)
// ---------------------------------------------------------------------------
document.getElementById("app").addEventListener("click", function(ev){
  var t = ev.target.closest("[data-act]"); if(!t) return;
  var act = t.getAttribute("data-act");

  if(act==="nav"){
    view=t.getAttribute("data-view");
    if(view==="setup") setupSel=null;
    if(view!=="settings") settingsMsg="";
    render(); return;
  }
  if(act==="resume"){ view="game"; render(); return; }
  if(act==="abort"){ if(confirm("Aktuelles Spiel verwerfen?")){ state.match=null; save(); render(); } return; }

  // Roster
  if(act==="add"){
    var inp=document.getElementById("newName");
    addPlayer(inp.value, t.getAttribute("data-guest")==="1"); render(); return;
  }
  if(act==="rename"){
    var id=t.getAttribute("data-id"); var p=state.roster.find(function(x){return x.id===id;});
    var nn=prompt("Neuer Name:", p?p.name:""); if(nn&&nn.trim()){ p.name=nn.trim(); save(); render(); } return;
  }
  if(act==="del"){
    var id2=t.getAttribute("data-id"); var p2=state.roster.find(function(x){return x.id===id2;});
    if(confirm("„"+(p2?p2.name:"")+"“ löschen?")){
      state.roster=state.roster.filter(function(x){return x.id!==id2;}); save(); render();
    } return;
  }
  if(act==="win"){ bumpWins(t.getAttribute("data-id"), parseInt(t.getAttribute("data-d"),10)); render(); return; }
  if(act==="setme"){
    var mid2=t.getAttribute("data-id");
    state.settings.meId = (state.settings.meId===mid2) ? null : mid2;
    h2hAuto = true; save(); render(); return;
  }
  if(act==="winset"){
    var wid=t.getAttribute("data-id"); var wp=state.roster.find(function(x){return x.id===wid;});
    var wv=prompt("Wins für "+(wp?wp.name:"")+":", wp?String(totalWins(wid)):"0");
    if(wv!==null){ var n=parseInt(wv,10); if(!isNaN(n)){ setWins(wid, n); render(); } }
    return;
  }
  if(act==="resetwins"){
    if(confirm("Alle Wins auf 0 setzen? Gespielte Partien bleiben in der Historie.")){
      state.roster.forEach(function(p){ p.winsManual = -historyWins(p.id); }); save(); render();
    } return;
  }

  // Setup
  if(act==="pick"){ var pid=t.getAttribute("data-id");
    if(setupSel.selected.has(pid)) setupSel.selected.delete(pid); else setupSel.selected.add(pid);
    render(); return; }
  if(act==="gt"){ setupSel.gameType=parseInt(t.getAttribute("data-g"),10); render(); return; }
  if(act==="do"){ setupSel.doubleOut = t.getAttribute("data-v")==="1"; render(); return; }
  if(act==="bo"){ setupSel.bestOf = parseInt(t.getAttribute("data-n"),10); render(); return; }
  if(act==="din"){ setupSel.doubleIn = !setupSel.doubleIn; render(); return; }
  if(act==="start"){
    var ids = state.roster.filter(function(p){return setupSel.selected.has(p.id);}).map(function(p){return p.id;});
    if(ids.length<1){ return; }
    startMatch(ids, {gameType:setupSel.gameType, doubleOut:setupSel.doubleOut,
                     doubleIn:setupSel.doubleIn, bestOf:setupSel.bestOf});
    render(); return;
  }
  if(act==="nextleg"){ view="game"; render(); return; }

  // Einstellungen
  if(act==="s_gt"){ state.settings.gameType=parseInt(t.getAttribute("data-v"),10); save(); render(); return; }
  if(act==="s_do"){ state.settings.doubleOut=t.getAttribute("data-v")==="1"; save(); render(); return; }
  if(act==="s_bo"){ state.settings.bestOf=parseInt(t.getAttribute("data-v"),10); save(); render(); return; }
  if(act==="s_di"){ state.settings.doubleIn=!state.settings.doubleIn; save(); render(); return; }
  if(act==="s_tts"){ state.settings.tts=!state.settings.tts; ttsOn=!!state.settings.tts; save(); render(); return; }
  if(act==="s_hist"){ state.settings.keepHistory=!(state.settings.keepHistory!==false); save(); render(); return; }
  if(act==="s_export"){
    settingsMsg = exportBlob() ? "Sicherung gespeichert." : "Download ging nicht – nimm die Zwischenablage.";
    render(); return;
  }
  if(act==="s_copy"){
    settingsMsg = exportClipboard() ? "In der Zwischenablage – irgendwo einfügen und sichern."
                                    : "Zwischenablage nicht erlaubt.";
    render(); return;
  }
  if(act==="s_import"){
    var fi=document.getElementById("impFile"); if(!fi) return;
    fi.onchange=function(){
      var f=fi.files&&fi.files[0]; if(!f) return;
      var rd=new FileReader();
      rd.onload=function(){
        if(!confirm("Sicherung einspielen? Der aktuelle Stand wird ersetzt.")) return;
        var err=importText(String(rd.result));
        settingsMsg = err ? err : "Sicherung eingespielt.";
        render();
      };
      rd.readAsText(f);
    };
    fi.click(); return;
  }
  if(act==="s_clearhist"){
    if(!state.history.length) return;
    if(confirm("Verlauf löschen? Die Wins bleiben als Zahl stehen, aber Duell-Bilanz und Statistik sind weg.")){
      // Wins einfrieren, sonst faellt Lion nach dem Loeschen von 10 auf 1 zurueck.
      clearHistory(); settingsMsg = "Verlauf gelöscht, Wins eingefroren."; render();
    }
    return;
  }
  if(act==="s_reset"){
    if(confirm("Wirklich ALLES zurücksetzen? Team, Wins und Verlauf sind dann weg.")){
      resetAll(); settingsMsg=""; view="home"; render();
    }
    return;
  }

  // Direktvergleich
  if(act==="h2hpick"){
    var hid=t.getAttribute("data-id"); var k=h2hSel.indexOf(hid);
    if(k>=0) h2hSel.splice(k,1);
    else { h2hSel.push(hid); if(h2hSel.length>2) h2hSel.shift(); }
    h2hAuto = false;                      // ab jetzt gilt Lions Wahl
    render(); return;
  }
  if(act==="h2hopen"){
    h2hSel=[t.getAttribute("data-a"), t.getAttribute("data-b")]; h2hAuto=false;
    view="h2h"; render(); return;
  }
  if(act==="duelstart"){
    if(h2hSel.length===2){ startMatch([h2hSel[0],h2hSel[1]], {}); render(); }
    return;
  }

  // Spiel
  if(act==="mult"){ curMult=parseInt(t.getAttribute("data-m"),10); render(); return; }
  if(act==="num"){ applyDart(curMult, parseInt(t.getAttribute("data-n"),10)); return; }
  if(act==="undo"){ undo(); return; }
  if(act==="skip"){ if(state.match&&!state.match.finished){ snapshot(); endTurn(); save(); render(); } return; }
  if(act==="quit"){ if(confirm("Spiel abbrechen? Kein Sieg wird gezählt.")){ state.match=null; view="home"; save(); render(); } return; }

  // Sprach-Eingabe
  if(act==="voice"){ if(voiceOn){ stopVoice(); } else { startVoice(); } render(); return; }
  if(act==="tts"){
    ttsOn=!ttsOn; state.settings.tts=ttsOn; save();
    if(!ttsOn){ try{ if("speechSynthesis" in window) speechSynthesis.cancel(); }catch(e){} }
    render(); return;
  }

  // Win
  if(act==="winagain"){
    var m0=state.match;
    var ids2=m0.players.map(function(p){return p.id;});
    var o={gameType:m0.gameType, doubleOut:m0.doubleOut, doubleIn:m0.doubleIn, bestOf:m0.bestOf, mode:m0.mode};
    finishMatch();
    startMatch(ids2, o); render(); return;
  }
  if(act==="winhome"){
    finishMatch(); view="home"; render(); return;
  }
});

window.DARTS = { checkout:checkout, dartValue:dartValue, startMatch:startMatch, applyDart:applyDart,
  parseSpeech:parseSpeech, applySpokenResult:applySpokenResult,
  bumpWins:bumpWins, setWins:setWins, getRoster:function(){return state.roster;},
  render:render, getMatch:function(){return state.match;},
  finishMatch:finishMatch, undo:undo, endTurn:endTurn, legsNeeded:legsNeeded,
  h2h:h2h, allDuels:allDuels, streakOf:streakOf, nameOf:nameOf, gameHead:gameHead,
  meId:meId, orderPair:orderPair, importText:importText,
  exportPayload:exportPayload, clearHistory:clearHistory, resetAll:resetAll,
  totalWins:totalWins, historyWins:historyWins, migrate:migrate, upgradeShape:upgradeShape,
  defaultState:defaultState, getState:function(){return state;},
  setState:function(s2){ state=s2; }, setView:function(v){ view=v; }, getView:function(){return view;},
  getHistory:function(){return state.history;}, getSettings:function(){return state.settings;},
  setScore:function(i,s){ state.match.players[i].score=s;
    state.match.turnStartScore=state.match.players[state.match.currentIdx].score; } };

render();
</script>
