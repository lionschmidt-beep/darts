<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Darts">
<title>Darts</title>
<link rel="manifest" href="./manifest.webmanifest">
<!-- iOS liest das Manifest NICHT und kann kein SVG als App-Icon: ohne dieses PNG
     landet beim "Zum Home-Bildschirm" ein graues Kaestchen auf dem Bildschirm. -->
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Darts">
<!-- Startbilder: ohne sie blitzt beim Oeffnen eine weisse Seite auf. -->
<link rel="apple-touch-startup-image" href="./splash-1179x2556.png"
      media="(device-width:393px) and (device-height:852px) and (-webkit-device-pixel-ratio:3)">
<link rel="apple-touch-startup-image" href="./splash-1170x2532.png"
      media="(device-width:390px) and (device-height:844px) and (-webkit-device-pixel-ratio:3)">
<link rel="apple-touch-startup-image" href="./splash-1284x2778.png"
      media="(device-width:428px) and (device-height:926px) and (-webkit-device-pixel-ratio:3)">
<link rel="apple-touch-startup-image" href="./splash-750x1334.png"
      media="(device-width:375px) and (device-height:667px) and (-webkit-device-pixel-ratio:2)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AF%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0f1115; --card:#1a1d24; --card2:#20242d; --line:#2a2f3a;
    --text:#e9e7e0; --muted:#8b93a3; --green:#22c55e; --red:#e5484d;
    --gold:#f5c451; --accent:#22c55e; --accent2:#60a5fa; --shadow:0 6px 20px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;}
  body{min-height:100vh;}
  #app{max-width:520px; margin:0 auto; padding:0 14px calc(env(safe-area-inset-bottom) + 20px);}
  header{position:sticky; top:0; z-index:5; background:linear-gradient(180deg,var(--bg) 70%,transparent);
    padding:calc(env(safe-area-inset-top) + 12px) 0 10px; display:flex; align-items:center; gap:10px;}
  header .logo{font-size:22px;}
  header h1{font-size:18px; font-weight:700; margin:0; letter-spacing:.3px; flex:1;}
  header .ver{font-size:11px; color:var(--muted);}
  header .iconbtn{background:transparent; border:none; color:var(--muted); font-size:21px;
    padding:10px 8px; margin:-10px -8px -10px 0; cursor:pointer; line-height:1;
    min-width:44px; min-height:44px;}
  .cardhead [data-act]{padding:13px 2px 13px 16px; margin:-13px -2px -13px 0; cursor:pointer;}
  .okmsg{font-size:13px; color:var(--accent); margin-top:10px; font-weight:600;}
  /* Allein üben */
  .tcard{display:flex; align-items:center; gap:12px; background:var(--card);
    border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:10px; cursor:pointer;}
  .tcard:active{background:var(--card2);}
  .tcard .tmain{flex:1; min-width:0;}
  .tcard .tt{font-size:16px; font-weight:700;}
  .tcard .ts{font-size:12px; color:var(--muted); margin-top:2px;}
  .tcard .tb{font-size:22px; font-weight:800; color:var(--gold); flex:none;}
  .tcard .tb small{font-size:11px; color:var(--muted); font-weight:600;}
  .tbig{text-align:center; padding:26px 14px 20px; margin-top:6px;}
  .tbig .tlabel{font-size:38px; font-weight:800; letter-spacing:-.5px;}
  .tdots{display:flex; justify-content:center; gap:9px; margin-top:14px;}
  .tdot{width:15px; height:15px; border-radius:50%; border:2px solid var(--line);}
  .tdot.used{background:var(--red); border-color:transparent;}
  .tgrid{display:flex; flex-wrap:wrap; gap:5px; margin-top:14px;}
  .tmark{font-size:11px; font-weight:700; padding:4px 6px; border-radius:7px;
    background:var(--card2); border:1px solid var(--line); color:var(--muted); min-width:30px; text-align:center;}
  .tmark.hit{background:var(--accent); color:#08240f; border-color:transparent;}
  .tmark.miss{color:var(--red); border-color:#3a2a2d;}
  .tmark.now{border-color:var(--accent); color:var(--text);}
  /* Spieler-Akte */
  .phead{display:flex; align-items:center; gap:12px; margin-bottom:12px; padding:0 3px;}
  .phead .pname{flex:1; font-size:23px; font-weight:800; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .phead .pname .star{color:var(--gold); font-size:19px;}
  .phead .pname .badge{font-size:11px; color:var(--muted); margin-left:7px;
    border:1px solid var(--line); padding:1px 6px; border-radius:8px; vertical-align:middle;}
  .phead .pwins{font-size:26px; font-weight:800; color:var(--gold); flex:none;}
  .phead .pwins small{font-size:11px; color:var(--muted); font-weight:600; margin-left:3px;}
  .srow{display:flex; align-items:baseline; padding:10px 2px; border-bottom:1px solid var(--line);}
  .srow:last-child{border-bottom:none;}
  .srow .sl{flex:1; font-size:14px; color:var(--muted); font-weight:600;}
  .srow .sv{font-size:17px; font-weight:800;}
  .srow .sv small{font-size:11.5px; color:var(--muted); font-weight:600;}
  .alarm{background:#3a2a2d; border:1px solid var(--red); border-radius:12px;
    padding:11px 13px; margin:calc(env(safe-area-inset-top) + 10px) 0 0;
    font-size:13px; color:#ffb4b6; line-height:1.45;}
  .alarm .alarmlink{color:var(--text); font-weight:700; text-decoration:underline; cursor:pointer;
    display:inline-block; padding:6px 0;}
  .warnzeile{font-size:12.5px; color:var(--gold); background:rgba(245,196,81,.09);
    border:1px solid rgba(245,196,81,.28); border-radius:11px; padding:9px 11px;
    margin:0 0 12px; line-height:1.4;}
  .infoline{font-size:12.5px; color:var(--muted); margin:10px 3px 0;}
  .infoline b{color:var(--text); font-weight:700;}
  .pick .nm .sublbl{font-size:11.5px; color:var(--muted); font-weight:500; margin-top:2px;}
  .btn{display:flex; align-items:center; justify-content:center; gap:8px;
    min-height:50px; padding:0 16px; border:none; border-radius:14px; cursor:pointer;
    font-size:16px; font-weight:600; color:var(--text); background:var(--card2);
    border:1px solid var(--line); width:100%; user-select:none;}
  .btn:active{transform:scale(.98);}
  .btn.primary{background:var(--accent); color:#08240f; border-color:transparent;}
  .btn.ghost{background:transparent;}
  .btn.danger{color:var(--red); border-color:#3a2a2d;}
  .btn.sm{min-height:44px; font-size:14px; padding:0 12px; border-radius:11px; width:auto;}
  .row{display:flex; gap:10px;}
  .stack{display:flex; flex-direction:column; gap:10px;}
  .muted{color:var(--muted);}
  .center{text-align:center;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px;}

  /* Rangliste */
  .rank{display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line);}
  .rank:last-child{border-bottom:none;}
  .rank .pos{width:26px; font-size:18px; font-weight:800; color:var(--muted); text-align:center;}
  .rank .pos.gold{color:var(--gold);}
  .rank .nm{flex:1; min-width:0; font-size:17px; font-weight:600;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .rank .nm .badge{font-size:11px; color:var(--muted); margin-left:6px; border:1px solid var(--line);
    padding:1px 6px; border-radius:8px;}
  .rank .wins{font-size:18px; font-weight:800;}
  .rank .wins small{font-size:12px; color:var(--muted); font-weight:600; margin-left:3px;}
  .rank.tap{cursor:pointer;} .rank.tap:active{background:var(--card2);}
  .rank .chev{color:var(--muted); font-size:16px; flex:none;}

  /* Wins-Stepper (Team verwalten) */
  .wctl{display:flex; align-items:center; flex:none; background:var(--card2);
    border:1px solid var(--line); border-radius:11px; overflow:hidden;}
  .wctl button{width:46px; min-height:46px; border:none; background:transparent; color:var(--text);
    font-size:22px; font-weight:800; line-height:1; cursor:pointer;}
  .wctl button:active{background:var(--line);}
  .wctl .wv{min-width:42px; text-align:center; font-size:18px; font-weight:800; cursor:pointer;
    padding:9px 4px; border-left:1px solid var(--line); border-right:1px solid var(--line);}

  /* Setup */
  .pick{display:flex; align-items:center; gap:12px; padding:13px; border:1px solid var(--line);
    border-radius:13px; background:var(--card2); margin-bottom:8px; cursor:pointer;}
  .pick.on{border-color:var(--accent); background:rgba(34,197,94,.10);}
  .pick .dot{width:22px; height:22px; border-radius:50%; border:2px solid var(--line); flex:none;}
  .pick.on .dot{border-color:var(--accent); background:var(--accent);}
  .pick .nm{flex:1; font-weight:600;}
  .seg{display:flex; gap:8px;}
  .seg .btn{flex:1;}
  .seg .btn.on{background:var(--accent); color:#08240f; border-color:transparent;}
  input.txt{width:100%; min-height:50px; background:var(--card2); border:1px solid var(--line);
    border-radius:13px; color:var(--text); font-size:16px; padding:0 14px; outline:none;}
  input.txt:focus{border-color:var(--accent);}
  label.lbl{font-size:13px; color:var(--muted); margin:2px 2px 6px; display:block;}

  /* Game scoreboard */
  .board{display:flex; gap:8px; margin-bottom:12px;}
  .pcard{flex:1 1 0; min-width:0; background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:10px 8px; text-align:center; position:relative;}
  .pcard.active{border-color:var(--accent); background:rgba(34,197,94,.08); box-shadow:var(--shadow);}
  .pcard .pn{font-size:13px; color:var(--muted); font-weight:700; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;}
  .pcard.active .pn{color:var(--accent);}
  .pcard .ps{font-size:34px; font-weight:800; line-height:1.05; margin:2px 0;
    overflow:hidden; text-overflow:ellipsis;}
  /* Kein nowrap: sonst frisst die Ellipsis als erstes die Legs-Zahl ganz rechts -
     gemessen in allen Konstellationen ab drei Spielern, also praktisch immer. */
  .pcard .pmeta{font-size:11px; color:var(--muted); line-height:1.35; overflow-wrap:anywhere;}
  .pcard .arrow{position:absolute; top:-9px; left:50%; transform:translateX(-50%); font-size:12px;}
  .pcard .pmeta .legz{color:var(--gold); font-weight:800;}
  .pcard .pmeta .legz::after{content:" L"; font-weight:600; color:var(--muted);}
  .legline{font-size:12px; color:var(--muted); text-align:center; margin:-2px 0 9px;
    overflow-wrap:anywhere;}
  .legline b{color:var(--text);}
  .rank .nmtap{cursor:pointer;}
  .rank .nm .star{color:var(--gold); font-size:14px;}
  .rank .nm .sublbl{font-size:11.5px; color:var(--muted); font-weight:600; margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .turn{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px; margin-bottom:12px;}
  .turn .slots{display:flex; gap:8px; margin-bottom:8px;}
  .slot{flex:1; height:52px; border-radius:12px; border:1px dashed var(--line); display:flex;
    align-items:center; justify-content:center; font-size:18px; font-weight:800; color:var(--muted);
    background:var(--card2);}
  .slot.filled{border-style:solid; border-color:var(--accent); color:var(--text);}
  .slot.dead{border-color:var(--line); color:var(--muted); text-decoration:line-through;}
  .warteok{background:rgba(245,196,81,.10); border:1px solid rgba(245,196,81,.35);
    border-radius:12px; padding:10px 12px; margin:-4px 0 10px; text-align:center;
    font-size:13px; color:var(--gold); line-height:1.45;}
  .warteok b{color:var(--text);}
  .warterow{display:flex; gap:8px; margin-top:10px;}
  .syncbox{background:var(--card2); border:1px solid var(--line); border-radius:14px; padding:14px;}
  .synccode{font-size:34px; font-weight:800; letter-spacing:6px; text-align:center;
            color:var(--gold); font-variant-numeric:tabular-nums;}
  .row2{display:flex; gap:8px; align-items:stretch;}
  /* .btn traegt width:100%. In einer Flex-Zeile wird das die flex-basis, und mit
     flex-shrink:0 nimmt der Knopf die GANZE Breite - gemessen: Knopf 362 px von
     362 px, das Feld blieb mit 30 px uebrig. Deshalb hier beide ausdruecklich. */
  .row2 .txt{flex:1 1 0; min-width:0; width:auto;}
  .row2 .btn{flex:0 0 auto; width:auto; white-space:nowrap; padding:0 18px;}
  .sublbl.bad{color:var(--red);}
  .syncpille{display:inline-block; font-size:12px; padding:3px 10px; border-radius:999px;
             background:rgba(34,197,94,.13); color:var(--green); border:1px solid rgba(34,197,94,.3);
             letter-spacing:1px; margin:2px 0 6px;}
  .syncpille.aus{background:rgba(229,72,77,.12); color:var(--red);
                 border-color:rgba(229,72,77,.35); letter-spacing:0;}
  .syncbox .ok{color:var(--green); font-weight:600;}
  .syncbox .bad{color:var(--red); font-weight:600;}
  .synchint{display:inline-flex; align-items:center; gap:5px; font-size:12px;
            color:var(--muted); margin-left:8px;}
  .warterow .btn{flex:1; min-width:0;}
  .warterow .btn.wok{background:var(--green); color:#08210f; border-color:transparent; font-weight:700;}
  .lastturn{font-size:12.5px; color:var(--muted); text-align:center; margin:-4px 0 10px;
    line-height:1.4; overflow-wrap:anywhere;}
  .lastturn b{color:var(--text); font-weight:700;}
  .lastturn.bust{color:var(--red);} .lastturn.bust b{color:var(--red);}
  .lastturn.win{color:var(--gold);} .lastturn.win b{color:var(--gold);}
  .lastturn.dead{color:var(--gold);}
  .turn .info{display:flex; justify-content:space-between; align-items:center; font-size:13px;}
  .turn .co{color:var(--gold); font-weight:700;}
  .turn .co.stell{color:var(--accent2);}
  .turn .sum{color:var(--muted);} .turn .sum b{color:var(--text);}

  .mult{display:flex; gap:8px; margin-bottom:8px;}
  .mult .btn{flex:1; min-height:46px;}
  .mult .btn.on{background:var(--accent); color:#08240f; border-color:transparent;}

  .modeseg{margin-bottom:9px;}
  .modeseg .btn{min-height:42px; font-size:14px;}
  .sumbox{background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:14px; text-align:center; margin-bottom:9px;}
  .sumval{font-size:42px; font-weight:800; line-height:1.05; letter-spacing:-1px;}
  .sumval.empty{font-size:17px; color:var(--muted); font-weight:600; padding:12px 0 11px;}
  .sumrest{font-size:12.5px; color:var(--muted); margin-top:5px;}
  .sumrest b{color:var(--text);} .sumrest .w{color:var(--gold); font-weight:600;}
  .sumpad{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .sumpad .btn{min-height:58px; font-size:22px; border-radius:13px;}
  .sumfinish{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px;}
  .sumfinish .sflabel{font-size:14px; font-weight:600; text-align:center; margin-bottom:11px;}
  .sumfinish .btn{min-height:58px; font-size:20px;}
  .pad{display:grid; grid-template-columns:repeat(5,1fr); gap:7px;}
  .pad .btn{min-height:52px; font-size:18px; padding:0; border-radius:12px; background:var(--card2);}
  .pad .btn.bull{color:var(--red);} .pad .btn.miss{color:var(--muted);}
  .gctl{display:flex; gap:10px; margin-top:10px; align-items:stretch;}
  .gctl .btn{flex:1; min-height:54px;}
  .gctl .skipbtn{flex:1; font-size:12.5px; line-height:1.25; color:var(--muted); padding:0 8px;}

  /* Sprach-Eingabe ("Bike"-Modus) */
  .voice{margin-top:12px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px;}
  .voice .vhead{display:flex; gap:8px; align-items:stretch;}
  .micbtn{flex:1; display:flex; align-items:center; justify-content:center; gap:9px; min-height:54px;
    border:1px solid var(--line); border-radius:13px; background:var(--card2); color:var(--text);
    font-size:16px; font-weight:700; cursor:pointer; user-select:none; padding:0 12px;}
  .micbtn:active{transform:scale(.98);}
  .micbtn.on{background:var(--red); border-color:transparent; color:#fff; animation:vpulse 1.5s ease-in-out infinite;}
  .micbtn:disabled{opacity:.5; cursor:default;}
  .ttsbtn{width:56px; min-height:54px; font-size:22px; border:1px solid var(--line); border-radius:13px;
    background:var(--card2); color:var(--text); cursor:pointer;}
  .ttsbtn.off{opacity:.42;}
  @keyframes vpulse{0%,100%{box-shadow:0 0 0 0 rgba(229,72,77,.55);} 50%{box-shadow:0 0 0 11px rgba(229,72,77,0);}}
  .voice .vstat{font-size:13px; margin-top:10px; min-height:18px; line-height:1.45;}
  .voice .vstat b{color:var(--text);}
  .voice .vhint{font-size:12px; color:var(--muted); margin-top:6px; line-height:1.4;}

  /* Win */
  .win{text-align:center; padding:30px 0 10px;}
  .win .trophy{font-size:64px;}
  .win h2{font-size:26px; margin:10px 0 4px;}
  .win .sub{color:var(--muted); margin-bottom:22px;}

  /* Direktvergleich */
  .cardhead{font-size:13px; color:var(--muted); font-weight:700; margin-bottom:4px;
    display:flex; justify-content:space-between; align-items:baseline;}
  .chips{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:12px;}
  .chip{border:1px solid var(--line); background:var(--card2); color:var(--muted);
    border-radius:11px; padding:9px 13px; font-size:14px; font-weight:700; cursor:pointer;}
  .chip.on.a{background:var(--accent); border-color:transparent; color:#08240f;}
  .chip.on.b{background:var(--accent2); border-color:transparent; color:#06213f;}
  .h2hcard{text-align:center; padding:16px 14px 14px;}
  .h2hnames{display:flex; justify-content:center; align-items:baseline; gap:10px;
    font-size:14px; font-weight:700; color:var(--muted);}
  .h2hnames .vs{font-size:11px; opacity:.7;}
  .h2hbig{display:flex; justify-content:center; align-items:baseline; gap:10px; margin:2px 0 10px;}
  .h2hbig .a{font-size:46px; font-weight:800; color:var(--accent); line-height:1;}
  .h2hbig .b{font-size:46px; font-weight:800; color:var(--accent2); line-height:1;}
  .h2hbig .sep{font-size:26px; color:var(--muted); font-weight:700;}
  .bar{height:7px; border-radius:5px; background:var(--accent2); overflow:hidden;}
  .bar i{display:block; height:100%; background:var(--accent);}
  .h2hsub{font-size:12px; color:var(--muted); margin-top:7px;}
  .h2hstreak{font-size:12.5px; color:var(--gold); margin-top:8px; font-weight:600;}
  .cmp{display:flex; align-items:center; padding:9px 2px; border-bottom:1px solid var(--line);}
  .cmp:last-child{border-bottom:none;}
  .cmp .ca,.cmp .cb{width:74px; font-size:16px; font-weight:800;}
  .cmp .cb{text-align:right;}
  .cmp .cl{flex:1; text-align:center; font-size:12px; color:var(--muted); font-weight:600;}
  .cmp.la .ca{color:var(--accent);} .cmp.lb .cb{color:var(--accent2);}
  .dots{display:flex; align-items:center; gap:6px; margin-top:12px; padding:0 3px;}
  .dot2{width:11px; height:11px; border-radius:50%; background:var(--line); flex:none;}
  .dot2.a{background:var(--accent);} .dot2.b{background:var(--accent2);}
  .dotsl{font-size:11px; color:var(--muted); margin-left:5px;}
  .grow{display:flex; align-items:center; gap:11px; padding:10px 2px; border-bottom:1px solid var(--line);}
  .grow:last-child{border-bottom:none;}
  .grow .gdate{font-size:11.5px; color:var(--muted); width:74px; flex:none; font-weight:600;}
  .grow .gmain{flex:1; font-size:14px; min-width:0;}
  .grow .gmain b{font-weight:700;}
  .grow .gsub{display:block; font-size:11px; color:var(--muted); margin-top:1px;}
  .grow .gdot{width:8px; height:8px; border-radius:50%; flex:none;}
  .grow .gdot.a{background:var(--accent);} .grow .gdot.b{background:var(--accent2);}
  .duel{display:flex; align-items:center; gap:8px; padding:11px 2px;
    border-bottom:1px solid var(--line); cursor:pointer;}
  .duel:last-child{border-bottom:none;} .duel:active{background:var(--card2);}
  .duel .dn{flex:1; min-width:0; font-size:15px; font-weight:600;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .duel .dnb{text-align:right;}

  .duel .ds i{font-style:normal; color:var(--muted); margin:0 3px; font-weight:600;}

  .duel .ds .va{color:var(--accent);} .duel .ds .vb{color:var(--accent2);}

<body>
<div id="app"></div>
<script>
"use strict";

// ---------------------------------------------------------------------------
// Speicher
// ---------------------------------------------------------------------------
var KEY    = "darts_v2";
var KEY_V1 = "darts_v1";
var VER    = "1.36";

function sumMode(){ return state.settings.inputMode === "sum"; }
function defaultSettings(){
  return { gameType:501, doubleOut:true, doubleIn:false, bestOf:1,
           tts:true, keepHistory:true, meId:"lion", inputMode:"single", platzSpiel:true,
           nurMitName:false };
}
function defaultState(){
  return {
    v:2,
    roster:[
      {id:"arne",   name:"Arne",   winsManual:3, guest:false},
      {id:"justus", name:"Justus", winsManual:2, guest:false},
      {id:"lion",   name:"Lion",   winsManual:1, guest:false}
    ],
    match:null,
    history:[],
    practice:[],
    train:null,
    settings:defaultSettings()
  };
}
function mid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

// v1 -> v2: die von Hand gepflegten Wins ueberleben als Basis-Offset (winsManual).
// Sie werden NICHT ueberschrieben - gespielte Matches kommen oben drauf.
function migrate(old){
  var s = defaultState();
  if(old && old.roster && old.roster.length){
    s.roster = old.roster.map(function(p){
      return {id:p.id, name:p.name, winsManual:(p.wins||0), guest:!!p.guest};
    });
  }
  if(old && old.match && !old.match.finished){          // laufendes Spiel mitnehmen
    var m = old.match;
    m.id=mid(); m.ts=Date.now(); m.mode="x01";
    m.bestOf=1; m.legNo=1; m.startIdx=0; m.doubleIn=false; m.legs=[];
    m._undo=[];                   // v1-Schnappschuesse kennen die Leg-Felder nicht
    m.players = m.players.map(function(p){
      return {id:p.id, name:p.name, score:p.score, darts:p.darts||0, legsWon:0,
              scored:0, best:0, tons:0, oneEighties:0, checkout:0,
              legDarts:p.darts||0, legStart:false};
    });
    s.match = m;
  }
  return s;
}
// Felder nachziehen, die eine aeltere v2-Fassung noch nicht kannte.
function upgradeShape(s){
  if(!Array.isArray(s.history)) s.history=[];
  s.history = s.history.filter(function(m){ return m && Array.isArray(m.players) && m.players.length; });
  if(!Array.isArray(s.practice)) s.practice=[];
  s.practice = s.practice.filter(function(r){ return r && r.playerId && r.mode; });
  // Fremde IDs koennten Anfuehrungszeichen enthalten und aus einem data-Attribut
  // ausbrechen. Durch slug() ist das ausgeschlossen.
  var vergeben = {};
  s.roster.forEach(function(p){
    var clean = slug(String(p.id||p.name||""));
    while(vergeben[clean]) clean += "x";     // sonst teilen sich zwei Zeilen einen Schluessel
    vergeben[clean] = true;
    if(clean!==p.id){
      var alt=p.id; p.id=clean;
      (s.history||[]).forEach(function(m2){
        (m2.players||[]).forEach(function(q){ if(q.id===alt) q.id=clean; });
        if(m2.winnerId===alt) m2.winnerId=clean;
      });
      (s.practice||[]).forEach(function(r){ if(r.playerId===alt) r.playerId=clean; });
      if(s.settings && s.settings.meId===alt) s.settings.meId=clean;
    }
  });
  if(!("train" in s)) s.train=null;
  if(!s.settings) s.settings=defaultSettings();
  var d=defaultSettings(); for(var k in d) if(!(k in s.settings)) s.settings[k]=d[k];
  s.roster.forEach(function(p){
    if(typeof p.winsManual!=="number") p.winsManual = (typeof p.wins==="number"?p.wins:0);
    delete p.wins;
  });
  if(s.match && (!Array.isArray(s.match.players) || !s.match.players.length)) s.match=null;
  if(s.match){
    var m=s.match;
    // Felder, ohne die der naechste Dart wirft. Fremde oder alte Sicherungen
    // bringen sie nicht immer mit.
    if(!Array.isArray(m._undo)) m._undo=[];
    if(!("lastTurn" in m)) m.lastTurn=null;
    if(!Array.isArray(m.currentTurn)) m.currentTurn=[];
    if(!Array.isArray(m.platz)) m.platz=[];
    if(typeof m.currentIdx!=="number" || !m.players[m.currentIdx]) m.currentIdx=0;
    if(typeof m.gameType!=="number") m.gameType=501;
    if(typeof m.turnStartScore!=="number") m.turnStartScore=m.players[m.currentIdx].score;
    if(typeof m.legNo!=="number") m.legNo=1;
    if(typeof m.startIdx!=="number") m.startIdx=0;
    if(typeof m.bestOf!=="number") m.bestOf=1;
    if(!m.legs) m.legs=[];
    if(!m.id) m.id=mid();
    m.players.forEach(function(p){
      ["legsWon","scored","best","tons","oneEighties","checkout","legDarts"].forEach(function(f){
        if(typeof p[f]!=="number") p[f]=0; });
      if(typeof p.legStart!=="boolean") p.legStart=false;
    });
  }
  s.v=2;
  return s;
}
// Laeuft eine Uebung, deren Modus diese Fassung ueberhaupt kennt? TRAIN wird
// weiter unten belegt, diese Funktion kann aber schon beim Laden gerufen werden.
function trainBekannt(){
  return !!(state && state.train && typeof TRAIN === "object" && TRAIN[state.train.mode]);
}
var speicherKaputt = false;   // localStorage lehnt ab (Safari-Privatmodus, Quota)
var standDefekt = false;      // gespeicherter Stand war nicht lesbar
function load(){
  var raw = null;
  try{ raw = localStorage.getItem(KEY); }catch(e){}
  if(raw){
    try{
      var s=JSON.parse(raw);
      if(s&&s.roster) return upgradeShape(s);
      throw new Error("kein Team");
    }catch(e){
      // Den Rohtext beiseitelegen, BEVOR der erste Klick ihn ueberschreibt -
      // sonst ist die einzige Kopie der Daten nach einem Fingertipp weg.
      standDefekt = true;
      try{ localStorage.setItem(KEY+"_defekt", raw); }catch(e2){}
    }
  }
  try{
    var old = JSON.parse(localStorage.getItem(KEY_V1));
    if(old && old.roster) return migrate(old);
  }catch(e){}
  return defaultState();
}
var LIVE_VIEWS = ["game","leg","platz","win","train"];
var fremdGeschrieben = false; // ein zweites Fenster hat denselben Stand veraendert

// ===================================================================== Zweites Handy
// Zwei Handys in derselben Runde: eins liegt am Tisch zum Tippen, eins vorne am
// Board zum Reinsprechen. Beide duerfen alles.
//
// Transport ist ntfy.sh - ein oeffentlicher Pub/Sub-Dienst: kein Konto, keine
// Bibliothek, keine Kosten. Gemessen: 117-349 ms zwischen zwei Geraeten.
// Der Raumcode IST der Schluessel; wer ihn kennt, ist im Spiel. Fuer Dartspunkte
// unter Freunden reicht das - es gehen Vornamen und Zahlen darueber, sonst nichts.
//
// Uebertragen wird der GANZE Match-Zustand, nicht einzelne Wuerfe. Damit heilt
// sich der Abgleich selbst: ein Handy, das kurz kein Netz hatte, ist beim
// naechsten Empfang wieder gleichauf, ohne dass jemand Ereignisse nachzaehlen muss.
var SYNC_HOST = "https://ntfy.sh/";
var syncRaum = null;          // Raumcode oder null
var syncES = null;            // die offene Verbindung
var syncUhr = 0;              // zaehlt hoch bei JEDER lokalen Aenderung
var syncGeraet = null;        // wer bin ich - entscheidet bei Gleichstand
var syncEmpfangend = false;   // waehrenddessen NICHT zurueckfunken (sonst Ping-Pong)
var syncStatus = "aus";       // aus | verbinde | offen | fehler
var syncFetch = null;         // im Test austauschbar
var syncQuelle = null;        // dito fuer die Empfangsseite
var syncZuletzt = null;       // was zuletzt rausging - damit render() nachfassen kann
var syncVerworfen = false;    // hat der letzte Empfang eigene, ungesendete Wuerfe geschluckt?
var syncVersucht = null;      // was zuletzt losgeschickt wurde (gegen doppeltes Senden)
var syncFremdeVersion = false; // das andere Handy laeuft auf einem anderen Stand

function syncCode(){
  // Ohne I/O/1/0: die werden auf einem Handybildschirm dauernd verwechselt.
  var abc = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", c = "";
  for(var i=0;i<6;i++) c += abc.charAt(Math.floor(Math.random()*abc.length));
  return c;
}
function syncGeraeteId(){
  if(!syncGeraet){
    try{ syncGeraet = localStorage.getItem("darts_geraet"); }catch(e){}
    if(!syncGeraet){
      syncGeraet = syncCode() + syncCode();
      try{ localStorage.setItem("darts_geraet", syncGeraet); }catch(e){}
    }
  }
  return syncGeraet;
}
function syncTopic(code){ return "darts-" + String(code).toLowerCase(); }

// Was ueber die Leitung geht. Bewusst nur das Spiel - nicht der ganze Speicher:
// Verlauf, Statistik und Einstellungen bleiben auf jedem Handy privat.
function syncPaket(){
  return { v:1, uhr:syncUhr, von:syncGeraeteId(),
           match: state.match ? JSON.parse(JSON.stringify(state.match)) : null };
}

function syncSenden(){
  if(!syncRaum || syncEmpfangend) return false;
  syncVerworfen = false;          // wer weiterspielt, hat die Meldung gesehen
  syncUhr++;
  var jetzt = JSON.stringify(state.match || null);
  syncVersucht = jetzt;
  var body = JSON.stringify(syncPaket());
  var f = syncFetch || (typeof fetch === "function" ? fetch : null);
  if(!f) return false;
  try{
    f(SYNC_HOST + syncTopic(syncRaum), { method:"POST", body:body })
      // 🔴 syncZuletzt erst HIER setzen, nicht vorher: sonst sieht ein
      // fehlgeschlagener Sendeversuch aus wie ein gelungener, und beim naechsten
      // Empfang merkt niemand, dass eigene Wuerfe nie rausgegangen sind.
      // Zwei Merker mit verschiedenen Aufgaben: syncVersucht ist SOFORT gesetzt und
      // verhindert, dass render() dieselbe Aenderung ein zweites Mal losschickt.
      // syncZuletzt wird erst bei Erfolg gesetzt - nur so laesst sich erkennen,
      // dass eigene Wuerfe nie beim anderen Handy angekommen sind.
      .then(function(){ syncZuletzt = jetzt; },
            function(){ syncStatus = "fehler"; syncVersucht = null; });
  }catch(e){ syncStatus = "fehler"; return false; }
  return true;
}

// Kern der Sache, und die einzige Stelle, an der etwas schiefgehen kann.
function syncUebernehmen(paket){
  if(!paket || typeof paket !== "object") return "ungueltig";
  // Zwei Handys koennen verschiedene App-Staende haben - die PWA aktualisiert
  // nicht von selbst. Ein fremdes Paketformat wurde bisher wortlos verworfen;
  // auf dem Schirm sah das aus wie "der Sync ist kaputt".
  if(paket.v !== 1){ syncFremdeVersion = true; render(); return "version"; }
  if(paket.von === syncGeraeteId()) return "eigenes";       // das eigene Echo
  // Aelteres darf Neueres NIE ueberschreiben. Bei Gleichstand entscheidet die
  // Geraete-Kennung - Hauptsache beide Seiten entscheiden gleich.
  // Wer beitritt, hat noch kein Spiel und funkt einen LEEREN Stand. Ohne diese
  // Zeile loescht das die laufende Runde auf dem anderen Handy - gemessen: nach
  // dem Beitreten stand auf BEIDEN Geraeten match:null, das Spiel war weg.
  // Ein Spiel beendet man auf dem eigenen Handy, nicht ueber die Leitung.
  if(!paket.match && state.match && !state.match.finished) return "leer";
  if(paket.uhr < syncUhr) return "aelter";
  if(paket.uhr === syncUhr && paket.von < syncGeraeteId()) return "gleichstand";
  // Gleiche Uhr heisst: beide haben zur selben Zeit etwas eingetragen. Wer hier
  // ankommt, hat den Vergleich verloren - sein Wurf ging zwar raus, wird aber
  // gleich ueberschrieben. Gemessen bei gleichzeitigem Werfen an zwei Geraeten:
  // der Stand konvergiert sauber, aber ein Wurf verschwand ohne ein Wort.
  if(paket.uhr === syncUhr) syncVerworfen = true;
  // Hatte dieses Handy Wuerfe, die nie rausgingen? Dann sind sie jetzt weg -
  // gemessen bei einem Netzabbruch: der offline geworfene Dart war spurlos
  // verschwunden, und nichts hat es gesagt. Der fremde Stand gilt trotzdem
  // (er ist neuer), aber schweigend darf das nicht passieren.
  if(syncZuletzt !== null && JSON.stringify(state.match || null) !== syncZuletzt)
    syncVerworfen = true;
  syncEmpfangend = true;
  try{
    syncUhr = paket.uhr;
    state.match = paket.match;
    // Beide Merker auf den empfangenen Stand: sonst sieht syncNachfassen() beim
    // naechsten render() einen "ungesendeten" Unterschied und funkt genau das
    // zurueck, was gerade hereinkam - mit erhoehter Uhr. Das ist dieselbe
    // Ping-Pong-Schleife wie beim Echo, nur eine Ebene tiefer.
    syncVersucht = syncZuletzt = JSON.stringify(state.match || null);
    if(state.match && !state.match.finished && view !== "game") view = "game";
    save(); render();
  } finally { syncEmpfangend = false; }
  return "uebernommen";
}

// Der Raum ueberlebt das Wegwischen der App. Gemessen: nach einem Reload stand
// raum:null, waehrend der Spielstand ueberlebte - auf dem Handy reicht dafuer ein
// gesperrter Bildschirm. Mit Zeitstempel, damit man am naechsten Tag nicht still
// im Raum von gestern haengt.
var RAUM_HAELT = 12 * 3600 * 1000;

function raumMerken(code){
  try{
    if(code) localStorage.setItem("darts_raum", JSON.stringify({ code:code, ts:Date.now() }));
    else localStorage.removeItem("darts_raum");
  }catch(e){}
}
function raumHolen(){
  try{
    var r = JSON.parse(localStorage.getItem("darts_raum") || "null");
    if(!r || !r.code || !r.ts) return null;
    if(Date.now() - r.ts > RAUM_HAELT){ raumMerken(null); return null; }
    return r.code;
  }catch(e){ return null; }
}

function syncOeffnen(code){
  syncSchliessen();
  raumMerken(code);
  syncRaum = code;
  syncStatus = "verbinde";
  var Q = syncQuelle || (typeof EventSource === "function" ? EventSource : null);
  if(!Q){ syncStatus = "fehler"; return false; }
  try{
    // since=15m: ntfy haelt die letzten Nachrichten vor. Damit sieht ein Handy,
    // das beitritt, SOFORT den laufenden Stand - ohne dass der andere erst etwas
    // tun muss und ohne eigenes Frage-Antwort-Protokoll.
    syncES = new Q(SYNC_HOST + syncTopic(code) + "/sse?since=15m");
    syncES.onopen = function(){ syncStatus = "offen"; render(); };
    syncES.onerror = function(){ syncStatus = "fehler"; render(); };
    syncES.onmessage = function(e){
      var d; try{ d = JSON.parse(e.data); }catch(x){ return; }
      var inhalt = d && typeof d.message === "string" ? d.message : null;
      if(!inhalt) return;                       // Beitritts-Meldungen von ntfy
      var paket; try{ paket = JSON.parse(inhalt); }catch(x){ return; }
      syncUebernehmen(paket);
    };
  }catch(e){ syncStatus = "fehler"; return false; }
  return true;
}
// Der Haken in save() ist der schnelle Weg. Er haengt aber daran, dass jeder
// Aufrufer save() auch wirklich ruft - gemessen: endTurn() allein tat es nicht,
// und der Stand lief zwischen zwei Handys auseinander, ohne dass etwas meldete.
// Deshalb faehrt render() hinterher und reicht nach, was liegen geblieben ist.
function syncNachfassen(){
  if(!syncRaum || syncEmpfangend) return false;
  // Solange dieses Handy selbst nichts hat, draengt es auch nichts auf.
  if(!state.match && syncVersucht === null) return false;
  if(JSON.stringify(state.match || null) === syncVersucht) return false;
  return syncSenden();
}

function syncSchliessen(){
  raumMerken(null);          // wer trennt, will getrennt bleiben
  if(syncES){ try{ syncES.close(); }catch(e){} }
  syncES = null; syncRaum = null; syncStatus = "aus"; syncZuletzt = null;
  syncVerworfen = false; syncVersucht = null; syncFremdeVersion = false;
}
function syncAn(){ return !!syncRaum; }

// Der Zustand der Leitung wird GEMESSEN, nicht mitgeschrieben. Gemessen am
// 29.08.: nach einem Netzabbruch blieb der Merker auf "fehler" stehen, waehrend
// der Empfang laengst wieder lief - EventSource verbindet selbst neu, aber
// onopen kam nicht noch einmal. Ein Merker veraltet, readyState nie.
function syncLage(){
  if(!syncRaum) return "aus";
  if(!syncES) return "fehler";
  // navigator.onLine === false BEWEIST offline; true beweist nichts (die Umkehr
  // gilt nicht, siehe reference_netzfehler_erkennen_supabase_safari). Gemessen:
  // readyState blieb bei 1, waehrend das Geraet offline war - die Anzeige sagte
  // "verbunden", waehrend nichts mehr ankam. Nur die sichere Richtung nutzen.
  if(typeof navigator !== "undefined" && navigator.onLine === false) return "fehler";
  if(typeof syncES.readyState !== "number") return syncStatus;   // fremde Attrappe
  return syncES.readyState === 1 ? "offen"
       : syncES.readyState === 0 ? "verbinde" : "fehler";
}

function save(){
  try{
    if(typeof view!=="undefined") state._view = LIVE_VIEWS.indexOf(view)>=0 ? view : "home";
    localStorage.setItem(KEY, JSON.stringify(state));
    speicherKaputt = false;
    syncSenden();          // eine lokale Aenderung geht ans zweite Handy
    return true;
  }catch(e){
    // Nicht schlucken: sonst spielt man einen Abend durch und alles ist weg,
    // waehrend auf dem Schirm "Alles bleibt auf diesem Handy gespeichert" steht.
    speicherKaputt = true;
    return false;
  }
}
// Welcher Bildschirm gilt nach einem Neustart? Nur einer, zu dem es auch einen
// Zustand gibt - sonst landet man auf einem Screen ohne Daten.
function restoreView(){
  var v = state._view;
  if(v==="train") return trainBekannt() ? "train" : "home";
  if(v==="game" || v==="leg" || v==="platz")
    return (state.match && !state.match.finished) ? v : "home";
  if(v==="win")  return (state.match && state.match.finished) ? "win" : "home";
  return "home";
}

var state = load();
// Einmal probeweise schreiben: sonst behauptet die Startseite "alles bleibt
// gespeichert", bevor ueberhaupt jemand geprueft hat, ob das Geraet das kann.
try{ localStorage.setItem(KEY+"_probe","1"); localStorage.removeItem(KEY+"_probe"); }
catch(e){ speicherKaputt = true; }
var view  = "home";          // home | roster | setup | game | leg | win | h2h | player | solo | train | settings
                             // Der gemerkte Bildschirm wird ganz unten gesetzt -
                             // dort sind TRAIN und die Render-Funktionen belegt.
var curMult = 1;         // aktueller Multiplikator im Zahlenfeld
var setupSel = null;     // {selected:[ids], gameType, doubleOut, doubleIn, bestOf}
var h2hSel = null;       // [idA, idB] im Direktvergleich
var h2hAuto = true;      // true = von der App vorbelegt, wird beim naechsten Blick neu bestimmt
var settingsMsg = "";    // kurze Rueckmeldung im Einstellungs-Screen
var teamMsg = "";        // kurze Rueckmeldung im Team-Screen
var soloWho = null;      // wer gerade allein uebt
var playerSel = null;    // offene Spieler-Akte
var sumInput = "";       // getippte Aufnahme-Summe
var pendingFinish = null; // Summe, die ausmacht - wartet auf die Dart-Zahl
var pendingOpen = null;   // Summe bei Doppel-In - wartet auf "war ein Doppel dabei?"
var sumMsg = "";          // Hinweis am Zehnerblock (abgewiesene Ziffer)
var pendingBust = null;   // ueberworfene Summe - wartet auf die Dart-Zahl

// ---------------------------------------------------------------------------
// Darts-Regeln: Wurf-Werte, Checkout-Rechner
// ---------------------------------------------------------------------------
function dartValue(mult, num){
  // Fehlwurf: der gedrueckte Multiplikator darf daraus kein "D0" machen - sonst
  // eroeffnet ein Danebenwurf ein Doppel-In-Leg.
  if(num===0)  return {value:0,  isDouble:false, label:"&#10007;"};   // "20 5 –" las sich wie eine Rechnung
  if(num===25) return {value:25, isDouble:false, label:"25"};       // aeusserer Bull = Single
  if(num===50) return {value:50, isDouble:true,  label:"Bull"};     // Bull = Doppel-25
  var pre = mult===3 ? "T" : (mult===2 ? "D" : "");
  return {value:num*mult, isDouble:mult===2, label:pre+num};
}

// Alle moeglichen Einzelwuerfe fuer den Checkout-Rechner.
var DOUBLES = [];  for(var n=1;n<=20;n++) DOUBLES.push({value:n*2, label:"D"+n}); DOUBLES.push({value:50,label:"Bull"});
var ALLTHROWS = [];
for(var n=1;n<=20;n++) ALLTHROWS.push({value:n*3, label:"T"+n});
for(var n=1;n<=20;n++) ALLTHROWS.push({value:n*2, label:"D"+n});
for(var n=1;n<=20;n++) ALLTHROWS.push({value:n,   label:""+n});
ALLTHROWS.push({value:25,label:"25"}); ALLTHROWS.push({value:50,label:"Bull"});

// Auf welchem Doppel macht man am liebsten aus? Entscheidend ist, wie lange die
// Halbierungskette haelt, wenn man danebenwirft:
//   D16: 32 -> 16 -> 8 -> 4 -> 2   (fuenf Stufen, alle gerade)
//   D20: 40 -> 20 -> 10 -> 5       (nach drei Stufen ungerade, dann braucht man
//                                   wieder einen Stellwurf)
// Deshalb steht D16 vorn - das ist die gaengige Konvention, nicht D20.
// D1, D3, D5 sind die schlechtesten Felder des Boards und stehen hinten.
// Bis 1.16 wurde DOUBLES von D1 aufsteigend durchsucht und der erste Treffer
// genommen - der Rechner schlug damit systematisch das schlechteste vor.
var DOPPEL_VORLIEBE = [32,40,16,8,24,20,36,28,12,4,50,38,34,30,26,22,18,14,10,6,2];

// Wie ungern zielt man auf dieses Feld, nur um zu stellen? Kleiner = lieber.
function stellKosten(label){
  if(label==="Bull") return 14;
  if(label==="25")   return 12;
  var m = /^([TD])?(\d+)$/.exec(label);
  if(!m) return 20;
  var k = 20 - (+m[2]);                 // auf die 20 zielt man am liebsten
  if(m[1]==="T") k += 3;                // das Triple ist schmal
  if(m[1]==="D") k += 30;               // auf einen Doppelring stellt man nicht
  return k;
}
function ausKosten(t, doubleOut){
  if(!doubleOut) return stellKosten(t.label) / 2;   // ohne Doppel-Out: einfachstes Feld
  var i = DOPPEL_VORLIEBE.indexOf(t.value);
  return i < 0 ? 30 : i;
}

// Kuerzestes Finish fuer 'score' mit hoechstens 'dartsLeft' Darts.
// Unter den gleich langen Wegen gewinnt der, den ein Mensch auch werfen wuerde.
function checkout(score, dartsLeft, doubleOut){
  if(dartsLeft<1) return null;
  if(score<=0 || score > (doubleOut?170:180)) return null;
  var finishers = doubleOut ? DOUBLES : ALLTHROWS;
  var best = null, i, j, rem;
  function nimm(weg, kosten){ if(!best || kosten < best.k) best = {w:weg, k:kosten}; }

  // 1 Dart
  for(i=0;i<finishers.length;i++)
    if(finishers[i].value===score) nimm([finishers[i].label], ausKosten(finishers[i], doubleOut));
  if(best) return best.w;
  if(dartsLeft<2) return null;

  // 2 Darts
  for(i=0;i<ALLTHROWS.length;i++){
    rem = score-ALLTHROWS[i].value; if(rem<=0) continue;
    for(j=0;j<finishers.length;j++){
      if(finishers[j].value!==rem) continue;
      nimm([ALLTHROWS[i].label, finishers[j].label],
           stellKosten(ALLTHROWS[i].label) + ausKosten(finishers[j], doubleOut));
    }
  }
  if(best) return best.w;
  if(dartsLeft<3) return null;

  // 3 Darts
  for(i=0;i<ALLTHROWS.length;i++){
    for(j=0;j<ALLTHROWS.length;j++){
      rem = score-ALLTHROWS[i].value-ALLTHROWS[j].value; if(rem<=0) continue;
      for(var k=0;k<finishers.length;k++){
        if(finishers[k].value!==rem) continue;
        // Die beiden Stellwuerfe sind austauschbar - der hoehere zuerst,
        // so wie man es ansagt ("T20, T18, D8" statt "T18, T20, D8").
        var s1 = ALLTHROWS[i], s2 = ALLTHROWS[j];
        if(s2.value > s1.value){ var tmp = s1; s1 = s2; s2 = tmp; }
        nimm([s1.label, s2.label, finishers[k].label],
             stellKosten(s1.label) + stellKosten(s2.label)
             + ausKosten(finishers[k], doubleOut));
      }
    }
  }
  return best ? best.w : null;
}

// ---------------------------------------------------------------------------
// Stell-Empfehlung: worauf werfen, wenn es nicht zum Ausmachen reicht?
//
// Beim Darts stellt man sich fuer die naechste Runde hin - am liebsten auf 32
// (D16), weil sich das beim Danebenwerfen sauber halbiert. Das hat man sonst im
// Kopf, oder eben nicht: bei Rest 41 wirft man die 9, nicht die 20.
// ---------------------------------------------------------------------------

// Wie gut steht man auf diesem Rest? Groesser = besser.
function restGuete(rest, doubleOut){
  if(rest < 2) return -1000;                        // 0 waere ein Finish, 1 ist tot
  if(doubleOut && rest === 1) return -1000;
  if(BOGEY[rest]) return -500;                      // 159, 162, 163 ... da steht man schlecht

  // Direkt auf einem Doppel: das ist die beste Lage ueberhaupt.
  var i = DOPPEL_VORLIEBE.indexOf(rest);
  if(i >= 0 && doubleOut) return 900 - i * 10;
  if(!doubleOut && rest <= 60 && checkout(rest, 1, false)) return 900;

  // Sonst: wie viele Darts braucht man noch?
  if(checkout(rest, 2, doubleOut)) return 500 - rest / 10;
  if(checkout(rest, 3, doubleOut)) return 200 - rest / 10;
  return 50 - rest / 10;                            // ausserhalb der Reichweite
}

var BOGEY = {159:1, 162:1, 163:1, 165:1, 166:1, 168:1, 169:1};

// Bei 501 und drei Darts lautet die Empfehlung immer "wirf auf die 20" - das ist
// keine Information, sondern Fuellmaterial. Gezeigt wird sie nur da, wo sie etwas
// weiss, das man sonst im Kopf haben muesste.
function stellNuetzlich(stell, dartsLeft, doubleOut){
  if(!stell) return false;
  if(doubleOut && DOPPEL_VORLIEBE.indexOf(stell.ziel) >= 0) return true;
  if(dartsLeft > 1 && checkout(stell.ziel, dartsLeft-1, doubleOut)) return true;
  return false;
}

// "32" allein sagt nur Kennern etwas. "32 (D16)" sagt es allen.
function zielName(ziel, doubleOut){
  if(!doubleOut) return "";
  if(ziel === 50) return " (Bull)";
  if(ziel % 2 === 0 && ziel/2 >= 1 && ziel/2 <= 20) return " (D"+(ziel/2)+")";
  return "";
}

// Der beste Wurf, wenn kein Finish moeglich ist. Rueckgabe {label, ziel} oder null.
function stellEmpfehlung(rest, dartsLeft, doubleOut){
  if(dartsLeft < 1) return null;
  if(checkout(rest, dartsLeft, doubleOut)) return null;   // ausspielbar: dann kein Stellen

  var best = null;
  for(var i=0;i<ALLTHROWS.length;i++){
    var w = ALLTHROWS[i];
    var ziel = rest - w.value;
    if(ziel < 2) continue;                                // Bust oder Finish, beides hier falsch
    var g = restGuete(ziel, doubleOut);
    // Wie schwer ist der Wurf selbst? Ein Single ist sicherer als ein Triple.
    g -= stellKosten(w.label) * 2;
    // Bleiben noch Darts uebrig, zaehlt zusaetzlich, ob man DANN ausmachen kann.
    if(dartsLeft > 1 && checkout(ziel, dartsLeft - 1, doubleOut)) g += 400;
    if(!best || g > best.g) best = { g:g, label:w.label, ziel:ziel };
  }
  return best ? { label:best.label, ziel:best.ziel } : null;
}

// ---------------------------------------------------------------------------
// Spiel-Logik
// ---------------------------------------------------------------------------
function rosterOf(id){ return state.roster.find(function(p){return p.id===id;}); }

// Wird state komplett ersetzt (Import, Zuruecksetzen, fremdes Fenster), muessen
// alle Spiegel mitgezogen werden. Sonst sagt der Einstellungs-Screen "Ansage aus"
// und die App redet trotzdem.
function standUebernommen(){
  if(typeof ttsOn !== "undefined") ttsOn = state.settings.tts !== false;
  h2hSel = null; h2hAuto = true; setupSel = null; playerSel = null; soloWho = null;
  sumInput = ""; pendingFinish = null; pendingOpen = null; pendingBust = null; sumMsg = "";
  fremdGeschrieben = false;
}

// Vor jedem Start: laeuft noch etwas, das sonst kommentarlos verschwindet?
// Ein gewonnenes, nicht eingetragenes Spiel ist der teuerste Fall - es waere
// aus Rangliste und Duellbilanz ersatzlos weg.
function darfUeberschreiben(){
  if(state.match && state.match.finished)
    return confirm("Das gewonnene Spiel ist noch nicht eingetragen. Wirklich verwerfen?");
  if(state.match)
    return confirm("Es läuft noch ein Spiel. Wirklich verwerfen?");
  if(state.train && !state.train.done)
    return confirm("Es läuft noch eine Übung. Wirklich abbrechen?");
  return true;
}

// "Das bin ich": in Duellen steht dieser Spieler immer links. Ohne den Marker
// entschiede die alphabetische Reihenfolge, und Lion staende mal links, mal
// rechts - bei einer Bilanz wie 3:8 muss man dann jedes Mal neu hinsehen.
function meId(){
  var id = state.settings && state.settings.meId;
  return (id && rosterOf(id)) ? id : null;
}
// Paar so drehen, dass "ich" vorne steht.
function orderPair(a, b){
  var me = meId();
  return (me && b===me && a!==me) ? [b, a] : [a, b];
}

// Wins = von Hand gepflegter Grundstand + jedes gewonnene Match aus der Historie.
function historyWins(id){
  var n=0;
  for(var i=0;i<state.history.length;i++){
    var m = state.history[i];
    if(m.players.length<2) continue;          // allein gespielt ist kein Sieg ueber jemanden
    if(m.winnerId===id) n++;
  }
  return n;
}
function totalWins(id){
  var r=rosterOf(id);
  return Math.max(0, (r?(r.winsManual||0):0) + historyWins(id));
}

function legsNeeded(m){ return Math.floor((m.bestOf||1)/2)+1; }

function freshPlayer(id, gt){
  var r = rosterOf(id);
  return {id:id, name:r?r.name:nameOf(id), score:gt, darts:0, legsWon:0,
          scored:0, best:0, tons:0, oneEighties:0, checkout:0,
          legDarts:0, legStart:true};
}

// opts: {gameType, doubleOut, doubleIn, bestOf, mode}  - fehlendes kommt aus den Einstellungen.
function startMatch(playerIds, opts){
  korrigiere = null;    // sonst gilt die naechste Ansage als Ersatz fuer einen
                        // Wurf, den es im neuen Spiel gar nicht mehr gibt
  opts = opts || {};
  var st = state.settings;
  var gt = opts.gameType || st.gameType;
  state.match = {
    id:mid(), ts:Date.now(), mode:opts.mode||"x01",
    gameType:gt,
    doubleOut: opts.doubleOut!==undefined ? !!opts.doubleOut : !!st.doubleOut,
    doubleIn:  opts.doubleIn !==undefined ? !!opts.doubleIn  : !!st.doubleIn,
    bestOf:    opts.bestOf   || st.bestOf || 1,
    players: playerIds.map(function(id){ return freshPlayer(id, gt); }),
    currentIdx:0, startIdx:0, legNo:1,
    currentTurn:[], turnStartScore:gt, lastTurn:null,
    legs:[], platz:[], finished:false, winnerId:null, _undo:[]
  };
  curMult = 1; view = "game"; save();
}

// Alles, was ein Undo wiederherstellen muss - an EINER Stelle. Wer hier ein Feld
// vergisst, baut eine Anzeige, die nach dem Zurueck weiter das Alte behauptet.
var MATCH_SNAP = ["players","currentIdx","currentTurn","turnStartScore",
                  "finished","winnerId","legNo","startIdx","legs","lastTurn","platz"];
function snapshot(){
  var m = state.match, o = {};
  for(var i=0;i<MATCH_SNAP.length;i++) o[MATCH_SNAP[i]] = m[MATCH_SNAP[i]];
  m._undo.push(JSON.stringify(o));
  // Der Stapel liegt in state und wird bei jedem Dart mitserialisiert - 80
  // Schnappschuesse waren gemessen 98 % der gespeicherten Datei (69 KB nach
  // 120 Darts). 15 Darts Undo-Tiefe reichen praktisch immer.
  while(m._undo.length>15) m._undo.shift();
}
// Rueckgabe: wurde wirklich etwas zurueckgenommen? Ohne die Antwort meldet der
// Sprachmodus "zurueck" auch dann, wenn der Stapel leer war.
function undo(){
  var m = state.match; if(!m || !m._undo.length) return false;
  var s = JSON.parse(m._undo.pop());
  // Nur Felder uebernehmen, die im Schnappschuss stehen - ein Stapel aus einer
  // aelteren Fassung kennt legs/legNo/startIdx nicht und wuerde sie auf
  // undefined setzen.
  for(var i=0;i<MATCH_SNAP.length;i++){
    var f = MATCH_SNAP[i];
    if(Object.prototype.hasOwnProperty.call(s,f)) m[f] = s[f];
  }
  curMult = 1; view = "game"; save(); render(); return true;
}

// Aufnahme abschliessen: erst die Statistik buchen, dann weiterreichen.
// Nach einem Bust ist score wieder turnStartScore -> got=0, genau richtig.
function closeTurn(kind){
  var m = state.match, p = m.players[m.currentIdx];
  var got = m.turnStartScore - p.score;
  if(got>0){
    p.scored += got;
    if(got>p.best) p.best = got;
    if(got>=100) p.tons++;
    if(got===180) p.oneEighties++;
  }
  // Was der Vorgaenger geworfen hat, muss stehen bleiben. Sonst ist ein Bust
  // vom Bildschirm nicht zu unterscheiden und "was hatt ich?" nicht zu beantworten.
  // Wer ohne Wurf weiterreicht, loescht damit aber nicht die Anzeige davor.
  if(m.currentTurn.length){
    m.lastTurn = {
      id:p.id, name:p.name, kind:kind||"ok", sum:Math.max(0,got), rest:p.score,
      labels:m.currentTurn.map(function(d){return d.label;})
    };
  }
}
var quietSay = false;   // true, solange der Sprachmodus selbst ansagt

// Ansage nach der Aufnahme: "Arne 105, Rest 396" bzw. "Ueberworfen".
// Genau das, was man beim Darts sowieso laut sagt.
function sayLastTurn(){
  if(quietSay) return;
  var lt = state.match && state.match.lastTurn; if(!lt) return;
  if(lt.kind==="bust")         say(lt.name+". Überworfen. Zurück auf "+lt.rest);
  else if(lt.kind==="nostart") say("Noch kein Doppel");
  else if(lt.kind==="ok" && lt.labels.length){
    // Nach der Aufnahme gleich sagen, worauf man sich stellt - beim weggelegten
    // Handy ist das der halbe Nutzen des Sprachmodus.
    var rat = state.match ? ratText(lt.rest, 3, state.match.doubleOut) : "";
    say(lt.name+" "+lt.sum+". Rest "+lt.rest+(rat?". "+rat:""));
  }
}

// Was jetzt sinnvoll ist - Finish oder Stellen. Wird an die Ansage angehaengt,
// damit man beim weggelegten Handy weiss, worauf man zielt.
function ratText(rest, dartsLeft, doubleOut){
  var co = checkout(rest, dartsLeft, doubleOut);
  if(co) return "Finish: " + co.map(function(l){ return sagbar(l); }).join(", ");
  var st = stellEmpfehlung(rest, dartsLeft, doubleOut);
  // Derselbe Filter wie in der Anzeige. Ohne ihn sagt sie bei 501 "stell dich mit
  // 20 auf 481" - in der Anzeige war das schon weg, gesprochen kam es weiter.
  if(st && stellNuetzlich(st, dartsLeft, doubleOut))
    return "Stell dich mit " + sagbar(st.label) + " auf " + st.ziel
           + zielName(st.ziel, doubleOut).replace(" (D", ", Doppel ").replace(")", "");
  return "";
}
// "Arne ist dran" allein hilft dem nicht, der an der Scheibe steht und das Handy
// weggelegt hat. Rest und Finish gehoeren dazu - das ist der ganze Sinn der Ansage.
function dranText(){
  var m = state.match; if(!m) return "";
  var p = m.players[m.currentIdx];
  var t = p.name + " ist dran. " + p.score;
  var r = ratText(p.score, 3, m.doubleOut);
  return r ? t + ". " + r : t;
}

// Der Fehlwurf heisst intern "&#10007;". Als Vorschlag im Satz („sag ✗ raus")
// ist das Unsinn - und escaped steht dort woertlich der Entity-Code.
function nennbar(label){ return label === "&#10007;" ? "daneben" : label; }

// "T20" -> "Triple 20", damit die Ansage nach Sprache klingt statt nach Code
function sagbar(label){
  if(label==="Bull") return "Bull";
  var m2 = /^([TD])?(\d+)$/.exec(label);
  if(!m2) return label;
  return (m2[1]==="T" ? "Triple " : m2[1]==="D" ? "Doppel " : "") + m2[2];
}

function endTurn(kind){
  var m = state.match;
  closeTurn(kind);
  sayLastTurn();
  m.currentTurn = [];
  m.currentIdx = naechsterDran(m);
  m.turnStartScore = m.players[m.currentIdx].score;
  curMult = 1;
}

// Wer sein Spiel schon ausgemacht hat, kommt nicht mehr dran - sonst wuerde der
// Sieger beim Ausspielen von Platz 2 weiter mitwerfen.
function naechsterDran(m){
  var n = m.players.length, i = m.currentIdx;
  for(var k=0;k<n;k++){
    i = (i+1) % n;
    if(!m.platz || m.platz.indexOf(m.players[i].id) < 0) return i;
  }
  return m.currentIdx;
}

function bust(){
  var m = state.match;
  var p = m.players[m.currentIdx];
  p.score = m.turnStartScore;   // ganzer Aufnahme-Wurf zurueck
  endTurn("bust");
}

// Leg gewonnen: Zwischenstand oder Matchende. Der Anwurf wechselt jedes Leg.
// Bei einem Leg und mindestens drei Leuten wird danach um Platz 2 weitergespielt -
// sonst sitzt der Abgehaengte nur da und schaut zu.
function winLeg(p){
  var m = state.match;
  if(!m.platz) m.platz = [];

  var platzSpiel = (m.bestOf||1)===1 && m.players.length>=3
                   && state.settings.platzSpiel !== false;
  if(platzSpiel){
    if(m.platz.indexOf(p.id)<0) m.platz.push(p.id);
    var offen = m.players.filter(function(q){ return m.platz.indexOf(q.id)<0; });
    if(offen.length>=2){
      // Es geht weiter: der Sieger steht fest, die anderen spielen um Platz 2.
      m.winnerId = m.platz[0];
      m.currentIdx = m.players.indexOf(offen[0]);
      m.currentTurn = []; m.turnStartScore = offen[0].score;
      m.lastTurn = null; curMult = 1;
      view = "platz";
      return;
    }
    // Nur noch einer uebrig - der bekommt den letzten Platz, Schluss.
    if(offen.length===1) m.platz.push(offen[0].id);
    p.legsWon = Math.max(p.legsWon, 0);
    m.finished = true; m.winnerId = m.platz[0]; view = "win";
    return;
  }

  p.legsWon++;
  m.legs.push({no:m.legNo, winnerId:p.id, darts:p.legDarts});
  if(p.legsWon >= legsNeeded(m)){
    m.finished = true; m.winnerId = p.id; view = "win";
    return;
  }
  m.legNo++;
  m.startIdx = (m.startIdx+1) % m.players.length;
  m.currentIdx = m.startIdx;
  m.players.forEach(function(q){ q.score=m.gameType; q.legDarts=0; q.legStart=true; });
  m.currentTurn = []; m.turnStartScore = m.gameType; curMult = 1;
  m.lastTurn = null;              // sonst steht der Ausmach-Wurf im naechsten Leg
  view = "leg";
}

// Ein Dart. mult in {1,2,3}, num in 1..20 oder 0/25/50.
// Rueckgabe: ok | bust | leg | win | nostart | noop
function applyDart(mult, num){
  var m = state.match; if(!m || m.finished) return "noop";
  if(wartetAufOk()){
    // Zu zweit sagt einer an und der andere tippt. Wer hier tippte, bekam bisher
    // gar keine Rueckmeldung - der Knopf sah normal aus, es passierte nur nichts.
    // Die Meldung sitzt in applyDart, damit sie fuer JEDEN Eingabeweg gilt.
    updateVoiceStatus('&#9757;&#65039; Die Aufnahme steht noch: <b>'
      + m.currentTurn.map(function(d){ return nennbar(d.label); }).join(" ")
      + '</b>. Sag „okay" oder tippe <b>Passt</b>.');
    return "voll";
  }
  var dv = dartValue(mult, num);
  snapshot();
  var p = m.players[m.currentIdx];
  p.darts++; p.legDarts++;
  curMult = 1;                  // gilt fuer JEDEN Ausgang - sonst bleibt Triple haengen

  // Doppel-In: bis zum ersten Doppel zaehlt kein Wurf auf das Konto. Der Wurf
  // wird mit Wert 0 gebucht, sonst zeigt die Aufnahme-Summe Punkte an, die
  // nirgendwo abgezogen wurden.
  if(m.doubleIn && p.legStart && !dv.isDouble){
    m.currentTurn.push({label:dv.label, value:0, isDouble:false, nostart:true, mult:mult, num:num});
    if(m.currentTurn.length>=3) endTurn("nostart");
    save(); render(); return "nostart";
  }
  if(m.doubleIn && p.legStart) p.legStart = false;

  m.currentTurn.push({label:dv.label, value:dv.value, isDouble:dv.isDouble, mult:mult, num:num});
  var ns = p.score - dv.value;

  if(ns===0 && (!m.doubleOut || dv.isDouble)){          // Leg ausgemacht
    var finishFrom = m.turnStartScore;
    p.score = 0;
    closeTurn((m.bestOf||1)>1 && legsNeeded(m) > p.legsWon+1 ? "leg" : "win");
    if(finishFrom > (p.checkout||0)) p.checkout = finishFrom;
    winLeg(p);
    save(); render();
    return m.finished ? "win" : (view==="platz" ? "platz" : "leg");
  }
  // Bust: unter 0, oder (Doppel-Out) genau 1, oder 0 ohne Doppel
  if(ns<0 || (m.doubleOut && ns===1) || (ns===0 && m.doubleOut && !dv.isDouble)){
    bust(); save(); render(); return "bust";
  }
  p.score = ns;
  if(m.currentTurn.length>=3 && !wartetAufOk()) endTurn();
  save(); render(); return "ok";
}

// Match abschliessen -> wandert in die Historie, aus der Rangliste und H2H entstehen.
function finishMatch(){
  var m = state.match; if(!m) return null;
  var rec = null;
  if(state.settings.keepHistory!==false && m.finished){
    rec = {
      id:m.id, ts:m.ts, ended:Date.now(), mode:m.mode, gameType:m.gameType,
      doubleOut:m.doubleOut, doubleIn:m.doubleIn, bestOf:m.bestOf, winnerId:m.winnerId,
      legs:m.legs.slice(), platz:(m.platz||[]).slice(),
      players:m.players.map(function(p){
        return {id:p.id, name:p.name, legsWon:p.legsWon, darts:p.darts, scored:p.scored,
                best:p.best, tons:p.tons, oneEighties:p.oneEighties, checkout:p.checkout,
                avg: p.darts ? +((p.scored/p.darts*3).toFixed(2)) : 0};
      })
    };
    state.history.unshift(rec);
    // Deckeln, aber nichts unterschlagen: der aelteste Sieg wird eingefroren,
    // sonst sinkt die Rangliste beim 501. Spiel stillschweigend.
    capHistory();
  }
  state.match = null;
  fremdGeschrieben = false;   // sonst verwirft "Fremden Stand laden" die eben gebuchte Partie
  save();
  return rec;
}

// Alte Spiele wegwerfen, aber nichts unterschlagen: der Sieg wandert in den
// Handeintrag, und der beste Solo-Lauf je Startwert bleibt stehen - sonst
// verschwindet ein Rekord, den die App zwei Zeilen weiter noch anzeigt.
function capHistory(){
  if(state.history.length<=500) return;
  var behalten = state.history.slice(0,500);
  var drin = {};
  behalten.forEach(function(m){ drin[m.id] = true; });
  var rest = state.history.slice(500);
  var beste = {};
  rest.forEach(function(m){
    if(!m.players || m.players.length!==1) return;
    var p = m.players[0]; if(!p.darts) return;
    var k = p.id+"|"+m.gameType;
    if(!beste[k] || p.darts < beste[k].players[0].darts) beste[k] = m;
  });
  rest.forEach(function(m){
    if(m.players && m.players.length>=2 && m.winnerId){
      var rr = rosterOf(m.winnerId);
      if(rr) rr.winsManual = (rr.winsManual||0)+1;
    }
  });
  for(var k2 in beste){
    var b = beste[k2];
    // Nur behalten, wenn es kein besseres unter den behaltenen gibt.
    var besser = behalten.some(function(m){
      return m.players && m.players.length===1 && m.players[0].id===b.players[0].id
        && m.gameType===b.gameType && m.players[0].darts && m.players[0].darts <= b.players[0].darts;
    });
    if(!besser && !drin[b.id]) behalten.push(b);
  }
  // Der gerettete Rekord wird hinten angehaengt - danach wieder nach Zeit
  // ordnen, sonst steht er mitten in der Reihe.
  behalten.sort(function(a,b){ return (b.ended||b.ts||0)-(a.ended||a.ts||0); });
  state.history = behalten;
}

// Wins von Hand aendern: der Handeintrag ist ein Offset auf die gespielten Siege.
function bumpWins(id, delta){
  var r = rosterOf(id); if(!r) return;
  if(totalWins(id)+delta < 0) return;
  r.winsManual = (r.winsManual||0) + delta; save();
}
function setWins(id, val){
  var r = rosterOf(id); if(!r) return;
  r.winsManual = Math.max(0, Math.round(val||0)) - historyWins(id); save();
}

// ---------------------------------------------------------------------------
// Roster-Verwaltung
// ---------------------------------------------------------------------------
// Ist dieser Schluessel schon vergeben - im Team ODER in den Aufzeichnungen?
function idBelegt(id){
  if(state.roster.some(function(p){return p.id===id;})) return true;
  for(var i=0;i<state.history.length;i++){
    var ps = state.history[i].players||[];
    for(var j=0;j<ps.length;j++) if(ps[j].id===id) return true;
  }
  for(var k=0;k<state.practice.length;k++) if(state.practice[k].playerId===id) return true;
  return false;
}

function slug(name){
  return name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") || ("p"+Date.now());
}
function addPlayer(name, guest){
  name = (name||"").trim(); if(!name) return null;
  var id = slug(name);
  // Auch gegen die Historie pruefen: sonst erbt ein namensgleicher Neuling die
  // Siege eines geloeschten Spielers.
  while(idBelegt(id)) id += "x";
  state.roster.push({id:id, name:name, winsManual:0, guest:!!guest});
  save();
  return id;
}

// 3-Dart-Schnitt. Die laufende Aufnahme zaehlt live mit, sonst springt die Zahl erst
// beim Spielerwechsel - das sieht auf dem Board aus wie ein Fehler.
function avgOf(p){
  var m = state.match, sc = p.scored||0, d = p.darts||0;
  if(m && !m.finished && m.players[m.currentIdx]===p) sc += Math.max(0, m.turnStartScore - p.score);
  return d ? (sc/d*3).toFixed(1) : "0.0";
}

// ---------------------------------------------------------------------------
// Summen-Eingabe: die ganze Aufnahme auf einmal
// An der Scheibe ruft einer "einundachtzig" - dann will man 81 tippen und nicht
// drei Darts einzeln. Der Einzel-Modus bleibt fuer alle, die genau zaehlen wollen.
// ---------------------------------------------------------------------------

// Welche Summen sind mit drei Darts ueberhaupt erreichbar? 179, 178, 176, 175,
// 173, 172, 169, 166 und 163 stehen so nicht auf dem Board - wer sie eintippt,
// hat sich vertippt.
var AUFNAHME_MOEGLICH = (function(){
  var w = {0:1, 25:1, 50:1};
  for(var n=1;n<=20;n++){ w[n]=1; w[n*2]=1; w[n*3]=1; }
  var einzeln = Object.keys(w).map(Number);
  var s = {};
  for(var a=0;a<einzeln.length;a++)
    for(var b=0;b<einzeln.length;b++)
      for(var c=0;c<einzeln.length;c++) s[einzeln[a]+einzeln[b]+einzeln[c]] = true;
  return s;
})();

// Eine komplette Aufnahme buchen. dartsUsed nur beim Ausmachen relevant.
// Rueckgabe: ok | bust | leg | win | finish | ungueltig | noop
// opened: undefined = die App muss fragen, true = mit Doppel eroeffnet,
// false = ausdruecklich ohne. Ohne diese Unterscheidung war Doppel-In im
// Summen-Modus schlicht wirkungslos, waehrend der Schirm das Gegenteil behauptete.
function applyTurnSum(sum, dartsUsed, opened){
  var m = state.match; if(!m || m.finished) return "noop";
  sum = Math.round(sum);
  if(!(sum>=0 && sum<=180) || !AUFNAHME_MOEGLICH[sum]) return "ungueltig";
  var p = m.players[m.currentIdx];

  if(m.doubleIn && p.legStart){
    if(opened===undefined) return "needopen";
    if(opened===false){                      // geworfen, aber nicht eroeffnet
      snapshot();
      var dn = dartsUsed || 3;
      p.darts += dn; p.legDarts += dn;
      m.currentTurn = [{label:String(sum), value:0, sum:true, nostart:true}];
      endTurn("nostart");
      save(); render(); return "nostart";
    }
    p.legStart = false;
  }

  var ns = p.score - sum;

  // Ausgemacht: fuer die Statistik zaehlt, mit wie vielen Darts. Und bei
  // Doppel-Out weiss die App nicht, ob "20" ein Doppel 10 oder eine Single 20
  // war - sie muss fragen, statt einen regelwidrigen Sieg zu buchen.
  if(ns===0 && !dartsUsed) return "finish";
  if((ns<0 || (m.doubleOut && ns===1)) && !dartsUsed) return "bustfrage";

  snapshot();
  var d = dartsUsed || 3;
  p.darts += d; p.legDarts += d;
  m.currentTurn = [{label:String(sum), value:sum, sum:true}];

  if(ns===0){
    p.score = 0;
    closeTurn((m.bestOf||1)>1 && legsNeeded(m) > p.legsWon+1 ? "leg" : "win");
    if(m.turnStartScore > (p.checkout||0)) p.checkout = m.turnStartScore;
    if(!quietSay) say(p.name + " macht aus.");   // sayLastTurn kennt "leg"/"win" nicht
    winLeg(p);
    save(); render();
    return m.finished ? "win" : (view==="platz" ? "platz" : "leg");
  }
  if(ns<0 || (m.doubleOut && ns===1)){
    // Die drei Darts wurden oben schon gebucht; wenn der Aufrufer eine echte
    // Zahl kennt, steht sie in dartsUsed und wurde verwendet.
    bust(); save(); render(); return "bust";
  }
  p.score = ns;
  endTurn();
  save(); render(); return "ok";
}

        + (multi?' &middot; <b class="legz">'+p.legsWon+'</b>':'')+'</div>'
      + '</div>';
  }).join("");

  var slots = "";
  for(var i=0;i<3;i++){
    var d = m.currentTurn[i];
    var cls = d ? (d.nostart ? " filled dead" : " filled") : "";
    slots += '<div class="slot'+cls+'">'+(d?d.label:"&middot;")+'</div>';
  }
  var turnSum = m.currentTurn.reduce(function(s,d){return s+d.value;},0);
  var rest3 = 3-m.currentTurn.length;
  var co = (m.doubleIn && cur.legStart)
    ? null : checkout(cur.score, rest3, m.doubleOut);
  var stell = (co || (m.doubleIn && cur.legStart))
    ? null : stellEmpfehlung(cur.score, rest3, m.doubleOut);
  if(!stellNuetzlich(stell, rest3, m.doubleOut)) stell = null;
  var coHtml;
  if(m.doubleIn && cur.legStart) coHtml = '<span class="co">Doppel-In: erst ein Doppel eröffnet</span>';
  else if(co)    coHtml = '<span class="co">Finish: '+co.join(" ")+'</span>';
  else if(stell) coHtml = '<span class="co stell">Stellen: <b>'+stell.label+'</b> &rarr; '
                          + stell.ziel + zielName(stell.ziel, m.doubleOut)+'</span>';
  else           coHtml = '<span class="muted">&nbsp;</span>';

  function mb(mv,l){ return '<button class="btn'+(curMult===mv?" on":"")+'" data-act="mult" data-m="'+mv+'">'+l+'</button>'; }
  var nums = "";
  for(var nn=1;nn<=20;nn++) nums += '<button class="btn" data-act="num" data-n="'+nn+'">'+nn+'</button>';

  return h()
    + gameHead(m, multi)
    + '<div class="board">'+cards+'</div>'
    + '<div class="turn">'
    + (sumMode() ? '' : '<div class="slots">'+slots+'</div>')
    + '<div class="info">'+coHtml
    +   (sumMode() ? '<span class="sum">Rest <b>'+cur.score+'</b></span>'
                   : '<span class="sum">Aufnahme: <b>'+turnSum+'</b></span>')
    + '</div>'
    + '</div>'
    + versionsHinweis()
    + syncPille()
    + (wartetAufOk()
        ? '<div class="warteok">Stimmt das? Sag <b>„okay"</b> &ndash; oder <b>„'
          + esc(nennbar(m.currentTurn[0].label))+' raus"</b>, um einen Wurf zu ändern.'
          + '<div class="warterow">'
          +   '<button class="btn wok" data-act="wok">&#10003;&nbsp; Passt</button>'
          +   '<button class="btn" data-act="undo">&#8630;&nbsp; Zurück</button>'
          + '</div></div>'
        : '')
    + lastTurnLine(m)
    + '<div class="seg modeseg">'
    +   '<button class="btn'+(sumMode()?"":" on")+'" data-act="imode" data-v="single">Einzeln</button>'
    +   '<button class="btn'+(sumMode()?" on":"")+'" data-act="imode" data-v="sum">Ganze Aufnahme</button>'
    + '</div>'
    + (sumMode() ? renderSumPad(m, cur)
       : '<div class="mult">'+mb(1,"Single")+mb(2,"Double")+mb(3,"Triple")+'</div>'
         + '<div class="pad">'+nums
         + '<button class="btn miss" data-act="num" data-n="0">Miss</button>'
         + '<button class="btn" data-act="num" data-n="25">25</button>'
         + '<button class="btn bull" data-act="num" data-n="50">Bull</button>'
         + '</div>')
    + '<div class="gctl">'
    + '<button class="btn" data-act="undo" style="flex:2">&#8630;&nbsp; '
      + (sumMode() ? 'Aufnahme zurück' : 'Wurf zurück') + '</button>'
    + (sumMode() ? '' : '<button class="btn ghost sm skipbtn" data-act="skip">Aufnahme<br>beenden &#8594;</button>')
    + '</div>'
    + '<div class="voice">'
    + '<div class="vhead">'
    + '<button class="micbtn'+(voiceOn?" on":"")+'"'+(SR?"":" disabled")+' data-act="voice">'
      + (voiceOn ? '&#127908; &#9679; Hört zu … (tippen = Stopp)' : '&#127908; Würfe ansagen') + '</button>'
    + '<button class="ttsbtn'+(ttsOn?"":" off")+'" data-act="tts" title="Ansage laut/leise">'
      + (ttsOn?'&#128266;':'&#128263;') + '</button>'
    + '</div>'
    + '<div class="vstat" id="voiceStatus"></div>'
    + '<div class="vhint">'
    + 'Sag z.B. „<b>Triple 20, 20, Doppel 5</b>" &middot; „Bull" &middot; „daneben" &middot; „<b>zurück</b>"</div>'
    + '</div>'
    + '<button class="btn ghost danger sm" data-act="quit" style="width:auto;margin:12px auto 0">Spiel abbrechen</button>';
}
